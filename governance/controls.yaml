    category: compliance
    statement: Les changements infrastructure significatifs suivent plan, Independent Reviewer, Human Gate, puis apply avec preuve liée.
    rationale: Séparer préparation, revue et autorisation des mutations à fort impact.
    scope: [terraform, ansible, kubernetes, gitops, production]
    environments: [preproduction, production, management]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/resilience-evidence-operations.md, notes: Workflow de changement et preuves.}
      - {type: independent_review, status: PLANNED, reference: significant-change-review-record, notes: Gate humain runtime non franchi dans ce milestone.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: GV.PO, relationship: SUPPORTS, notes: Politique de gouvernance des changements.}
      - {framework: NIST_SSDF_1_1, control: PO.3, relationship: SUPPORTS, notes: Rôles et responsabilités du processus.}
    exception_allowed: false
    owner_role: operations
    implementation_notes: Les actions destructives, payantes ou distantes exigent une autorisation distincte.

  - id: H3-001
    title: Production HTTP/3 edge requirement
    category: edge-protocol
    statement: Caddy edge doit offrir HTTP/3 over QUIC en production avec UDP/443 gouverné, H2 obligatoire et H1.1 si nécessaire.
    rationale: Définir explicitement la cible edge sans imposer QUIC east-west ni déclarer une preuve inexistante.
    scope: [caddy-edge, production-network, clients]
    environments: [production]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/architecture/adr-http3-production-edge.md, notes: ADR et conditions réseau/protocole.}
      - {type: test, status: AVAILABLE, path: scripts/validate-governance.py, notes: Target et fallbacks vérifiés statiquement.}
      - {type: runtime_probe, status: PLANNED, path: scripts/test-http3.sh, notes: Aucun endpoint implicite et aucune mutation.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: PR.IR, relationship: SUPPORTS, notes: Résilience et compatibilité du service edge.}
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-12, relationship: SUPPORTS, notes: Communications sécurisées.}
    exception_allowed: false
    owner_role: platform
    implementation_notes: Target Internet vers Caddy H3/QUIC puis Istio/services; TCP/443 fallback reste disponible.

  - id: H3-002
    title: HTTP/3 0-RTT replay safety
    category: edge-protocol
    statement: 0-RTT est désactivé par défaut et interdit pour opérations non idempotentes, auth, checkout, payment, refund et admin.
    rationale: Les early data QUIC peuvent être rejouées et corrompre des opérations à effet de bord.
    scope: [caddy-edge, api, checkout, payment, admin]
    environments: [production]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/architecture/adr-http3-production-edge.md, notes: 0-RTT disabled-by-default.}
      - {type: test, status: AVAILABLE, path: scripts/validate-governance.py, notes: Valeur canonique contrôlée.}
    framework_mappings:
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-2, relationship: SUPPORTS, notes: Intégrité de logique métier et opérations.}
      - {framework: NIST_CSF_2_0, control: PR.DS, relationship: SUPPORTS, notes: Intégrité des échanges.}
