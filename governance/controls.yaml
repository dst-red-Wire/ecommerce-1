      - {type: config, status: AVAILABLE, path: infrastructure/hetzner/staging/.terraform.lock.hcl, notes: Providers Terraform verrouillés.}
    framework_mappings:
      - {framework: NIST_SSDF_1_1, control: PW.4, relationship: SUPPORTS, notes: Réutiliser et maintenir des composants sécurisés.}
      - {framework: SLSA_1_2, control: Build consistent process, relationship: SUPPORTS, notes: Processus de build prévisible.}
    exception_allowed: true
    owner_role: platform
    implementation_notes: Les résultats non byte-for-byte sont marqués REPRODUCIBILITY_TARGET avec leur delta.

  - id: SDLC-001
    title: Secure SDLC
    category: sdlc
    statement: >-
      Le flux minimal est design, threat/privacy review, code, tests, analyses statiques et secrets/dépendances/IaC,
      SBOM/provenance/signature, validation staging, promotion gouvernée, production et monitoring continu.
    rationale: Rendre les contrôles prévisibles, revus et exécutables sur tout le cycle de livraison.
    scope: [source, ci, artifacts, gitops, runtime]
    environments: [development, integration, preproduction, production]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/secure-design-sdlc.md, notes: Cycle et acceptance criteria.}
      - {type: config, status: AVAILABLE, path: docs/architecture/devsecops-delivery.md, notes: Pipeline et frontières de promotion.}
    framework_mappings:
      - {framework: NIST_SSDF_1_1, control: PO-PW-PS-RV, relationship: SUPPORTS, notes: Cycle SSDF 1.1 complet par pratiques.}
      - {framework: NIST_SSDF_1_2_DRAFT, control: monitored-evolution, relationship: INFORMATIVE, notes: Évolution surveillée; aucune baseline finale sur le draft.}
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0, relationship: SUPPORTS, notes: Baseline web et API.}
    exception_allowed: false
    owner_role: application
    implementation_notes: Une validation statique ne promeut jamais automatiquement un statut runtime.

  - id: SDLC-002
    title: Vulnerability Management
    category: sdlc
    statement: Sources, dépendances, images, IaC, secrets, SBOM et contexte d'exploitabilité sont analysés; aucun finding n'est ignoré silencieusement.
    rationale: Prioriser le risque exploitable et conserver une décision révisable pour tout risque accepté.
    scope: [source, dependencies, containers, iac, sbom]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/vulnerability-dependency.md, notes: "Triage, remediation et exceptions."}
      - {type: scanner, status: AVAILABLE, path: scripts/ci-security.sh, notes: Gitleaks et Trivy local.}
    framework_mappings:
      - {framework: NIST_SSDF_1_1, control: RV.1, relationship: SUPPORTS, notes: Identifier et confirmer les vulnérabilités.}
      - {framework: NIST_SSDF_1_1, control: RV.2, relationship: SUPPORTS, notes: "Évaluer, prioriser et remédier."}
      - {framework: NIST_CSF_2_0, control: ID.RA, relationship: SUPPORTS, notes: Évaluation du risque.}
    exception_allowed: true
    owner_role: security
    implementation_notes: Un CRITICAL/HIGH exploitable en production ne peut pas être accepté silencieusement; aucun SLA chiffré n'est inventé.

  - id: SDLC-003
    title: Dependency and EOL Management
    category: sdlc
    statement: Les dépendances et runtimes production sont pinnés, verrouillés, maintenus et non EOL; toute major update est revue avant production.
    rationale: Éviter le drift, les upgrades non évalués et les composants sans correctifs de sécurité.
    scope: [application-dependencies, runtimes, build-tools, infrastructure-tools]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/vulnerability-dependency.md, notes: "Pinning, lockfiles, EOL et update review."}
      - {type: test, status: AVAILABLE, path: scripts/check-security-tool-versions.sh, notes: Drift Gitleaks et Trivy bloqué.}
    framework_mappings:
      - {framework: NIST_SSDF_1_1, control: PW.4, relationship: SUPPORTS, notes: Acquérir et maintenir des composants sûrs.}
      - {framework: NIST_CSF_2_0, control: PR.PS, relationship: SUPPORTS, notes: Maintenance des plateformes.}
    exception_allowed: true
    owner_role: security
    implementation_notes: Le processus automatisé d'update reste futur; les versions canoniques sont contrôlées maintenant.

  - id: OBS-001
    title: Security Logging and Auditability
    category: observability
    statement: >-
      Les logs structurés portent correlation IDs, événements authn/authz, actions admin, provenance de déploiement,
      commit/digest, protocole h1/h2/h3 et temps synchronisé sans secrets ni PII inutile.
    rationale: Permettre détection, investigation et attribution sans créer une nouvelle fuite de données.
    scope: [applications, edge, identity, ci, gitops, infrastructure]
    environments: [integration, preproduction, production, management]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/resilience-evidence-operations.md, notes: Événements et restrictions de logs.}
      - {type: test, status: PLANNED, reference: runtime-audit-observability-probe, notes: Couverture et retention à prouver.}
    framework_mappings:
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-16, relationship: SUPPORTS, notes: Logging sécurité et gestion d'erreurs.}
      - {framework: NIST_CSF_2_0, control: DE.CM, relationship: SUPPORTS, notes: Monitoring continu.}
    exception_allowed: false
    owner_role: operations
    implementation_notes: La durée d'audit reste TBD_REQUIRES_BUSINESS_OR_LEGAL_APPROVAL.

  - id: OBS-002
    title: Evidence-driven continuous verification
    category: observability
    statement: Toute claim runtime critique exige une probe bornée, reproductible, sanitized, reviewable et liée au contrôle concerné.
    rationale: Documentation compatibility et validation statique ne prouvent pas le comportement runtime.
    scope: [runtime-evidence, promotion, reviews]
    environments: [integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_APPLICABLE
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/resilience-evidence-operations.md, notes: Modèle de preuve et statuts.}
      - {type: test, status: AVAILABLE, path: scripts/validate-governance.py, notes: PROVEN_RUNTIME refusé sans preuve.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: DE.CM, relationship: SUPPORTS, notes: Vérification continue des contrôles.}
      - {framework: SLSA_1_2, control: Verifying artifacts, relationship: PARTIAL, notes: Preuves liées et vérifiables.}
    exception_allowed: false
    owner_role: security
    implementation_notes: Le chemin critique est static validation, JIT probe, evidence, independent review puis PROVEN_RUNTIME.

  - id: RES-001
    title: Backup and Restore Proof
    category: resilience
    statement: Les données stateful ont des backups protégés hors hôte et des restore-tests périodiques avant dépendance production.
    rationale: Un backup non restauré ne constitue pas une preuve de récupérabilité.
    scope: [postgresql, mongodb, object-storage, terraform-state, git, registry]
    environments: [preproduction, production, management]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
