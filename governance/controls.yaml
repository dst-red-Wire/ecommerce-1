      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-12, relationship: SUPPORTS, notes: Communications sécurisées.}
      - {framework: NIST_CSF_2_0, control: PR.DS, relationship: SUPPORTS, notes: Données protégées en transit et au repos.}
    exception_allowed: true
    owner_role: security
    implementation_notes: Les choix algorithmiques suivent une baseline versionnée et révisable.

  - id: SUPPLY-001
    title: SLSA Build maturity target
    category: supply-chain
    statement: Les artifacts production ciblent SLSA v1.2 Build L3 uniquement si le builder satisfait et prouve toutes les exigences associées.
    rationale: Éviter une claim de maturité fondée sur la seule présence de provenance ou de documentation.
    scope: [tekton, builder, production-artifacts]
    environments: [integration, preproduction, production]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/supply-chain-policy.md, notes: Maturité actuelle et chemin vers L3.}
      - {type: provenance, status: PLANNED, reference: verified-slsa-v1.2-provenance, notes: Preuve authentifiée et builder isolé à établir.}
    framework_mappings:
      - {framework: SLSA_1_2, control: Build L3, relationship: SUPPORTS, notes: "Cible conditionnelle, jamais claim actuelle."}
      - {framework: NIST_SSDF_1_1, control: PS.2, relationship: SUPPORTS, notes: Vérifier l'intégrité des releases.}
    exception_allowed: false
    owner_role: platform
    implementation_notes: État courant non revendiqué; baseline puis provenance, authenticité, isolation et vérification au déploiement.

  - id: SUPPLY-002
    title: SLSA Source Track
    category: supply-chain
    statement: La source doit être versionnée, ses révisions immuables et les contrôles de revue/protection mesurés selon SLSA v1.2 Source Track.
    rationale: La sécurité du build ne compense pas une source non gouvernée ou une révision ambiguë.
    scope: [git, source-review, branch-protection]
    environments: [development, integration, preproduction, production]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/supply-chain-policy.md, notes: Source Track et preuves attendues.}
      - {type: test, status: AVAILABLE, path: scripts/test-source-immutability.sh, notes: Tests statiques de révisions et promotion.}
    framework_mappings:
      - {framework: SLSA_1_2, control: Source L1-L4, relationship: PARTIAL, notes: Niveau réel à mesurer par branche sans claim actuelle.}
      - {framework: NIST_SSDF_1_1, control: PO.3, relationship: SUPPORTS, notes: Implémenter des rôles et processus de développement.}
    exception_allowed: false
    owner_role: security
    implementation_notes: La configuration Gitea/GitHub actuelle ne prouve encore aucun niveau Source Track revendiqué.

  - id: SUPPLY-003
    title: SBOM par artifact production
    category: supply-chain
    statement: Chaque image production possède un SBOM CycloneDX ou SPDX lié au digest, généré automatiquement, archivé avec provenance et scan.
    rationale: Permettre traçabilité, investigation de vulnérabilités et vérification de composition.
    scope: [container-images, ci, registry, evidence]
    environments: [preproduction, production]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/supply-chain-policy.md, notes: "Format, binding digest et archivage."}
      - {type: config, status: AVAILABLE, path: gitops/infrastructure/tekton-ci/tasks/generate-sbom.yaml, notes: Génération SBOM Tekton prévue.}
      - {type: sbom, status: PLANNED, reference: production-artifact-sbom, notes: Aucun artifact production vérifié dans ce milestone.}
    framework_mappings:
      - {framework: NIST_SSDF_1_1, control: PS.3, relationship: SUPPORTS, notes: Archiver et protéger les données de release.}
      - {framework: SLSA_1_2, control: Build provenance, relationship: PARTIAL, notes: SBOM lié au subject digest et à la provenance.}
    exception_allowed: false
    owner_role: security
    implementation_notes: L'absence d'un SBOM lié interdit la promotion production.

  - id: SUPPLY-004
    title: Signature et provenance vérifiées
    category: supply-chain
    statement: Images, provenance et attestations SBOM sont signées et vérifiées avant promotion, avec trust root distinct du build utilisateur.
    rationale: Empêcher substitution d'artifact, provenance forgée et promotion sans identité vérifiée.
    scope: [tekton-chains, cosign, registry, promotion, flux]
    environments: [integration, preproduction, production]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/supply-chain-policy.md, notes: Sigstore/Cosign et identité OIDC future.}
      - {type: config, status: AVAILABLE, path: gitops/infrastructure/tekton-ci/tasks/verify-promotion-proof.yaml, notes: Vérification cryptographique statique.}
      - {type: signature_verification, status: PLANNED, reference: production-signature-verification, notes: REQUIRES_RUNTIME_VALIDATION.}
    framework_mappings:
      - {framework: SLSA_1_2, control: Build L2-L3 provenance authenticity, relationship: SUPPORTS, notes: Provenance authentifiée puis infalsifiable.}
      - {framework: NIST_SSDF_1_1, control: PS.2, relationship: SUPPORTS, notes: Mécanismes d'intégrité de release.}
    exception_allowed: false
    owner_role: security
    implementation_notes: Keyless/OIDC est préféré si l'environnement futur le permet; aucune clé réelle n'est provisionnée ici.

  - id: SUPPLY-005
    title: Promotion immutable par digest
    category: supply-chain
    statement: Production consomme uniquement des digests immuables depuis des registries approuvés; latest est interdit et les tags restent informatifs.
    rationale: Une promotion doit désigner exactement les octets scannés, attestés et signés.
    scope: [harbor, ghcr, gitops, kubernetes, container-images]
    environments: [preproduction, production]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: test, status: AVAILABLE, path: scripts/ci-supply-chain.sh, notes: Images mutables et non épinglées refusées.}
      - {type: policy_test, status: AVAILABLE, path: security/opa/kubernetes/kubernetes_test.rego, notes: Digests requis en production.}
    framework_mappings:
      - {framework: SLSA_1_2, control: Verifying artifacts, relationship: SUPPORTS, notes: Le subject digest est lié à l'artifact consommé.}
      - {framework: NIST_SSDF_1_1, control: PS.2, relationship: SUPPORTS, notes: Intégrité des releases.}
    exception_allowed: false
    owner_role: platform
    implementation_notes: Flux déploie le digest inscrit dans Git après scan, SBOM, provenance, signature et vérification.

  - id: IMM-001
    title: Immutable Infrastructure
    category: infrastructure
    statement: Les changements normaux de production passent par Git, Terraform, Ansible ou GitOps; les artifacts applicatifs restent immuables.
    rationale: Supprimer le drift manuel durable tout en distinguant infrastructure déclarative et données stateful persistantes.
    scope: [terraform, ansible, gitops, production-artifacts, stateful-data]
    environments: [production, management]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/infrastructure-security.md, notes: Immutabilité pragmatique et break-glass.}
      - {type: test, status: AVAILABLE, path: scripts/test-source-immutability.sh, notes: Contrôles statiques de source et promotion.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: PR.PS, relationship: SUPPORTS, notes: Gestion de configuration des plateformes.}
      - {framework: NIST_SSDF_1_1, control: PO.5, relationship: SUPPORTS, notes: Sécuriser les environnements de développement et livraison.}
    exception_allowed: true
    owner_role: platform
    implementation_notes: Une VM stateful n'est pas détruite artificiellement; une réparation durable retourne dans la source déclarative.

  - id: IMM-002
    title: Reproducible Infrastructure
    category: infrastructure
    statement: Outils, providers, collections, modules, images de base et dépendances sont pinnés et vérifiés avec des entrées explicites.
    rationale: Réduire les différences cachées et rendre les validations répétables sur des environnements propres.
    scope: [terraform, ansible, containers, ci, generated-files]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
