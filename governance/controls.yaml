schema_version: 1
governance_claim:
  certification_claimed: false
  legal_advice: false
  statement: >-
    Ce registre décrit des exigences, des contrôles et des preuves du projet; il ne constitue
    ni une certification, ni une attestation de conformité juridique ou réglementaire.
status_models:
  enforcement: [DOCUMENTED, STATICALLY_ENFORCED, RUNTIME_ENFORCED, PLANNED]
  runtime_evidence: [PROVEN_RUNTIME, NOT_PROVEN_RUNTIME, NOT_APPLICABLE]
architecture_requirements:
  H3_REQUIRED_FOR_PRODUCTION_EDGE: true
  HTTP2_FALLBACK_REQUIRED: true
  HTTP1_FALLBACK_REQUIRED_WHEN_NEEDED: true
  ZERO_RTT_POLICY: DISABLED_BY_DEFAULT
  TARGET_SLSA_BUILD_LEVEL: L3_CONDITIONAL_ON_BUILDER_VALIDATION
runtime_proofs:
  - capability: remote identity
    status: PROVEN_RUNTIME
    evidence: &prior-runtime
      - type: runtime_probe
        status: EXTERNAL_REVIEWED
        reference: prior-runtime-evidence-register
        notes: Preuve établie avant ce milestone repository-only et conservée hors dépôt.
  - capability: volume attachment
    status: PROVEN_RUNTIME
    evidence: *prior-runtime
  - capability: volume mount
    status: PROVEN_RUNTIME
    evidence: *prior-runtime
  - capability: PostgreSQL
    status: PROVEN_RUNTIME
    evidence: *prior-runtime
  - capability: TLS
    status: PROVEN_RUNTIME
    evidence: *prior-runtime
  - capability: SCRAM
    status: PROVEN_RUNTIME
    evidence: *prior-runtime
  - capability: PGDATA
    status: PROVEN_RUNTIME
    evidence: *prior-runtime
  - capability: Ansible idempotence
    status: PROVEN_RUNTIME
    evidence: *prior-runtime
  - capability: Terraform PG backend
    status: PROVEN_RUNTIME
    evidence: *prior-runtime
  - capability: Terraform PG locking
    status: PROVEN_RUNTIME
    evidence: *prior-runtime
  - capability: reboot persistence
    status: PROVISIONAL_RUNTIME_PASS
    evidence:
      - type: independent_review
        status: PLANNED
        reference: independent-reboot-persistence-review
        notes: Revue indépendante séparée requise; aucune promotion de statut dans ce milestone.
  - capability: HTTP/3 production edge
    status: NOT_PROVEN_RUNTIME
    evidence:
      - type: runtime_probe
        status: PLANNED
        path: scripts/test-http3.sh
        notes: Harness créé; aucun endpoint production-like n'est testé dans ce milestone.
  - capability: Management backend
    status: NOT_MIGRATED
    evidence:
      - type: config
        status: AVAILABLE
        path: docs/architecture/terraform-state-backend.md
        notes: La migration est explicitement hors périmètre de ce milestone.

controls:
  - id: ARCH-001
    title: Secure by Design gate
    category: architecture
    statement: >-
      Tout composant significatif doit documenter assets, trust boundaries, authn, authz,
      secrets, classification, défaillances, abuse cases, logs, recovery, dépendances et critères
      de sécurité avant implémentation.
    rationale: Empêcher le passage direct idea-to-code des changements à risque.
    scope: [architecture, applications, platform, data]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_APPLICABLE
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/secure-design-sdlc.md, notes: Gate et livrables requis.}
      - {type: test, status: AVAILABLE, path: scripts/validate-governance.py, notes: Présence et cohérence validées.}
    framework_mappings:
      - {framework: NIST_SSDF_1_1, control: PO.1, relationship: SUPPORTS, notes: Préparer les rôles et exigences de développement sécurisé.}
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-15, relationship: SUPPORTS, notes: Architecture et secure coding.}
      - {framework: NIST_CSF_2_0, control: GV.PO, relationship: SUPPORTS, notes: Politique de gestion du risque cyber.}
    exception_allowed: false
    owner_role: security
    implementation_notes: Le template threat model est le livrable minimal pour un changement significatif.

  - id: ARCH-002
    title: Threat modeling continu
    category: architecture
    statement: Tout changement significatif doit mettre à jour un threat model STRIDE et ses risques résiduels avant promotion.
    rationale: Les nouvelles frontières et data flows créent des risques qui doivent être visibles avant le runtime.
    scope: [architecture, applications, platform, supply-chain]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_APPLICABLE
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/threat-modeling.md, notes: "Méthode, cadence et responsabilités."}
      - {type: config, status: AVAILABLE, path: docs/security/threat-model-template.md, notes: Template réutilisable.}
      - {type: config, status: AVAILABLE, path: docs/architecture/threat-model.md, notes: Modèle initial ecommerce-1.}
    framework_mappings:
      - {framework: NIST_SSDF_1_1, control: PW.1, relationship: SUPPORTS, notes: Concevoir selon les exigences de sécurité.}
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-15, relationship: SUPPORTS, notes: Analyse d'architecture applicative.}
      - {framework: NIST_CSF_2_0, control: ID.RA, relationship: SUPPORTS, notes: Évaluation et traitement des risques.}
    exception_allowed: false
    owner_role: security
    implementation_notes: Le delta du threat model est revu avec le design, pas après déploiement.

  - id: ARCH-003
    title: Isolation des environnements
    category: architecture
    statement: DEV, integration, preproduction, production et management ont des secrets, credentials, données et décisions policy séparés.
    rationale: Une confiance ou un état partagé permettrait une propagation inter-environnements.
    scope: [platform, identity, data, gitops]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/infrastructure-security.md, notes: Frontières et promotion par digest.}
      - {type: config, status: AVAILABLE, path: governance/environments.yaml, notes: Modèle machine-readable des environnements.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: PR.AA, relationship: SUPPORTS, notes: Accès et identités séparés.}
      - {framework: ISO_IEC_27001_2022, control: A.8.31, relationship: INFORMATIVE, notes: Séparation des environnements.}
    exception_allowed: false
    owner_role: platform
    implementation_notes: La promotion réutilise le même digest et ne réutilise jamais directement un state.

  - id: SEC-001
    title: Secure by Default
    category: security
    statement: >-
      Les valeurs par défaut imposent deny-by-default, authentification sauf exposition publique explicite,
      chiffrement, absence de credentials admin par défaut, de debug production et de secrets en clair.
    rationale: Les oublis de configuration ne doivent pas créer une exposition permissive.
    scope: [applications, platform, infrastructure]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/secure-design-sdlc.md, notes: Baseline secure-by-default.}
      - {type: policy_test, status: AVAILABLE, path: security/opa/kubernetes/kubernetes_test.rego, notes: Contrôles Kubernetes négatifs et positifs.}
    framework_mappings:
      - {framework: NIST_SSDF_1_1, control: PW.9, relationship: SUPPORTS, notes: Configurer le logiciel de manière sécurisée.}
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-13, relationship: SUPPORTS, notes: Configuration sécurisée.}
      - {framework: NIST_CSF_2_0, control: PR.PS, relationship: SUPPORTS, notes: Sécurisation des plateformes.}
    exception_allowed: true
    owner_role: security
    implementation_notes: Toute exception est ciblée, expirante et référencée dans governance/exceptions.yaml.

  - id: SEC-002
    title: Defense in Depth
    category: security
    statement: Les contrôles identité, réseau, application, données, livraison et observabilité doivent rester indépendants et cumulables.
    rationale: Aucun contrôle unique ne doit constituer l'unique barrière face à une compromission.
    scope: [applications, platform, infrastructure, supply-chain]
    environments: [integration, preproduction, production, management]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/infrastructure-security.md, notes: Couches de défense attendues.}
      - {type: config, status: AVAILABLE, path: docs/architecture/system-context.md, notes: Frontières et responsabilités.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: PR, relationship: SUPPORTS, notes: Mesures de protection complémentaires.}
      - {framework: ISO_IEC_27001_2022, control: A.8, relationship: INFORMATIVE, notes: Contrôles technologiques informatifs.}
    exception_allowed: false
    owner_role: security
    implementation_notes: Une mitigation compensatoire ne supprime pas l'obligation de traiter la cause.

  - id: SEC-003
    title: Secrets Management
    category: security
    statement: >-
      Les secrets réels restent hors Git, logs, images et sorties; leur emplacement local canonique est
      $HOME/.config/ecommerce-1/.env et leur livraison runtime doit être séparée par environnement.
    rationale: Réduire la persistance, la duplication et l'exposition accidentelle des credentials.
    scope: [source, ci, gitops, runtime, local-control-node]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/secrets-crypto-network.md, notes: "Contrat, rotation et exposition minimale."}
      - {type: scanner, status: AVAILABLE, path: scripts/ci-security.sh, notes: Gitleaks canonique et redaction.}
      - {type: config, status: AVAILABLE, path: docs/security/supply-chain-secrets.md, notes: Contrats de secrets delivery.}
    framework_mappings:
      - {framework: NIST_SSDF_1_1, control: PO.5, relationship: SUPPORTS, notes: Protéger les environnements et outils.}
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-13, relationship: SUPPORTS, notes: Gestion sûre de configuration.}
      - {framework: NIST_CSF_2_0, control: PR.AA, relationship: SUPPORTS, notes: Gestion des identités et secrets.}
    exception_allowed: false
    owner_role: security
    implementation_notes: SOPS plus age reste la cible GitOps pour les secrets chiffrés lorsque pertinent.

  - id: PRIV-001
    title: Privacy by Design and Default
    category: privacy
    statement: Les garanties de vie privée sont intégrées au design et les réglages par défaut limitent collecte, accès et exposition.
    rationale: La protection des données doit précéder le traitement et non être ajoutée après incident.
    scope: [applications, data, analytics, third-parties]
    environments: [development, integration, preproduction, production]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/privacy-data.md, notes: Baseline Privacy by Design.}
    framework_mappings:
      - {framework: GDPR, control: Article 25, relationship: SUPPORTS, notes: Protection des données dès la conception et par défaut.}
      - {framework: NIST_CSF_2_0, control: GV.OC, relationship: PARTIAL, notes: Contexte et obligations de l'organisation.}
    exception_allowed: false
    owner_role: privacy
    implementation_notes: Cette exigence de design n'est pas un avis juridique ni une claim de conformité RGPD.

  - id: PRIV-002
    title: Minimisation et finalité
    category: privacy
    statement: Chaque donnée personnelle collectée doit avoir une finalité documentée et être limitée au minimum nécessaire.
    rationale: Réduire le volume de données réduit simultanément risque privacy et impact de compromission.
    scope: [applications, data, analytics, logs]
    environments: [development, integration, preproduction, production]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/privacy-data.md, notes: "Inventaire, finalité et minimisation."}
    framework_mappings:
      - {framework: GDPR, control: Article 5(1)(b)-(c), relationship: SUPPORTS, notes: Limitation des finalités et minimisation.}
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-14, relationship: SUPPORTS, notes: Protection des données applicatives.}
    exception_allowed: false
    owner_role: privacy
    implementation_notes: Les exports sont contrôlés et journalisés sans dupliquer inutilement les données.

  - id: PRIV-003
    title: Droits, DPIA et sous-traitants
    category: privacy
    statement: L'architecture doit soutenir recherche, export, correction et suppression contrôlées et déclencher une DPIA selon le risque.
    rationale: Les opérations privacy et risques tiers doivent être réalisables et traçables par conception.
    scope: [applications, data, third-parties]
    environments: [production]
    enforcement_status: PLANNED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/privacy-data.md, notes: Triggers DPIA et inventaire processors.}
      - {type: test, status: PLANNED, reference: privacy-rights-runtime-test, notes: Validation future des workflows de droits.}
    framework_mappings:
      - {framework: GDPR, control: Articles 15-22 and 35, relationship: SUPPORTS, notes: Support architectural des droits et analyse d'impact.}
      - {framework: NIST_CSF_2_0, control: GV.RM, relationship: PARTIAL, notes: Gestion du risque et parties prenantes.}
    exception_allowed: false
    owner_role: privacy
    implementation_notes: Les décisions juridiques et business requièrent approbation qualifiée.

  - id: DATA-001
    title: Data Classification
    category: data
    statement: Toute donnée est classée PUBLIC, INTERNAL, CONFIDENTIAL ou RESTRICTED avec un owner role et des exigences associées.
    rationale: La protection, la journalisation, les backups et l'accès dépendent de la sensibilité réelle.
    scope: [data, logs, backups, events, artifacts]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_APPLICABLE
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/privacy-data.md, notes: Modèle de classification et règles associées.}
      - {type: test, status: AVAILABLE, path: scripts/validate-governance.py, notes: Valeurs de classification gouvernées.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: ID.AM, relationship: SUPPORTS, notes: Inventaire et compréhension des données.}
      - {framework: ISO_IEC_27001_2022, control: A.5.12, relationship: INFORMATIVE, notes: Classification de l'information.}
      - {framework: GDPR, control: Article 32, relationship: PARTIAL, notes: Mesures adaptées au risque.}
    exception_allowed: false
    owner_role: data
    implementation_notes: PII, credentials, PSP tokens et données de paiement sont RESTRICTED.

  - id: DATA-002
    title: Retention et suppression
    category: data
    statement: Chaque dataset doit avoir une règle de conservation, suppression et preuve; une durée inconnue reste explicitement en attente d'approbation.
    rationale: Une conservation indéfinie implicite augmente les risques et empêche une gouvernance vérifiable.
    scope: [databases, object-storage, logs, backups, analytics]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/privacy-data.md, notes: Retention status et suppression contrôlée.}
    framework_mappings:
      - {framework: GDPR, control: Article 5(1)(e), relationship: SUPPORTS, notes: Limitation de conservation.}
      - {framework: NIST_CSF_2_0, control: PR.DS, relationship: SUPPORTS, notes: Protection du cycle de vie des données.}
    exception_allowed: true
    owner_role: data
    implementation_notes: La valeur autorisée en attente est TBD_REQUIRES_BUSINESS_OR_LEGAL_APPROVAL.

  - id: DATA-003
    title: Données des environnements inférieurs
    category: data
    statement: Les données PII réelles de production ne sont pas utilisées en DEV, integration ou preproduction par défaut.
    rationale: Les environnements inférieurs ont une surface d'accès plus large et ne doivent pas dupliquer le risque production.
    scope: [development-data, test-fixtures, exports]
    environments: [development, integration, preproduction]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/privacy-data.md, notes: Données synthétiques ou anonymisées par défaut.}
    framework_mappings:
      - {framework: GDPR, control: Article 25, relationship: SUPPORTS, notes: Protection par défaut.}
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-14, relationship: SUPPORTS, notes: Limitation des données sensibles.}
    exception_allowed: true
    owner_role: privacy
    implementation_notes: Toute copie exceptionnelle exige minimisation, scope, chiffrement, expiry et approbation.

  - id: DATA-004
    title: Payment Data Scope Minimization
    category: data
    statement: >-
      Un PSP externe et la tokenisation sont préférés; le CVV ne doit jamais être persisté, le PAN brut doit rester hors systèmes
      si possible et toute nouvelle cardholder data déclenche un gate architecture/security/compliance.
    rationale: Réduire le périmètre de données carte réduit le risque et le scope PCI DSS potentiel.
    scope: [checkout, payment, refunds, logs, events]
    environments: [development, integration, preproduction, production]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/privacy-data.md, notes: "Architecture PSP, tokenisation et interdictions."}
    framework_mappings:
      - {framework: PCI_DSS, control: 3.3.1.2, relationship: CONDITIONAL, notes: Interdiction de conserver les codes de vérification après autorisation.}
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-14, relationship: SUPPORTS, notes: Protection des données sensibles.}
    exception_allowed: false
    owner_role: security
    implementation_notes: Les tokens PSP sont RESTRICTED et aucune donnée carte n'est admise dans logs ou messages.

  - id: IAM-001
    title: Zero Trust and Workload Identity
    category: identity
    statement: La localisation réseau ne confère aucune confiance; chaque identité utilisateur ou workload est authentifiée et explicitement autorisée.
    rationale: Limiter l'usurpation et les mouvements latéraux entre services et environnements.
    scope: [keycloak, istio, opa, workloads, administrators]
    environments: [integration, preproduction, production, management]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/infrastructure-security.md, notes: "Modèle Keycloak, Istio et OPA."}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: PR.AA, relationship: SUPPORTS, notes: Authentification et autorisation explicites.}
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-6, relationship: PARTIAL, notes: Authentification applicative.}
      - {framework: OWASP_ASVS_5_0_0, control: v5.0.0-8, relationship: PARTIAL, notes: Autorisation applicative.}
    exception_allowed: false
    owner_role: security
    implementation_notes: Istio fournit la cible mTLS/service identity; Keycloak user/admin identity; OPA les décisions policy.

  - id: IAM-002
    title: Least Privilege
    category: identity
    statement: Chaque humain, workload, pipeline et compte technique reçoit uniquement les permissions minimales nécessaires et bornées.
    rationale: Réduire l'impact d'un credential ou composant compromis.
    scope: [rbac, ci, cloud-apis, databases, git, registries]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/infrastructure-security.md, notes: Least privilege par rôle et workload.}
      - {type: config, status: AVAILABLE, path: gitops/infrastructure/tekton-ci/serviceaccounts.yaml, notes: Identités CI séparées et token automount désactivé.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: PR.AA, relationship: SUPPORTS, notes: Permissions minimales.}
      - {framework: ISO_IEC_27001_2022, control: A.5.15, relationship: INFORMATIVE, notes: Contrôle d'accès.}
    exception_allowed: true
    owner_role: security
    implementation_notes: Les credentials longue durée partagés sont interdits en production.

  - id: IAM-003
    title: Break-glass temporaire et audité
    category: identity
    statement: L'accès d'urgence est nominatif ou attribuable, minimal, temporaire, audité et suivi d'une réconciliation déclarative.
    rationale: Permettre la réponse incident sans créer de drift permanent ni de credential partagé.
    scope: [production, management, cloud-apis, kubernetes]
    environments: [production, management]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/resilience-evidence-operations.md, notes: Procédure incident et break-glass.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: RS.MA, relationship: SUPPORTS, notes: Gestion de réponse incident.}
      - {framework: ISO_IEC_27001_2022, control: A.5.24, relationship: INFORMATIVE, notes: Préparation à la gestion des incidents.}
    exception_allowed: false
    owner_role: operations
    implementation_notes: Aucun compte d'urgence permanent partagé n'est autorisé.

  - id: NET-001
    title: Default-deny network segmentation
    category: network
    statement: Ingress et egress sont refusés par défaut lorsque possible, puis ouverts explicitement entre frontières nécessaires.
    rationale: Empêcher l'exposition implicite et limiter les mouvements latéraux.
    scope: [cloud-firewalls, kubernetes, service-mesh, hosts]
    environments: [integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/secrets-crypto-network.md, notes: Baseline réseau.}
      - {type: policy_test, status: AVAILABLE, path: security/opa/kubernetes/kubernetes_test.rego, notes: Default-deny attendu par namespace production.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: PR.IR, relationship: SUPPORTS, notes: Résilience et segmentation technologique.}
      - {framework: CIS, control: target-specific-network-benchmark, relationship: INFORMATIVE, notes: Version à vérifier pour chaque cible.}
    exception_allowed: true
    owner_role: platform
    implementation_notes: Aucune confiance implicite ne traverse DEV, integration, preproduction et production.

  - id: NET-002
    title: Exposition réseau explicite
    category: network
    statement: Les bases de données ne sont jamais publiques et SSH public universel est interdit; les expositions attendues sont revues par port et protocole.
    rationale: Réduire la surface d'attaque externe de l'infrastructure sensible.
    scope: [terraform, cloud-firewalls, databases, ssh]
    environments: [integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy_test, status: AVAILABLE, path: security/opa/terraform/terraform_test.rego, notes: PostgreSQL public et SSH universel refusés.}
      - {type: test, status: AVAILABLE, path: tests/governance/fixtures/terraform-fail-public-db.json, notes: Fixture publique négative.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: PR.IR, relationship: SUPPORTS, notes: Protection de l'infrastructure.}
      - {framework: ISO_IEC_27001_2022, control: A.8.20, relationship: INFORMATIVE, notes: Sécurité réseau.}
    exception_allowed: true
    owner_role: platform
    implementation_notes: SSH reste restreint et orienté break-glass; PostgreSQL 5432 ne doit pas être public.

  - id: CRYPTO-001
    title: Cryptographic Baseline and Agility
    category: cryptography
    statement: >-
      TLS 1.0 et 1.1 sont interdits; TLS 1.3 est supporté et préféré, la validation certificat/hostname est obligatoire,
      les clés ne sont jamais journalisées et aucune cryptographie maison n'est admise.
    rationale: Fournir une baseline moderne sans figer une liste d'algorithmes rapidement obsolète.
    scope: [edge, service-mesh, databases, messaging, ci, backups]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/secrets-crypto-network.md, notes: "TLS, clés, random et crypto agility."}
    framework_mappings:
