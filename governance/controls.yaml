      - {type: test, status: AVAILABLE, path: scripts/test-terraform-state-postgresql-backup.sh, notes: Harness ciblé existant.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: RC.RP, relationship: SUPPORTS, notes: Plan et capacité de recovery.}
      - {framework: ISO_IEC_27001_2022, control: A.8.13, relationship: INFORMATIVE, notes: Sauvegarde de l'information.}
    exception_allowed: false
    owner_role: operations
    implementation_notes: RPO et RTO restent TBD_REQUIRES_BUSINESS_APPROVAL avant production.

  - id: RES-002
    title: Resilience and State Integrity
    category: resilience
    statement: Idempotence, persistence au reboot, integrity, locking et défaillances de dépendances sont testés avec preuves distinctes.
    rationale: La disponibilité et la cohérence dépendent du comportement lors de pannes et redémarrages réels.
    scope: [infrastructure, databases, messaging, applications]
    environments: [integration, preproduction, production, management]
    enforcement_status: DOCUMENTED
    runtime_status: NOT_PROVEN_RUNTIME
    severity: HIGH
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/resilience-evidence-operations.md, notes: Scénarios de résilience requis.}
      - {type: independent_review, status: PLANNED, reference: reboot-persistence-independent-review, notes: Reboot persistence reste provisoire.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: PR.IR, relationship: SUPPORTS, notes: Résilience de l'infrastructure technologique.}
      - {framework: NIST_CSF_2_0, control: RC.RP, relationship: SUPPORTS, notes: Recovery éprouvé.}
    exception_allowed: false
    owner_role: operations
    implementation_notes: Le statut reboot persistence reste PROVISIONAL_RUNTIME_PASS jusqu'à revue séparée.

  - id: COMP-001
    title: Compliance as Code mappings
    category: compliance
    statement: Les relations aux frameworks sont machine-readable, validées et ne constituent ni certification ni conformité juridique.
    rationale: Permettre une traçabilité contrôlée sans transformer un mapping en claim trompeuse.
    scope: [governance, audit, architecture]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_APPLICABLE
    severity: HIGH
    evidence:
      - {type: config, status: AVAILABLE, path: governance/controls.yaml, notes: Mappings canoniques par contrôle.}
      - {type: test, status: AVAILABLE, path: scripts/validate-governance.py, notes: Frameworks et structures validés.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: GV.OV, relationship: SUPPORTS, notes: Revue et évaluation de gouvernance.}
      - {framework: ISO_IEC_27001_2022, control: clauses-and-Annex-A, relationship: INFORMATIVE, notes: Mapping informatif uniquement.}
    exception_allowed: false
    owner_role: security
