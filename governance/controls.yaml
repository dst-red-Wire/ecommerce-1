  - id: COMP-002
    title: Risk Acceptance and Exceptions
    category: compliance
    statement: Toute dérogation a justification, risque, compensating controls, scope, approver role, référence, création et expiration.
    rationale: Empêcher une désactivation silencieuse, permanente ou globale des contrôles.
    scope: [governance, policies, runtime]
    environments: [development, integration, preproduction, production, management]
    enforcement_status: STATICALLY_ENFORCED
    runtime_status: NOT_APPLICABLE
    severity: CRITICAL
    evidence:
      - {type: policy, status: AVAILABLE, path: docs/security/exception-policy.md, notes: Règles d'acceptation de risque.}
      - {type: config, status: AVAILABLE, path: governance/exceptions.yaml, notes: Registre canonique des exceptions.}
      - {type: test, status: AVAILABLE, path: tests/governance/test_governance_validator.py, notes: Expiry et champs obligatoires testés.}
    framework_mappings:
      - {framework: NIST_CSF_2_0, control: GV.RM, relationship: SUPPORTS, notes: Gestion explicite du risque.}
      - {framework: ISO_IEC_27001_2022, control: "6.1", relationship: INFORMATIVE, notes: Traitement du risque informatif.}
    exception_allowed: false
    owner_role: security
