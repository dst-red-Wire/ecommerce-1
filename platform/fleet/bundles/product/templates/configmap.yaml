apiVersion: v1
kind: ConfigMap
metadata:
  name: product-runtime
  labels:
    {{- include "product.labels" . | nindent 4 }}
data:
  PRODUCT_STORAGE: postgres
  PRODUCT_HTTP_ADDR: :8080
  PRODUCT_GRPC_ADDR: :9090
  PRODUCT_HOME_SITE: {{ required "runtime.homeSite is required" .Values.runtime.homeSite | quote }}
  PRODUCT_KAFKA_BROKERS: {{ required "runtime.kafkaBrokers is required" .Values.runtime.kafkaBrokers | quote }}
  PRODUCT_KAFKA_TOPIC: {{ .Values.runtime.kafkaTopic | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ required "runtime.otlpEndpoint is required" .Values.runtime.otlpEndpoint | quote }}
  OTEL_SERVICE_NAME: product
  PRODUCT_OIDC_ISSUER: {{ required "runtime.oidcIssuer is required" .Values.runtime.oidcIssuer | quote }}
  PRODUCT_OIDC_AUDIENCE: {{ .Values.runtime.oidcAudience | quote }}
