---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart persistent journal
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Persist public peer identity correlation
  ansible.builtin.command:
    argv: [logger, --tag, wg-peer-map]
    stdin: "{{ wireguard_validated_material.peers | to_json }}"
  changed_when: true
  no_log: true

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true

- name: Restart WireGuard
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    state: restarted
