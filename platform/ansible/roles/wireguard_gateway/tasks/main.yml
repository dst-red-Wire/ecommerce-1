---
- name: Require Rocky Linux 9 and runtime-only WireGuard secrets
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Rocky"
      - ansible_facts.distribution_major_version == "9"
      - wireguard_private_key | length > 0
      - wireguard_peers_json | length > 0
      - wireguard_peers_json | from_json | type_debug == "list"
      - wireguard_allowed_routes | length > 0
    fail_msg: "WireGuard configuration requires Rocky 9 and runtime-injected key/peer inputs."
  no_log: true

- name: Install WireGuard and host firewall packages
  ansible.builtin.dnf:
    name: [wireguard-tools, firewalld]
    state: present

- name: Enable IPv4 forwarding persistently
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-mgmt-wireguard.conf
    content: "net.ipv4.ip_forward = 1\n"
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Create WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render fail-closed WireGuard gateway configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "{{ wireguard_config_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart WireGuard

- name: Enable WireGuard interface
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    enabled: true
