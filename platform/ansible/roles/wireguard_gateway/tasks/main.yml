---
- name: Require Rocky Linux 9 and an explicit secret-authority phase
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Rocky"
      - ansible_facts.distribution_major_version == "9"
      - wireguard_secret_mode in ['bootstrap-local', 'runtime-openbao-read']
      - wireguard_allowed_routes | length > 0
    fail_msg: "WireGuard reconciliation requires Rocky 9 and an explicit governed authority phase."

- name: Inspect permanent secret authority before permitting bootstrap
  ansible.builtin.stat:
    path: "{{ wireguard_authority_marker }}"
  register: wireguard_authority_state

- name: Refuse to restore bootstrap after OpenBao transition
  ansible.builtin.assert:
    that:
      - wireguard_secret_mode != 'bootstrap-local' or not wireguard_authority_state.stat.exists
    fail_msg: "OpenBao authority is permanent; bootstrap rollback is forbidden."

- name: Install WireGuard and firewalld before any WireGuard hook or service action
  ansible.builtin.dnf:
    name: [wireguard-tools, firewalld]
    state: present

- name: Enable and start firewalld before rendering WireGuard
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Create root-only WireGuard directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Require human-gated bootstrap peer staging
  ansible.builtin.assert:
    that:
      - wireguard_bootstrap_human_gate | bool
      - wireguard_bootstrap_peers_json | length > 0
      - wireguard_bootstrap_peers_json | from_json | type_debug == 'list'
    fail_msg: "Bootstrap-local authority requires its human gate and runtime peer public keys."
  when: wireguard_secret_mode == 'bootstrap-local'
  no_log: true

- name: Inspect temporary gateway key on wg-01
  ansible.builtin.stat:
    path: "{{ wireguard_bootstrap_key_file }}"
  register: wireguard_bootstrap_key_stat
  no_log: true

- name: Require preserved bootstrap key for first OpenBao authority transition
  ansible.builtin.assert:
    that:
      - wireguard_bootstrap_key_stat.stat.exists | default(false)
    fail_msg: >-
      First OpenBao authority transition requires the existing bootstrap key so
      mandatory replacement-key rotation can be proven before bootstrap cleanup.
  when:
    - wireguard_secret_mode == 'runtime-openbao-read'
    - not wireguard_authority_state.stat.exists
  no_log: true

- name: Generate the temporary gateway key locally on wg-01
  ansible.builtin.command:
    argv: [wg, genkey]
  register: wireguard_bootstrap_generated_key
  changed_when: true
  when:
    - wireguard_secret_mode == 'bootstrap-local'
    - not wireguard_bootstrap_key_stat.stat.exists
  no_log: true

- name: Persist the temporary bootstrap key only on wg-01
  ansible.builtin.copy:
    content: "{{ wireguard_bootstrap_generated_key.stdout }}\n"
    dest: "{{ wireguard_bootstrap_key_file }}"
    owner: root
    group: root
    mode: "0600"
  when: wireguard_bootstrap_generated_key is not skipped
  no_log: true

- name: Stage non-secret bootstrap peer public records locally
  ansible.builtin.copy:
    content: "{{ wireguard_bootstrap_peers_json }}\n"
    dest: "{{ wireguard_bootstrap_peer_staging_file }}"
    owner: root
    group: root
    mode: "0600"
  when: wireguard_secret_mode == 'bootstrap-local'
  no_log: true

- name: Read temporary local bootstrap material
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: ["{{ wireguard_bootstrap_key_file }}", "{{ wireguard_bootstrap_peer_staging_file }}"]
  register: wireguard_bootstrap_material
  when: wireguard_secret_mode == 'bootstrap-local'
  no_log: true

- name: Require runtime-only OpenBao authentication and canonical paths
  ansible.builtin.assert:
    that:
      - wireguard_openbao_addr | length > 0
      - wireguard_openbao_addr is match('^https://[^\s]+$')
      - wireguard_openbao_token | length > 0
      - wireguard_openbao_gateway_path == 'mgmt/wireguard/wg-01'
      - wireguard_openbao_peers_path == 'mgmt/wireguard/peers'
    fail_msg: "Steady state fails closed without runtime OpenBao auth and canonical record paths."
  when: wireguard_secret_mode == 'runtime-openbao-read'
  no_log: true

- name: Read the rotated gateway record from OpenBao at runtime
  ansible.builtin.uri:
    url: "{{ wireguard_openbao_addr }}/v1/kv/data/{{ wireguard_openbao_gateway_path }}"
    headers: {X-Vault-Token: "{{ wireguard_openbao_token }}"}
    return_content: true
    validate_certs: true
  register: wireguard_openbao_gateway
  when: wireguard_secret_mode == 'runtime-openbao-read'
  no_log: true

- name: List authoritative peer identities from OpenBao at runtime
  ansible.builtin.uri:
    url: "{{ wireguard_openbao_addr }}/v1/kv/metadata/{{ wireguard_openbao_peers_path }}"
    method: LIST
    headers: {X-Vault-Token: "{{ wireguard_openbao_token }}"}
    return_content: true
    validate_certs: true
  register: wireguard_openbao_peer_list
  when: wireguard_secret_mode == 'runtime-openbao-read'
  no_log: true

- name: Read each authoritative peer record from OpenBao at runtime
  ansible.builtin.uri:
    url: "{{ wireguard_openbao_addr }}/v1/kv/data/{{ wireguard_openbao_peers_path }}/{{ item }}"
    headers: {X-Vault-Token: "{{ wireguard_openbao_token }}"}
    return_content: true
    validate_certs: true
  loop: "{{ wireguard_openbao_peer_list['json']['data']['keys'] }}"
  register: wireguard_openbao_peer_records
  when: wireguard_secret_mode == 'runtime-openbao-read'
  no_log: true

- name: Read the existing bootstrap key for mandatory rotation proof
  ansible.builtin.slurp:
    src: "{{ wireguard_bootstrap_key_file }}"
  register: wireguard_pre_transition_key
  when:
    - wireguard_secret_mode == 'runtime-openbao-read'
    - wireguard_bootstrap_key_stat.stat.exists | default(false)
  no_log: true

- name: Prove the OpenBao key replaces rather than copies the bootstrap key
  ansible.builtin.assert:
    that:
      - wireguard_openbao_gateway.json.data.data.private_key != (wireguard_pre_transition_key.content | b64decode | trim)
    fail_msg: "Authority transition requires key rotation; copying the bootstrap key into OpenBao is forbidden."
  when:
    - wireguard_secret_mode == 'runtime-openbao-read'
    - wireguard_bootstrap_key_stat.stat.exists | default(false)
  no_log: true

- name: Select phase-specific WireGuard material without controller secret authority
  ansible.builtin.set_fact:
    wireguard_private_key: >-
      {{ (wireguard_bootstrap_material.results[0].content | b64decode | trim)
         if wireguard_secret_mode == 'bootstrap-local'
         else wireguard_openbao_gateway.json.data.data.private_key }}
    wireguard_peers: >-
      {{ (wireguard_bootstrap_material.results[1].content | b64decode | from_json)
         if wireguard_secret_mode == 'bootstrap-local'
         else wireguard_openbao_peer_records.results | map(attribute='json.data.data') | list }}
  no_log: true

- name: Validate keys and separately authorized peer assignments before rendering
  ansible.builtin.set_fact:
    wireguard_validated_material: >-
      {{ {'private_key': wireguard_private_key, 'peers': wireguard_peers}
         | mgmt_wireguard_material(wireguard_operator_pool, wireguard_break_glass_pool,
                                   wireguard_break_glass_authorized | bool) }}
  no_log: true

- name: Retain identity correlation for pre-SNAT flow audit
  ansible.builtin.copy:
    content: "{{ wireguard_validated_material.peers | to_json }}\n"
    dest: /etc/wireguard/peer-identities.json
    owner: root
    group: root
    mode: "0600"
  notify: Persist public peer identity correlation
  no_log: true

- name: Create persistent journal storage
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/etc/systemd/journald.conf.d, /var/log/journal]

- name: Bound persistent flow and identity audit storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-wireguard-audit.conf
    content: "[Journal]\nStorage=persistent\nSystemMaxUse=200M\nMaxRetentionSec=30day\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart persistent journal

- name: Create persistent firewall configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/etc/firewalld/zones, /etc/firewalld/policies]

- name: Query public WireGuard UDP listener allowance
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, "--query-port={{ wireguard_listen_port }}/udp"]
  register: wireguard_udp_query
  changed_when: false
  failed_when: wireguard_udp_query.rc not in [0, 1]

- name: Permit the governed WireGuard UDP listener
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, "--add-port={{ wireguard_listen_port }}/udp"]
  when: wireguard_udp_query.rc == 1
  changed_when: true
  notify: Reload firewalld

- name: Reconcile the dedicated WireGuard zone and forwarding policy completely
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: wg-zone.xml.j2, dest: /etc/firewalld/zones/wg-mgmt.xml}
    - {src: wg-policy.xml.j2, dest: /etc/firewalld/policies/wg-to-mgmt.xml}
  notify: Reload firewalld

- name: Enable IPv4 forwarding persistently
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-mgmt-wireguard.conf
    content: "net.ipv4.ip_forward = 1\n"
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Query the exact persistent WireGuard SNAT tuple
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --direct
      - --query-rule
      - ipv4
      - nat
      - POSTROUTING
      - "0"
      - -s
      - "{{ wireguard_snat_source_cidr }}"
      - -d
      - "{{ wireguard_snat_destination_cidr }}"
      - -j
      - SNAT
      - --to-source
      - "{{ wireguard_snat_to_source }}"
  register: wireguard_snat_query
  changed_when: false
  failed_when: wireguard_snat_query.rc not in [0, 1]

- name: Add the exact persistent WireGuard SNAT tuple
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --direct
      - --add-rule
      - ipv4
      - nat
      - POSTROUTING
      - "0"
      - -s
      - "{{ wireguard_snat_source_cidr }}"
      - -d
      - "{{ wireguard_snat_destination_cidr }}"
      - -j
      - SNAT
      - --to-source
      - "{{ wireguard_snat_to_source }}"
  when: wireguard_snat_query.rc == 1
  changed_when: true
  notify: Reload firewalld

- name: Record the earliest acceptable live rotation handshake
  ansible.builtin.command:
    argv: [date, '+%s']
  register: wireguard_rotation_epoch
  changed_when: false
  when: wireguard_secret_mode == 'runtime-openbao-read'

- name: Render fail-closed WireGuard gateway configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "{{ wireguard_config_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart WireGuard

- name: Enable and start WireGuard desired state
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    enabled: true
    state: started

- name: Activate forwarding and rotated WireGuard before authority cleanup
  ansible.builtin.meta: flush_handlers

- name: Derive expected public key without exposing private material
  ansible.builtin.command:
    argv: [wg, pubkey]
    stdin: "{{ wireguard_validated_material.private_key }}"
  register: wireguard_expected_public_key
  changed_when: false
  when: wireguard_secret_mode == 'runtime-openbao-read'
  no_log: true

- name: Read active gateway public key
  ansible.builtin.command:
    argv: [wg, show, wg0, public-key]
  register: wireguard_active_public_key
  changed_when: false
  when: wireguard_secret_mode == 'runtime-openbao-read'
  no_log: true

- name: Verify the replacement key is active before cleanup
  ansible.builtin.assert:
    that:
      - wireguard_active_public_key.stdout == wireguard_expected_public_key.stdout
  when: wireguard_secret_mode == 'runtime-openbao-read'
  no_log: true

- name: Require a fresh authenticated peer handshake on the activated tunnel
  ansible.builtin.command:
    argv: [wg, show, wg0, latest-handshakes]
  register: wireguard_live_handshakes
  changed_when: false
  until: >-
    wireguard_live_handshakes.stdout
    | mgmt_wireguard_fresh_handshake(wireguard_validated_material.peers,
                                    wireguard_rotation_epoch.stdout | int)
  retries: 60
  delay: 5
  when: wireguard_secret_mode == 'runtime-openbao-read'
  no_log: true

- name: Require provider bootstrap SSH teardown before completing transition
  ansible.builtin.assert:
    that:
      - mgmt_transport_phase == 'steady-state'
    fail_msg: >-
      OpenBao authority cannot become permanent until Terraform runtime transport
      proves temporary public bootstrap SSH is disabled.
  when:
    - wireguard_secret_mode == 'runtime-openbao-read'
    - not wireguard_authority_state.stat.exists

- name: Record completed OpenBao authority rotation
  ansible.builtin.copy:
    dest: "{{ wireguard_authority_marker }}"
    content: "rotated-to-openbao\n"
    owner: root
    group: root
    mode: "0600"
  when: wireguard_secret_mode == 'runtime-openbao-read'

- name: Revoke temporary bootstrap authority and peer staging after rotation
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: ["{{ wireguard_bootstrap_key_file }}", "{{ wireguard_bootstrap_peer_staging_file }}"]
  when: wireguard_secret_mode == 'runtime-openbao-read'
  no_log: true
