---
versions_file: "{{ repo_root }}/config/toolchain/versions.env"
ansible_core_version: "{{ lookup('ansible.builtin.ini', 'ANSIBLE_CORE_VERSION', type='properties', file=versions_file) }}"
ansible_lint_version: "{{ lookup('ansible.builtin.ini', 'ANSIBLE_LINT_VERSION', type='properties', file=versions_file) }}"
local_bin: "{{ ansible_env.HOME }}/.local/bin"
local_share: "{{ ansible_env.HOME }}/.local/share/ecommerce-1"
local_cache: "{{ ansible_env.HOME }}/.cache/ecommerce-1"
node_version: "{{ lookup('ansible.builtin.file', repo_root + '/frontend/.node-version') | trim }}"
