---
versions_file: "{{ repo_root }}/config/toolchain/versions.env"
developer_toolchain_architecture_lock_file: "{{ repo_root }}/architecture.lock.yaml"
developer_toolchain_architecture_lock: >-
  {{ lookup('ansible.builtin.file', developer_toolchain_architecture_lock_file) | from_yaml }}
toolchain_lock_file: "{{ repo_root }}/config/contracts/toolchain-lock.json"
toolchain_lock: "{{ lookup('ansible.builtin.file', toolchain_lock_file) | from_json }}"
managed_tools: "{{ toolchain_lock.tools }}"
active_tool_names: "{{ toolchain_lock.tool_lifecycle.active.keys() | list }}"
managed_install_root: >-
  {{ lookup('ansible.builtin.env', toolchain_lock.capability_policy.managed_install_root.environment)
     | default(ansible_env.HOME + '/.local', true) }}
managed_install_root_explicit: >-
  {{ (lookup('ansible.builtin.env', toolchain_lock.capability_policy.managed_install_root.environment)
      | default('', true) | length) > 0 }}
local_bin: "{{ managed_install_root }}/{{ toolchain_lock.capability_policy.managed_install_root.bin_subdirectory }}"
local_share: "{{ managed_install_root }}/{{ toolchain_lock.capability_policy.managed_install_root.share_subdirectory }}"
local_cache: >-
  {{ (managed_install_root + '/' + toolchain_lock.capability_policy.managed_install_root.cache_subdirectory)
     if managed_install_root_explicit
     else (toolchain_lock.capability_policy.managed_install_root.fallback_cache_root | regex_replace('^~', ansible_env.HOME)) }}
developer_toolchain_forbidden_terraform_cli_system_paths:
  - /usr/local/bin/terraform
  - /usr/bin/terraform
toolchain_offline: >-
  {{ lookup('ansible.builtin.env', toolchain_lock.capability_policy.managed_install_root.offline_environment)
     | default('false', true) | bool }}
docker_cli_plugin_dir: "{{ ansible_env.HOME }}/.docker/cli-plugins"
node_version: "{{ lookup('ansible.builtin.ini', 'NODE_VERSION', type='properties', file=versions_file) }}"
node_sha256: "{{ lookup('ansible.builtin.ini', 'NODE_SHA256_LINUX_X64', type='properties', file=versions_file) }}"
pnpm_version: "{{ lookup('ansible.builtin.ini', 'PNPM_VERSION', type='properties', file=versions_file) }}"
go_version: "{{ lookup('ansible.builtin.ini', 'GO_VERSION', type='properties', file=versions_file) }}"
go_sha256: "{{ lookup('ansible.builtin.ini', 'GO_SHA256_LINUX_AMD64', type='properties', file=versions_file) }}"
templ_version: "{{ lookup('ansible.builtin.ini', 'TEMPL_VERSION', type='properties', file=versions_file) }}"
sqlc_version: "{{ lookup('ansible.builtin.ini', 'SQLC_VERSION', type='properties', file=versions_file) }}"
sqlc_sha256: "{{ lookup('ansible.builtin.ini', 'SQLC_SHA256_LINUX_AMD64', type='properties', file=versions_file) }}"
ripgrep_version: "{{ lookup('ansible.builtin.ini', 'RIPGREP_VERSION', type='properties', file=versions_file) }}"
ripgrep_sha256: "{{ lookup('ansible.builtin.ini', 'RIPGREP_SHA256_LINUX_AMD64', type='properties', file=versions_file) }}"
