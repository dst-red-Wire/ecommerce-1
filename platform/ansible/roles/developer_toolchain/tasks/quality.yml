---
# The static Go and HTMX closure uses Ruff for Python lint and format checks.
# Older revisions installed Oxc in these role-owned locations. Reconcile them
# whenever the quality toolchain is selected, including an explicit Ruff run.
- name: Inspect legacy Oxc command links
  ansible.builtin.stat:
    path: "{{ local_bin }}/{{ item }}"
    follow: false
  loop: [oxlint, oxfmt]
  register: legacy_oxc_command_links
  tags: [toolchain, quality_tools, ruff, legacy_oxc_cleanup]

- name: Remove legacy role-owned Oxc command links
  ansible.builtin.file:
    path: "{{ local_bin }}/{{ item.item }}"
    state: absent
  loop: "{{ legacy_oxc_command_links.results }}"
  when:
    - item.stat.islnk | default(false)
    - (item.stat.lnk_source | default('') | basename) == item.item ~ '-x86_64-unknown-linux-gnu'
    - (item.stat.lnk_source | default('') | dirname | dirname) == local_share ~ '/tools/' ~ item.item
  tags: [toolchain, quality_tools, ruff, legacy_oxc_cleanup]

- name: Remove legacy role-owned Oxc tool directories
  ansible.builtin.file:
    path: "{{ local_share }}/tools/{{ item }}"
    state: absent
  loop: [oxlint, oxfmt]
  tags: [toolchain, quality_tools, ruff, legacy_oxc_cleanup]

- name: Create Ruff version directory
  ansible.builtin.file:
    path: "{{ local_share }}/tools/ruff/{{ ruff_version }}"
    state: directory
    mode: '0755'
  tags: [toolchain, quality_tools, ruff]

- name: Download pinned Ruff archive
  ansible.builtin.get_url:
    url: "https://github.com/astral-sh/ruff/releases/download/{{ ruff_version }}/ruff-x86_64-unknown-linux-gnu.tar.gz"
    dest: "{{ local_cache }}/ruff-{{ ruff_version }}.tar.gz"
    checksum: "sha256:{{ ruff_sha256 }}"
    mode: '0644'
  tags: [toolchain, quality_tools, ruff]

- name: Extract pinned Ruff
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/ruff-{{ ruff_version }}.tar.gz"
    dest: "{{ local_share }}/tools/ruff/{{ ruff_version }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ local_share }}/tools/ruff/{{ ruff_version }}/ruff"
  tags: [toolchain, quality_tools, ruff]

- name: Link Ruff into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/ruff/{{ ruff_version }}/ruff"
    dest: "{{ local_bin }}/ruff"
    state: link
    force: true
  tags: [toolchain, quality_tools, ruff]

- name: Validate pinned Ruff version
  ansible.builtin.command:
    argv: ["{{ local_bin }}/ruff", --version]
  register: ruff_current
  changed_when: false
  failed_when: ruff_version not in ruff_current.stdout
  tags: [toolchain, quality_tools, ruff]
