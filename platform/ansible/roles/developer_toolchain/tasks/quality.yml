---
# The static Go and HTMX closure uses Ruff for Python lint and format checks.
- name: Create Ruff version directory
  ansible.builtin.file:
    path: "{{ local_share }}/tools/ruff/{{ ruff_version }}"
    state: directory
    mode: '0755'
  tags: [toolchain, quality_tools, ruff]

- name: Download pinned Ruff archive
  ansible.builtin.get_url:
    url: "https://github.com/astral-sh/ruff/releases/download/{{ ruff_version }}/ruff-x86_64-unknown-linux-gnu.tar.gz"
    dest: "{{ local_cache }}/ruff-{{ ruff_version }}.tar.gz"
    checksum: "sha256:{{ ruff_sha256 }}"
    mode: '0644'
  tags: [toolchain, quality_tools, ruff]

- name: Extract pinned Ruff
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/ruff-{{ ruff_version }}.tar.gz"
    dest: "{{ local_share }}/tools/ruff/{{ ruff_version }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ local_share }}/tools/ruff/{{ ruff_version }}/ruff"
  tags: [toolchain, quality_tools, ruff]

- name: Link Ruff into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/ruff/{{ ruff_version }}/ruff"
    dest: "{{ local_bin }}/ruff"
    state: link
    force: true
  tags: [toolchain, quality_tools, ruff]

- name: Validate pinned Ruff version
  ansible.builtin.command:
    argv: ["{{ local_bin }}/ruff", --version]
  register: ruff_current
  changed_when: false
  failed_when: ruff_version not in ruff_current.stdout
  tags: [toolchain, quality_tools, ruff]
