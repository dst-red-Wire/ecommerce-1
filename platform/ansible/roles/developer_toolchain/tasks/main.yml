---
- name: Create user-local tool directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ local_bin }}"
    - "{{ local_share }}"
    - "{{ local_share }}/tools"
    - "{{ local_cache }}"
  tags: [toolchain, agent_tools, gh, node, go, templ, cgo, sqlc, context_tools, docker_buildx, skopeo, packer, trivy, gitleaks, gosec, govulncheck, cosign, kubectl, helm, opentofu, kustomize, conftest, opa, k6, nuclei, hubble, pint, ansible_lint, pre_commit, quality_tools, ruff, oxfmt, oxlint]

- name: Install native build prerequisites for CGO and archive handling
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - curl
      - git
      - jq
      - make
      - pipx
      - python3-venv
      - unzip
      - xz-utils
    state: present
    update_cache: true
    cache_valid_time: 86400
  become: true
  tags: [toolchain, go, cgo, node]

- name: Detect ansible-lint pipx prerequisite
  ansible.builtin.command:
    argv: [pipx, --version]
  register: ansible_lint_pipx_probe
  failed_when: false
  changed_when: false
  tags: [toolchain, ansible_lint, pre_commit]

- name: Ensure ansible-lint pipx prerequisite
  ansible.builtin.apt:
    name: pipx
    state: present
    update_cache: true
    cache_valid_time: 86400
  become: true
  when: ansible_lint_pipx_probe.rc != 0
  tags: [toolchain, ansible_lint, pre_commit]

- name: Download pinned Node archive
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ node_version }}/node-v{{ node_version }}-linux-x64.tar.xz"
    dest: "{{ local_cache }}/node-v{{ node_version }}-linux-x64.tar.xz"
    checksum: "sha256:{{ node_sha256 }}"
    mode: '0644'
  tags: [toolchain, node, agent_tools]

- name: Create Node version directory
  ansible.builtin.file:
    path: "{{ local_share }}/toolchains/node/{{ node_version }}"
    state: directory
    mode: '0755'
  tags: [toolchain, node, agent_tools]

- name: Extract pinned Node runtime
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/node-v{{ node_version }}-linux-x64.tar.xz"
    dest: "{{ local_share }}/toolchains/node/{{ node_version }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ local_share }}/toolchains/node/{{ node_version }}/bin/node"
  tags: [toolchain, node, agent_tools]

- name: Link Node and Corepack commands into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/toolchains/node/{{ node_version }}/bin/{{ item }}"
    dest: "{{ local_bin }}/{{ item }}"
    state: link
    force: true
  loop: [node, npm, npx, corepack]
  tags: [toolchain, node, agent_tools]

- name: Validate pinned Node runtime
  ansible.builtin.command:
    argv: ["{{ local_bin }}/node", --version]
  register: node_current
  changed_when: false
  failed_when: "('v' + node_version) not in node_current.stdout"
  tags: [toolchain, node, agent_tools]

- name: Download pinned Go archive
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
    dest: "{{ local_cache }}/go-{{ go_version }}.tar.gz"
    checksum: "sha256:{{ go_sha256 }}"
    mode: '0644'
  tags: [toolchain, go]

- name: Create Go version directory
  ansible.builtin.file:
    path: "{{ local_share }}/toolchains/go/{{ go_version }}"
    state: directory
    mode: '0755'
  tags: [toolchain, go]

- name: Extract pinned Go toolchain
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/go-{{ go_version }}.tar.gz"
    dest: "{{ local_share }}/toolchains/go/{{ go_version }}"
    remote_src: true
    creates: "{{ local_share }}/toolchains/go/{{ go_version }}/go/bin/go"
  tags: [toolchain, go]

- name: Link Go commands into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/toolchains/go/{{ go_version }}/go/bin/{{ item }}"
    dest: "{{ local_bin }}/{{ item }}"
    state: link
    force: true
  loop: [go, gofmt]
  tags: [toolchain, go, templ]

- name: Detect pinned templ generator
  ansible.builtin.command:
    argv: ["{{ local_bin }}/templ", version]
  register: templ_current
  failed_when: false
  changed_when: false
  tags: [toolchain, templ]

- name: Install pinned templ generator
  ansible.builtin.command:
    argv: ["{{ local_share }}/toolchains/go/{{ go_version }}/go/bin/go", install, "github.com/a-h/templ/cmd/templ@v{{ templ_version }}"]
  environment:
    GOBIN: "{{ local_bin }}"
    GOROOT: ""
    PATH: "{{ local_bin }}:{{ ansible_env.PATH }}"
  when: >-
    templ_current.rc != 0 or
    (templ_current.stdout | trim) != 'v' ~ templ_version or
    (templ_current.stderr | trim) != ''
  changed_when: true
  tags: [toolchain, templ]

- name: Download pinned sqlc archive
  ansible.builtin.get_url:
    url: "https://github.com/sqlc-dev/sqlc/releases/download/v{{ sqlc_version }}/sqlc_{{ sqlc_version }}_linux_amd64.tar.gz"
    dest: "{{ local_cache }}/sqlc-{{ sqlc_version }}.tar.gz"
    checksum: "sha256:{{ sqlc_sha256 }}"
    mode: '0644'
  tags: [toolchain, sqlc]

- name: Create sqlc version directory
  ansible.builtin.file:
    path: "{{ local_share }}/tools/sqlc/{{ sqlc_version }}"
    state: directory
    mode: '0755'
  tags: [toolchain, sqlc]

- name: Extract pinned sqlc
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/sqlc-{{ sqlc_version }}.tar.gz"
    dest: "{{ local_share }}/tools/sqlc/{{ sqlc_version }}"
    remote_src: true
    creates: "{{ local_share }}/tools/sqlc/{{ sqlc_version }}/sqlc"
  tags: [toolchain, sqlc]

- name: Link sqlc into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/sqlc/{{ sqlc_version }}/sqlc"
    dest: "{{ local_bin }}/sqlc"
    state: link
    force: true
  tags: [toolchain, sqlc]

- name: Download pinned ripgrep archive
  ansible.builtin.get_url:
    url: "https://github.com/BurntSushi/ripgrep/releases/download/{{ ripgrep_version }}/ripgrep-{{ ripgrep_version }}-x86_64-unknown-linux-musl.tar.gz"
    dest: "{{ local_cache }}/ripgrep-{{ ripgrep_version }}.tar.gz"
    checksum: "sha256:{{ ripgrep_sha256 }}"
    mode: '0644'
  tags: [toolchain, context_tools]

- name: Extract pinned ripgrep
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/ripgrep-{{ ripgrep_version }}.tar.gz"
    dest: "{{ local_share }}/tools"
    remote_src: true
    creates: "{{ local_share }}/tools/ripgrep-{{ ripgrep_version }}-x86_64-unknown-linux-musl/rg"
  tags: [toolchain, context_tools]

- name: Link ripgrep into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/ripgrep-{{ ripgrep_version }}-x86_64-unknown-linux-musl/rg"
    dest: "{{ local_bin }}/rg"
    state: link
    force: true
  tags: [toolchain, context_tools]

- name: Download pinned ast-grep archive
  ansible.builtin.get_url:
    url: "https://github.com/ast-grep/ast-grep/releases/download/{{ ast_grep_version }}/app-x86_64-unknown-linux-gnu.zip"
    dest: "{{ local_cache }}/ast-grep-{{ ast_grep_version }}.zip"
    checksum: "sha256:{{ ast_grep_sha256 }}"
    mode: '0644'
  tags: [toolchain, context_tools]

- name: Create ast-grep version directory
  ansible.builtin.file:
    path: "{{ local_share }}/tools/ast-grep-{{ ast_grep_version }}"
    state: directory
    mode: '0755'
  tags: [toolchain, context_tools]

- name: Extract pinned ast-grep
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/ast-grep-{{ ast_grep_version }}.zip"
    dest: "{{ local_share }}/tools/ast-grep-{{ ast_grep_version }}"
    remote_src: true
    creates: "{{ local_share }}/tools/ast-grep-{{ ast_grep_version }}/ast-grep"
  tags: [toolchain, context_tools]

- name: Link ast-grep into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/ast-grep-{{ ast_grep_version }}/ast-grep"
    dest: "{{ local_bin }}/ast-grep"
    state: link
    force: true
  tags: [toolchain, context_tools]


- name: Download pinned ORAS archive
  ansible.builtin.get_url:
    url: "https://github.com/oras-project/oras/releases/download/v{{ oras_version }}/oras_{{ oras_version }}_linux_amd64.tar.gz"
    dest: "{{ local_cache }}/oras-{{ oras_version }}.tar.gz"
    checksum: "sha256:{{ oras_sha256 }}"
    mode: '0644'
  tags: [toolchain, agent_tools]

- name: Create ORAS version directory
  ansible.builtin.file:
    path: "{{ local_share }}/tools/oras-{{ oras_version }}"
    state: directory
    mode: '0755'
  tags: [toolchain, agent_tools]

- name: Extract pinned ORAS
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/oras-{{ oras_version }}.tar.gz"
    dest: "{{ local_share }}/tools/oras-{{ oras_version }}"
    remote_src: true
    creates: "{{ local_share }}/tools/oras-{{ oras_version }}/oras"
  tags: [toolchain, agent_tools]

- name: Link ORAS into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/oras-{{ oras_version }}/oras"
    dest: "{{ local_bin }}/oras"
    state: link
    force: true
  tags: [toolchain, agent_tools]

- name: Download pinned GitHub CLI archive
  ansible.builtin.get_url:
    url: "https://github.com/cli/cli/releases/download/v{{ gh_version }}/gh_{{ gh_version }}_linux_amd64.tar.gz"
    dest: "{{ local_cache }}/gh-{{ gh_version }}-linux-amd64.tar.gz"
    checksum: "sha256:{{ gh_sha256 }}"
    mode: '0644'
  tags: [toolchain, agent_tools, gh]

- name: Create GitHub CLI version directory
  ansible.builtin.file:
    path: "{{ local_share }}/tools/gh-{{ gh_version }}"
    state: directory
    mode: '0755'
  tags: [toolchain, agent_tools, gh]

- name: Extract pinned GitHub CLI
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/gh-{{ gh_version }}-linux-amd64.tar.gz"
    dest: "{{ local_share }}/tools/gh-{{ gh_version }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ local_share }}/tools/gh-{{ gh_version }}/bin/gh"
  tags: [toolchain, agent_tools, gh]

- name: Link GitHub CLI into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/gh-{{ gh_version }}/bin/gh"
    dest: "{{ local_bin }}/gh"
    state: link
    force: true
  tags: [toolchain, agent_tools, gh]

- name: Validate pinned GitHub CLI version
  ansible.builtin.command:
    argv: ["{{ local_bin }}/gh", --version]
  register: gh_version_output
  changed_when: false
  failed_when: gh_version_output.rc != 0 or gh_version not in gh_version_output.stdout
  tags: [toolchain, agent_tools, gh]

- name: Validate required GitHub CLI slurp capability
  ansible.builtin.command:
    argv: ["{{ local_bin }}/gh", api, --help]
  register: gh_api_help
  changed_when: false
  failed_when: gh_api_help.rc != 0 or '--slurp' not in gh_api_help.stdout
  tags: [toolchain, agent_tools, gh]

- name: Download registry-managed archive tools
  ansible.builtin.get_url:
    url: "{{ item.value.artifact.url }}"
    dest: "{{ local_cache }}/{{ item.value.artifact.filename }}"
    checksum: "sha256:{{ toolchain_lock.versions[item.value.sha256_ref] }}"
    mode: '0644'
  loop: "{{ managed_tools | dict2items | selectattr('value.install.type', 'equalto', 'archive') }}"
  when:
    - item.key in active_tool_names
    - item.key != 'opentofu'
    - toolchain_lock.tool_lifecycle.active[item.key].provision.type == 'ansible'
    - not toolchain_offline
    - >-
      'all' in ansible_run_tags or 'toolchain' in ansible_run_tags or
      (item.key | replace('-', '_')) in ansible_run_tags or
      toolchain_lock.tool_lifecycle.active[item.key].provision.tags in ansible_run_tags
  tags: [toolchain, context_tools, packer, trivy, gitleaks, gosec, kube_bench, age, conftest, k6, nuclei, hubble, pint]

- name: Inspect cached registry-managed archive tools
  ansible.builtin.stat:
    path: "{{ local_cache }}/{{ item.value.artifact.filename }}"
    checksum_algorithm: sha256
  loop: "{{ managed_tools | dict2items | selectattr('value.install.type', 'equalto', 'archive') }}"
  register: registry_archive_cache
  when:
    - item.key in active_tool_names
    - item.key != 'opentofu'
    - toolchain_lock.tool_lifecycle.active[item.key].provision.type == 'ansible'
    - >-
      'all' in ansible_run_tags or 'toolchain' in ansible_run_tags or
      (item.key | replace('-', '_')) in ansible_run_tags or
      toolchain_lock.tool_lifecycle.active[item.key].provision.tags in ansible_run_tags
  tags: [toolchain, context_tools, packer, trivy, gitleaks, gosec, kube_bench, age, conftest, k6, nuclei, hubble, pint]

- name: Validate cached registry-managed archive tools
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.checksum == toolchain_lock.versions[item.item.value.sha256_ref]
    fail_msg: >-
      Cached tool {{ item.item.key }} is absent or does not match its central SHA-256;
      online reconciliation is required before offline use.
  loop: "{{ registry_archive_cache.results }}"
  when: not (item.skipped | default(false))
  tags: [toolchain, context_tools, packer, trivy, gitleaks, gosec, kube_bench, age, conftest, k6, nuclei, hubble, pint]

- name: Create registry-managed archive tool directories
  ansible.builtin.file:
    path: "{{ local_share }}/tools/{{ item.key }}-{{ toolchain_lock.versions[item.value.version_ref] }}"
    state: directory
    mode: '0755'
  loop: "{{ managed_tools | dict2items | selectattr('value.install.type', 'equalto', 'archive') }}"
  when:
    - item.key in active_tool_names
    - item.key != 'opentofu'
    - toolchain_lock.tool_lifecycle.active[item.key].provision.type == 'ansible'
    - >-
      'all' in ansible_run_tags or 'toolchain' in ansible_run_tags or
      (item.key | replace('-', '_')) in ansible_run_tags or
      toolchain_lock.tool_lifecycle.active[item.key].provision.tags in ansible_run_tags
  tags: [toolchain, context_tools, packer, trivy, gitleaks, gosec, kube_bench, age, conftest, k6, nuclei, hubble, pint]

- name: Extract registry-managed archive tools
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/{{ item.value.artifact.filename }}"
    dest: "{{ local_share }}/tools/{{ item.key }}-{{ toolchain_lock.versions[item.value.version_ref] }}"
    remote_src: true
    creates: "{{ local_share }}/tools/{{ item.key }}-{{ toolchain_lock.versions[item.value.version_ref] }}/{{ item.value.install.binary_relative }}"
  loop: "{{ managed_tools | dict2items | selectattr('value.install.type', 'equalto', 'archive') }}"
  when:
    - item.key in active_tool_names
    - item.key != 'opentofu'
    - toolchain_lock.tool_lifecycle.active[item.key].provision.type == 'ansible'
    - >-
      'all' in ansible_run_tags or 'toolchain' in ansible_run_tags or
      (item.key | replace('-', '_')) in ansible_run_tags or
      toolchain_lock.tool_lifecycle.active[item.key].provision.tags in ansible_run_tags
  tags: [toolchain, context_tools, packer, trivy, gitleaks, gosec, kube_bench, age, conftest, k6, nuclei, hubble, pint]

- name: Link registry-managed archive tools into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/{{ item.key }}-{{ toolchain_lock.versions[item.value.version_ref] }}/{{ item.value.install.binary_relative }}"
    dest: "{{ local_bin }}/{{ item.value.binary }}"
    state: link
    force: true
  loop: "{{ managed_tools | dict2items | selectattr('value.install.type', 'equalto', 'archive') }}"
  when:
    - item.key in active_tool_names
    - item.key != 'opentofu'
    - toolchain_lock.tool_lifecycle.active[item.key].provision.type == 'ansible'
    - >-
      'all' in ansible_run_tags or 'toolchain' in ansible_run_tags or
      (item.key | replace('-', '_')) in ansible_run_tags or
      toolchain_lock.tool_lifecycle.active[item.key].provision.tags in ansible_run_tags
  tags: [toolchain, context_tools, packer, trivy, gitleaks, gosec, kube_bench, age, conftest, k6, nuclei, hubble, pint]

- name: Download the immutable Nuclei template snapshot
  ansible.builtin.get_url:
    url: "{{ managed_tools.nuclei.templates.url }}"
    dest: "{{ local_cache }}/{{ managed_tools.nuclei.templates.filename }}"
    checksum: "sha256:{{ toolchain_lock.versions[managed_tools.nuclei.templates.sha256_ref] }}"
    mode: '0644'
  when: not toolchain_offline
  tags: [toolchain, nuclei]

- name: Inspect the cached Nuclei template snapshot
  ansible.builtin.stat:
    path: "{{ local_cache }}/{{ managed_tools.nuclei.templates.filename }}"
    checksum_algorithm: sha256
  register: nuclei_templates_cache
  tags: [toolchain, nuclei]

- name: Validate the cached Nuclei template snapshot
  ansible.builtin.assert:
    that:
      - nuclei_templates_cache.stat.exists
      - nuclei_templates_cache.stat.isreg
      - >-
        nuclei_templates_cache.stat.checksum ==
        toolchain_lock.versions[managed_tools.nuclei.templates.sha256_ref]
    fail_msg: >-
      The immutable Nuclei template snapshot is absent or does not match its
      central SHA-256; online reconciliation is required before offline use.
  tags: [toolchain, nuclei]

- name: Create the versioned Nuclei template directory
  ansible.builtin.file:
    path: >-
      {{ local_share }}/nuclei-templates/{{ toolchain_lock.versions[managed_tools.nuclei.templates.commit_ref] }}
    state: directory
    mode: '0755'
  tags: [toolchain, nuclei]

- name: Extract the immutable Nuclei template snapshot
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/{{ managed_tools.nuclei.templates.filename }}"
    dest: >-
      {{ local_share }}/nuclei-templates/{{ toolchain_lock.versions[managed_tools.nuclei.templates.commit_ref] }}
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: >-
      {{ local_share }}/nuclei-templates/{{ toolchain_lock.versions[managed_tools.nuclei.templates.commit_ref] }}/README.md
  tags: [toolchain, nuclei]

- name: Download registry-managed standalone binaries
  ansible.builtin.get_url:
    url: "{{ item.value.artifact.url }}"
    dest: "{{ local_share }}/tools/{{ item.key }}-{{ toolchain_lock.versions[item.value.version_ref] }}"
    checksum: "sha256:{{ toolchain_lock.versions[item.value.sha256_ref] }}"
    mode: '0755'
  loop: "{{ managed_tools | dict2items | selectattr('value.install.type', 'equalto', 'binary') }}"
  when:
    - item.key in active_tool_names
    - toolchain_lock.tool_lifecycle.active[item.key].provision.type == 'ansible'
    - not toolchain_offline
    - >-
      'all' in ansible_run_tags or 'toolchain' in ansible_run_tags or
      (item.key | replace('-', '_')) in ansible_run_tags or
      toolchain_lock.tool_lifecycle.active[item.key].provision.tags in ansible_run_tags
  tags: [toolchain, context_tools, docker_buildx, cosign, sops, opa]

- name: Inspect cached registry-managed standalone binaries
  ansible.builtin.stat:
    path: "{{ local_share }}/tools/{{ item.key }}-{{ toolchain_lock.versions[item.value.version_ref] }}"
    checksum_algorithm: sha256
  loop: "{{ managed_tools | dict2items | selectattr('value.install.type', 'equalto', 'binary') }}"
  register: registry_binary_cache
  when:
    - item.key in active_tool_names
    - toolchain_lock.tool_lifecycle.active[item.key].provision.type == 'ansible'
    - >-
      'all' in ansible_run_tags or 'toolchain' in ansible_run_tags or
      (item.key | replace('-', '_')) in ansible_run_tags or
      toolchain_lock.tool_lifecycle.active[item.key].provision.tags in ansible_run_tags
  tags: [toolchain, context_tools, docker_buildx, cosign, sops, opa]

- name: Validate cached registry-managed standalone binaries
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.checksum == toolchain_lock.versions[item.item.value.sha256_ref]
    fail_msg: >-
      Cached tool {{ item.item.key }} is absent or does not match its central SHA-256;
      online reconciliation is required before offline use.
  loop: "{{ registry_binary_cache.results }}"
  when: not (item.skipped | default(false))
  tags: [toolchain, context_tools, docker_buildx, cosign, sops, opa]

- name: Link registry-managed standalone binaries into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/{{ item.key }}-{{ toolchain_lock.versions[item.value.version_ref] }}"
    dest: "{{ local_bin }}/{{ item.value.binary }}"
    state: link
    force: true
  loop: "{{ managed_tools | dict2items | selectattr('value.install.type', 'equalto', 'binary') }}"
  when:
    - item.key in active_tool_names
    - toolchain_lock.tool_lifecycle.active[item.key].provision.type == 'ansible'
    - >-
      'all' in ansible_run_tags or 'toolchain' in ansible_run_tags or
      (item.key | replace('-', '_')) in ansible_run_tags or
      toolchain_lock.tool_lifecycle.active[item.key].provision.tags in ansible_run_tags
  tags: [toolchain, context_tools, docker_buildx, cosign, sops, opa]

- name: Create the user-local Docker CLI plugin directory
  ansible.builtin.file:
    path: "{{ docker_cli_plugin_dir }}"
    state: directory
    mode: '0755'
  tags: [toolchain, docker_buildx]
  when: "'docker-buildx' in active_tool_names"

- name: Link the pinned Buildx binary as a Docker CLI plugin
  ansible.builtin.file:
    src: "{{ local_share }}/tools/docker-buildx-{{ toolchain_lock.versions[managed_tools['docker-buildx'].version_ref] }}"
    dest: "{{ docker_cli_plugin_dir }}/docker-buildx"
    state: link
    force: true
  tags: [toolchain, docker_buildx]
  when: "'docker-buildx' in active_tool_names"

- name: Validate the pinned Docker Buildx CLI plugin
  ansible.builtin.command:
    argv: [docker, buildx, version]
  register: docker_buildx_current
  changed_when: false
  failed_when: >-
    docker_buildx_current.rc != 0 or
    ('v' ~ toolchain_lock.versions[managed_tools['docker-buildx'].version_ref]) not in
    (docker_buildx_current.stdout ~ docker_buildx_current.stderr)
  tags: [toolchain, docker_buildx]
  when: "'docker-buildx' in active_tool_names"

- name: Download the exact Skopeo distribution package
  ansible.builtin.get_url:
    url: "{{ managed_tools.skopeo.artifact.url }}"
    dest: "{{ local_cache }}/{{ managed_tools.skopeo.artifact.filename }}"
    checksum: "sha256:{{ toolchain_lock.versions[managed_tools.skopeo.sha256_ref] }}"
    mode: '0644'
  tags: [toolchain, skopeo]

- name: Install Skopeo with its declared system dependencies
  ansible.builtin.apt:
    deb: "{{ local_cache }}/{{ managed_tools.skopeo.artifact.filename }}"
    state: present
  become: true
  tags: [toolchain, skopeo]

- name: Detect registry-managed govulncheck
  ansible.builtin.command:
    argv: ["{{ local_bin }}/govulncheck", -version]
  register: govulncheck_current
  failed_when: false
  changed_when: false
  tags: [toolchain, govulncheck]

- name: Install registry-managed govulncheck through the pinned Go toolchain
  ansible.builtin.command:
    argv:
      - "{{ local_share }}/toolchains/go/{{ go_version }}/go/bin/go"
      - install
      - "{{ managed_tools.govulncheck.artifact.module }}@v{{ toolchain_lock.versions[managed_tools.govulncheck.version_ref] }}"
  environment:
    GOBIN: "{{ local_bin }}"
    GOROOT: ""
    GOSUMDB: sum.golang.org
    GOPROXY: https://proxy.golang.org
    PATH: "{{ local_bin }}:{{ ansible_env.PATH }}"
  when: >-
    govulncheck_current.rc != 0 or
    ('govulncheck@v' ~ toolchain_lock.versions[managed_tools.govulncheck.version_ref]) not in
    (govulncheck_current.stdout ~ govulncheck_current.stderr)
  changed_when: true
  tags: [toolchain, govulncheck]

- name: Download pinned Bazelisk
  ansible.builtin.get_url:
    url: "https://github.com/bazelbuild/bazelisk/releases/download/v{{ bazelisk_version }}/bazelisk-linux-amd64"
    dest: "{{ local_share }}/tools/bazelisk-{{ bazelisk_version }}"
    checksum: "sha256:{{ bazelisk_sha256 }}"
    mode: '0755'
  tags: [toolchain, agent_tools]

- name: Link Bazelisk and Bazel into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/bazelisk-{{ bazelisk_version }}"
    dest: "{{ local_bin }}/{{ item }}"
    state: link
    force: true
  loop: [bazelisk, bazel]
  tags: [toolchain, agent_tools]

- name: Download pinned oasdiff archive
  ansible.builtin.get_url:
    url: "https://github.com/oasdiff/oasdiff/releases/download/v{{ oasdiff_version }}/oasdiff_{{ oasdiff_version }}_linux_amd64.tar.gz"
    dest: "{{ local_cache }}/oasdiff-{{ oasdiff_version }}.tar.gz"
    checksum: "sha256:{{ oasdiff_sha256 }}"
    mode: '0644'
  tags: [toolchain, agent_tools]

- name: Create oasdiff version directory
  ansible.builtin.file:
    path: "{{ local_share }}/tools/oasdiff-{{ oasdiff_version }}"
    state: directory
    mode: '0755'
  tags: [toolchain, agent_tools]

- name: Extract pinned oasdiff
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/oasdiff-{{ oasdiff_version }}.tar.gz"
    dest: "{{ local_share }}/tools/oasdiff-{{ oasdiff_version }}"
    remote_src: true
    creates: "{{ local_share }}/tools/oasdiff-{{ oasdiff_version }}/oasdiff"
  tags: [toolchain, agent_tools]

- name: Link oasdiff into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/oasdiff-{{ oasdiff_version }}/oasdiff"
    dest: "{{ local_bin }}/oasdiff"
    state: link
    force: true
  tags: [toolchain, agent_tools]

- name: Check installed oapi-codegen version
  ansible.builtin.command:
    argv: ["{{ local_bin }}/oapi-codegen", --version]
  register: oapi_codegen_current
  failed_when: false
  changed_when: false
  tags: [toolchain, agent_tools, oapi_codegen]

- name: Install pinned oapi-codegen with the pinned Go toolchain
  ansible.builtin.command:
    argv:
      - "{{ resolved_executables.go | default(local_bin + '/go') }}"
      - install
      - "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v{{ oapi_codegen_version }}"
  environment:
    GOBIN: "{{ local_bin }}"
    # Empty means infer GOROOT from the selected executable, not the controller's inherited Go.
    GOROOT: ""
    PATH: "{{ (resolved_executables.go | default(local_bin + '/go')) | dirname }}:{{ local_bin }}:{{ ansible_env.PATH }}"
  when: oapi_codegen_current.rc != 0 or ('v' + oapi_codegen_version) not in oapi_codegen_current.stdout
  changed_when: true
  tags: [toolchain, agent_tools, oapi_codegen]

- name: Create isolated Nx tool workspace
  ansible.builtin.file:
    path: "{{ local_share }}/nx"
    state: directory
    mode: '0755'
  tags: [toolchain, agent_tools]

- name: Write pinned Nx package manifest
  ansible.builtin.copy:
    dest: "{{ local_share }}/nx/package.json"
    mode: '0644'
    content: |
      {
        "name": "ecommerce-1-nx-tool",
        "private": true,
        "packageManager": "pnpm@{{ pnpm_version }}",
        "dependencies": {"nx": "{{ nx_version }}"}
      }
  register: nx_manifest
  tags: [toolchain, agent_tools]

- name: Write fail-closed PNPM build policy for isolated Nx
  ansible.builtin.copy:
    dest: "{{ local_share }}/nx/pnpm-workspace.yaml"
    mode: '0644'
    content: |
      packages:
        - "."

      # PNPM 11 fails closed when a dependency exposes an unreviewed build
      # script. Nx requires its own reviewed postinstall to verify/load the
      # platform-native binary, so approve only the exact pinned Nx release.
      # A future Nx version must be reviewed and explicitly re-approved.
      strictDepBuilds: true
      allowBuilds:
        "nx@{{ nx_version }}": true
  register: nx_pnpm_policy
  tags: [toolchain, agent_tools]

- name: Check isolated Nx binary
  ansible.builtin.stat:
    path: "{{ local_share }}/nx/node_modules/.bin/nx"
  register: nx_binary
  tags: [toolchain, agent_tools]

- name: Install isolated pinned Nx dependency
  ansible.builtin.command:
    argv: ["{{ local_bin }}/corepack", pnpm, install, --no-frozen-lockfile]
    chdir: "{{ local_share }}/nx"
  environment:
    NODE_USE_ENV_PROXY: "1"
  when: nx_manifest.changed or nx_pnpm_policy.changed or not nx_binary.stat.exists
  changed_when: true
  tags: [toolchain, agent_tools]

- name: Read isolated Nx version after reviewed postinstall
  ansible.builtin.command:
    argv: ["{{ local_share }}/nx/node_modules/.bin/nx", --version]
    chdir: "{{ local_share }}/nx"
  register: nx_current
  changed_when: false
  tags: [toolchain, agent_tools]

- name: Validate exact isolated Nx local version
  ansible.builtin.assert:
    that:
      - "('- Local: v' + nx_version) in nx_current.stdout_lines"
    fail_msg: >-
      Expected isolated Nx local version v{{ nx_version }}, but `nx --version` returned:
      {{ nx_current.stdout | default('<no stdout>') }}
  tags: [toolchain, agent_tools]

- name: Link Nx into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/nx/node_modules/.bin/nx"
    dest: "{{ local_bin }}/nx"
    state: link
    force: true
  tags: [toolchain, agent_tools]

- name: Read installed pipx package versions
  ansible.builtin.command:
    argv: [pipx, runpip, "{{ item.key }}", show, "{{ item.value.provision.package }}"]
  loop: "{{ toolchain_lock.tool_lifecycle.active | dict2items }}"
  register: developer_pipx_checks
  failed_when: false
  changed_when: false
  when:
    - item.value.provision.type == 'pipx'
    - "'all' in ansible_run_tags or 'toolchain' in ansible_run_tags or item.value.provision.tags in ansible_run_tags"
  tags: [toolchain, ansible_lint, pre_commit]

- name: Install only missing or mismatched pipx packages
  ansible.builtin.command:
    argv:
      - pipx
      - install
      - --force
      - "{{ item.item.value.provision.package }}=={{ toolchain_lock.versions[item.item.value.version_ref] }}"
  loop: "{{ developer_pipx_checks.results }}"
  when:
    - not (item.skipped | default(false))
    - >-
      item.rc != 0 or
      ('Version: ' + toolchain_lock.versions[item.item.value.version_ref]) not in item.stdout
  changed_when: true
  tags: [toolchain, ansible_lint, pre_commit]

- name: Validate pinned Bazel version file
  ansible.builtin.command:
    argv: ["{{ local_bin }}/bazel", --version]
    chdir: "{{ repo_root }}"
  register: bazel_current
  changed_when: false
  failed_when: "('bazel ' + bazel_version) not in bazel_current.stdout"
  environment:
    PATH: "{{ local_bin }}:{{ ansible_env.PATH }}"
  tags: [toolchain, agent_tools]
- name: Reconcile pinned source quality tools
  ansible.builtin.import_tasks: quality.yml

- name: Download pinned OpenTofu release verification assets
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ local_cache }}/{{ item.filename }}"
    checksum: "sha256:{{ toolchain_lock.versions[item.sha256_ref] }}"
    mode: '0644'
  loop:
    - url: "{{ managed_tools.opentofu.artifact.checksums_url }}"
      filename: "{{ managed_tools.opentofu.artifact.checksums_filename }}"
      sha256_ref: "{{ managed_tools.opentofu.supply_chain.checksums_sha256_ref }}"
    - url: "{{ managed_tools.opentofu.artifact.gpg_signature_url }}"
      filename: "{{ managed_tools.opentofu.artifact.gpg_signature_filename }}"
      sha256_ref: "{{ managed_tools.opentofu.supply_chain.gpg_signature_sha256_ref }}"
    - url: "{{ managed_tools.opentofu.artifact.gpg_key_url }}"
      filename: "{{ managed_tools.opentofu.artifact.gpg_key_filename }}"
      sha256_ref: "{{ managed_tools.opentofu.supply_chain.trust_anchor_sha256_ref }}"
  when: not toolchain_offline
  tags: [toolchain, opentofu]

- name: Download pinned OpenTofu archive
  ansible.builtin.get_url:
    url: "{{ managed_tools.opentofu.artifact.url }}"
    dest: "{{ local_cache }}/{{ managed_tools.opentofu.artifact.filename }}"
    checksum: "sha256:{{ toolchain_lock.versions[managed_tools.opentofu.sha256_ref] }}"
    mode: '0644'
  when: not toolchain_offline
  tags: [toolchain, opentofu]

- name: Inspect cached OpenTofu release artifacts
  ansible.builtin.stat:
    path: "{{ local_cache }}/{{ item.filename }}"
    checksum_algorithm: sha256
  loop:
    - filename: "{{ managed_tools.opentofu.artifact.filename }}"
      sha256_ref: "{{ managed_tools.opentofu.sha256_ref }}"
    - filename: "{{ managed_tools.opentofu.artifact.checksums_filename }}"
      sha256_ref: "{{ managed_tools.opentofu.supply_chain.checksums_sha256_ref }}"
    - filename: "{{ managed_tools.opentofu.artifact.gpg_signature_filename }}"
      sha256_ref: "{{ managed_tools.opentofu.supply_chain.gpg_signature_sha256_ref }}"
    - filename: "{{ managed_tools.opentofu.artifact.gpg_key_filename }}"
      sha256_ref: "{{ managed_tools.opentofu.supply_chain.trust_anchor_sha256_ref }}"
  register: opentofu_cached_artifacts
  tags: [toolchain, opentofu]

- name: Validate cached OpenTofu release artifact integrity
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.checksum == toolchain_lock.versions[item.item.sha256_ref]
    fail_msg: >-
      OpenTofu cache artifact {{ item.item.filename }} is absent or does not match
      the pinned SHA-256; online reconciliation is required before offline use.
  loop: "{{ opentofu_cached_artifacts.results }}"
  tags: [toolchain, opentofu]

- name: Verify the exact OpenTofu OpenPGP signing-key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --with-colons
      - --show-keys
      - --fingerprint
      - "{{ local_cache }}/{{ managed_tools.opentofu.artifact.gpg_key_filename }}"
  register: opentofu_gpg_key
  changed_when: false
  failed_when: >-
    opentofu_gpg_key.rc != 0 or
    ('fpr:::::::::' + managed_tools.opentofu.supply_chain.gpg_fingerprint + ':') not in
    opentofu_gpg_key.stdout
  tags: [toolchain, opentofu]

- name: Create the versioned OpenTofu verification directory
  ansible.builtin.file:
    path: >-
      {{ local_share }}/tools/opentofu-verification-{{ toolchain_lock.versions[managed_tools.opentofu.version_ref] }}
    state: directory
    mode: '0755'
  tags: [toolchain, opentofu]

- name: Materialize the exact OpenTofu OpenPGP keyring
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --dearmor
      - --output
      - >-
        {{ local_share }}/tools/opentofu-verification-{{ toolchain_lock.versions[managed_tools.opentofu.version_ref] }}/opentofu.gpg
      - "{{ local_cache }}/{{ managed_tools.opentofu.artifact.gpg_key_filename }}"
  changed_when: false
  tags: [toolchain, opentofu]

- name: Verify the OpenTofu checksum manifest signature offline
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --no-default-keyring
      - --keyring
      - >-
        {{ local_share }}/tools/opentofu-verification-{{ toolchain_lock.versions[managed_tools.opentofu.version_ref] }}/opentofu.gpg
      - --verify
      - "{{ local_cache }}/{{ managed_tools.opentofu.artifact.gpg_signature_filename }}"
      - "{{ local_cache }}/{{ managed_tools.opentofu.artifact.checksums_filename }}"
  changed_when: false
  tags: [toolchain, opentofu]

- name: Verify the OpenTofu archive against the authenticated manifest
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import pathlib,sys;
        expected=sys.argv[1].lower(); name=sys.argv[2];
        lines=pathlib.Path(sys.argv[3]).read_text(encoding='utf-8').splitlines();
        matches=[line.split() for line in lines if line.split() and line.split()[-1].lstrip('*') == name];
        raise SystemExit(0 if len(matches) == 1 and matches[0][0].lower() == expected else 1)
      - "{{ toolchain_lock.versions[managed_tools.opentofu.sha256_ref] }}"
      - "{{ managed_tools.opentofu.artifact.filename }}"
      - "{{ local_cache }}/{{ managed_tools.opentofu.artifact.checksums_filename }}"
  changed_when: false
  tags: [toolchain, opentofu]

- name: Create OpenTofu version directory
  ansible.builtin.file:
    path: "{{ local_share }}/tools/opentofu-{{ toolchain_lock.versions[managed_tools.opentofu.version_ref] }}"
    state: directory
    mode: '0755'
  tags: [toolchain, opentofu]

- name: Extract pinned OpenTofu archive
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/{{ managed_tools.opentofu.artifact.filename }}"
    dest: "{{ local_share }}/tools/opentofu-{{ toolchain_lock.versions[managed_tools.opentofu.version_ref] }}"
    remote_src: true
    creates: >-
      {{ local_share }}/tools/opentofu-{{ toolchain_lock.versions[managed_tools.opentofu.version_ref] }}/tofu
  tags: [toolchain, opentofu]

- name: Link OpenTofu into the user path
  ansible.builtin.file:
    src: >-
      {{ local_share }}/tools/opentofu-{{ toolchain_lock.versions[managed_tools.opentofu.version_ref] }}/tofu
    dest: "{{ local_bin }}/tofu"
    state: link
    force: true
  tags: [toolchain, opentofu]

- name: Validate pinned OpenTofu version
  ansible.builtin.command:
    argv: ["{{ local_bin }}/tofu", version]
  register: opentofu_version_output
  changed_when: false
  failed_when: >-
    opentofu_version_output.rc != 0 or
    ('OpenTofu v' + toolchain_lock.versions[managed_tools.opentofu.version_ref]) not in
    opentofu_version_output.stdout
  tags: [toolchain, opentofu]

# These gate tools deliberately have distinct tags: one failed download must not
# prevent the capability controller from reconciling unrelated source branches.
- name: Download pinned standalone gate archives
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ local_cache }}/{{ item.archive }}"
    checksum: "sha256:{{ item.checksum }}"
    mode: '0644'
  loop:
    - name: helm
      url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
      archive: "helm-{{ helm_version }}.tar.gz"
      checksum: "{{ helm_sha256 }}"
      tag: helm
    - name: kustomize
      # yamllint disable-line rule:line-length
      url: "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv{{ kustomize_version }}/kustomize_v{{ kustomize_version }}_linux_amd64.tar.gz"
      archive: "kustomize-{{ kustomize_version }}.tar.gz"
      checksum: "{{ kustomize_sha256 }}"
      tag: kustomize
  when: "'all' in ansible_run_tags or item.tag in ansible_run_tags"
  tags: [helm, kustomize]

- name: Create standalone gate tool directories
  ansible.builtin.file:
    path: "{{ local_share }}/tools/{{ item.name }}-{{ item.version }}"
    state: directory
    mode: '0755'
  loop:
    - {name: helm, version: "{{ helm_version }}", tag: helm}
    - {name: kustomize, version: "{{ kustomize_version }}", tag: kustomize}
  when: "'all' in ansible_run_tags or item.tag in ansible_run_tags"
  tags: [helm, kustomize]

- name: Extract pinned standalone gate tools
  ansible.builtin.unarchive:
    src: "{{ local_cache }}/{{ item.archive }}"
    dest: "{{ local_share }}/tools/{{ item.name }}-{{ item.version }}"
    remote_src: true
    creates: "{{ local_share }}/tools/{{ item.name }}-{{ item.version }}/{{ item.creates }}"
  loop:
    - {name: helm, version: "{{ helm_version }}", archive: "helm-{{ helm_version }}.tar.gz", creates: linux-amd64/helm, tag: helm}
    - {name: kustomize, version: "{{ kustomize_version }}", archive: "kustomize-{{ kustomize_version }}.tar.gz", creates: kustomize, tag: kustomize}
  when: "'all' in ansible_run_tags or item.tag in ansible_run_tags"
  tags: [helm, kustomize]

- name: Link standalone gate tools into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/{{ item.name }}-{{ item.version }}/{{ item.relative }}"
    dest: "{{ local_bin }}/{{ item.name }}"
    state: link
    force: true
  loop:
    - {name: helm, version: "{{ helm_version }}", relative: linux-amd64/helm, tag: helm}
    - {name: kustomize, version: "{{ kustomize_version }}", relative: kustomize, tag: kustomize}
  when: "'all' in ansible_run_tags or item.tag in ansible_run_tags"
  tags: [helm, kustomize]

- name: Download pinned kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: "{{ local_share }}/tools/kubectl-{{ kubectl_version }}"
    checksum: "sha256:{{ kubectl_sha256 }}"
    mode: '0755'
  tags: [kubectl]

- name: Link kubectl into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/tools/kubectl-{{ kubectl_version }}"
    dest: "{{ local_bin }}/kubectl"
    state: link
    force: true
  tags: [kubectl]
