- name: Check installed oapi-codegen version
  ansible.builtin.command:
    argv: ["{{ local_bin }}/oapi-codegen", --version]
  register: oapi_codegen_current
  failed_when: false
  changed_when: false
  tags: [toolchain, agent_tools]

- name: Install pinned oapi-codegen with the pinned Go toolchain
  ansible.builtin.command:
    argv:
      - "{{ local_bin }}/go"
      - install
      - "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v{{ oapi_codegen_version }}"
  environment:
    GOBIN: "{{ local_bin }}"
    PATH: "{{ local_bin }}:{{ ansible_env.PATH }}"
  when: oapi_codegen_current.rc != 0 or ('v' + oapi_codegen_version) not in oapi_codegen_current.stdout
  changed_when: true
  tags: [toolchain, agent_tools]

- name: Create isolated Nx tool workspace
  ansible.builtin.file:
    path: "{{ local_share }}/nx"
    state: directory
    mode: '0755'
  tags: [toolchain, agent_tools]

- name: Write pinned Nx package manifest
  ansible.builtin.copy:
    dest: "{{ local_share }}/nx/package.json"
    mode: '0644'
    content: |
      {
        "name": "ecommerce-1-nx-tool",
        "private": true,
        "packageManager": "pnpm@{{ pnpm_version }}",
        "dependencies": {"nx": "{{ nx_version }}"}
      }
  register: nx_manifest
  tags: [toolchain, agent_tools]

- name: Write fail-closed PNPM build policy for isolated Nx
  ansible.builtin.copy:
    dest: "{{ local_share }}/nx/pnpm-workspace.yaml"
    mode: '0644'
    content: |
      packages:
        - "."

      # PNPM 11 fails closed when a dependency exposes an unreviewed build
      # script. Nx requires its own reviewed postinstall to verify/load the
      # platform-native binary, so approve only the exact pinned Nx release.
      # A future Nx version must be reviewed and explicitly re-approved.
      strictDepBuilds: true
      allowBuilds:
        "nx@{{ nx_version }}": true
  register: nx_pnpm_policy
  tags: [toolchain, agent_tools]

- name: Check isolated Nx binary
  ansible.builtin.stat:
    path: "{{ local_share }}/nx/node_modules/.bin/nx"
  register: nx_binary
  tags: [toolchain, agent_tools]

- name: Install isolated pinned Nx dependency
  ansible.builtin.command:
    argv: ["{{ local_bin }}/corepack", pnpm, install, --no-frozen-lockfile]
    chdir: "{{ local_share }}/nx"
  when: nx_manifest.changed or nx_pnpm_policy.changed or not nx_binary.stat.exists
  changed_when: true
  tags: [toolchain, agent_tools]

- name: Read isolated Nx version after reviewed postinstall
  ansible.builtin.command:
    argv: ["{{ local_share }}/nx/node_modules/.bin/nx", --version]
    chdir: "{{ local_share }}/nx"
  register: nx_current
  changed_when: false
  tags: [toolchain, agent_tools]

- name: Validate exact isolated Nx local version
  ansible.builtin.assert:
    that:
      - "('- Local: v' + nx_version) in nx_current.stdout_lines"
    fail_msg: >-
      Expected isolated Nx local version v{{ nx_version }}, but `nx --version` returned:
      {{ nx_current.stdout | default('<no stdout>') }}
  tags: [toolchain, agent_tools]

- name: Link Nx into the user path
  ansible.builtin.file:
    src: "{{ local_share }}/nx/node_modules/.bin/nx"
    dest: "{{ local_bin }}/nx"
    state: link
    force: true
  tags: [toolchain, agent_tools]

- name: Install pinned frontend dependencies and accelerators
  ansible.builtin.command:
    argv: ["{{ local_bin }}/corepack", pnpm, install, --frozen-lockfile, --prefer-offline]
    chdir: "{{ repo_root }}/frontend"
  changed_when: false
  tags: [toolchain, agent_tools]

- name: Define isolated Python CLI pins
  ansible.builtin.set_fact:
    developer_pipx_packages:
      - { name: pre-commit, package: pre-commit, version: "{{ pre_commit_version }}", spec: "pre-commit=={{ pre_commit_version }}" }
      - { name: molecule, package: molecule, version: "{{ molecule_version }}", spec: "molecule=={{ molecule_version }}" }
      - { name: ansible-runner, package: ansible-runner, version: "{{ ansible_runner_version }}", spec: "ansible-runner=={{ ansible_runner_version }}" }
      - { name: ansible-builder, package: ansible-builder, version: "{{ ansible_builder_version }}", spec: "ansible-builder=={{ ansible_builder_version }}" }
      - name: ansible-navigator
        package: ansible-navigator
        version: "{{ ansible_navigator_version }}"
        spec: "ansible-navigator=={{ ansible_navigator_version }}"
      - { name: ggshield, package: ggshield, version: "{{ ggshield_version }}", spec: "ggshield=={{ ggshield_version }}" }
      - { name: checkov, package: checkov, version: "{{ checkov_version }}", spec: "checkov=={{ checkov_version }}" }
      - { name: semgrep, package: semgrep, version: "{{ semgrep_version }}", spec: "semgrep=={{ semgrep_version }}" }
      - { name: cve-bin-tool, package: cve-bin-tool, version: "{{ cve_bin_tool_version }}", spec: "cve-bin-tool=={{ cve_bin_tool_version }}" }
  tags: [toolchain]

- name: Read installed pipx package versions
  ansible.builtin.command:
    argv: [pipx, runpip, "{{ item.name }}", pip, show, "{{ item.package }}"]
  loop: "{{ developer_pipx_packages }}"
  register: developer_pipx_checks
  failed_when: false
  changed_when: false
  tags: [toolchain]

- name: Install only missing or mismatched pipx packages
  ansible.builtin.command:
    argv: [pipx, install, --force, "{{ item.item.spec }}"]
  loop: "{{ developer_pipx_checks.results }}"
  when: "item.rc != 0 or ('Version: ' + item.item.version) not in item.stdout"
  changed_when: true
  tags: [toolchain]

- name: Check Molecule Docker plugin version
  ansible.builtin.command:
    argv: [pipx, runpip, molecule, pip, show, molecule-plugins]
  register: molecule_plugins_check
  failed_when: false
  changed_when: false
  tags: [toolchain]

- name: Check Molecule Testinfra version
  ansible.builtin.command:
    argv: [pipx, runpip, molecule, pip, show, pytest-testinfra]
  register: testinfra_check
  failed_when: false
  changed_when: false
  tags: [toolchain]

- name: Inject pinned Molecule Docker and Testinfra helpers when needed
  ansible.builtin.command:
    argv:
      - pipx
      - inject
      - --force
      - molecule
      - "molecule-plugins[docker]=={{ molecule_docker_version }}"
      - "pytest-testinfra=={{ testinfra_version }}"
  when: >-
    molecule_plugins_check.rc != 0 or ('Version: ' + molecule_docker_version) not in molecule_plugins_check.stdout or
    testinfra_check.rc != 0 or ('Version: ' + testinfra_version) not in testinfra_check.stdout
  changed_when: true
  tags: [toolchain]

- name: Validate pinned Bazel version file
  ansible.builtin.command:
    argv: ["{{ local_bin }}/bazel", --version]
    chdir: "{{ repo_root }}"
  register: bazel_current
  changed_when: false
  failed_when: "('bazel ' + bazel_version) not in bazel_current.stdout"
  environment:
    PATH: "{{ local_bin }}:{{ ansible_env.PATH }}"
  tags: [toolchain, agent_tools]
