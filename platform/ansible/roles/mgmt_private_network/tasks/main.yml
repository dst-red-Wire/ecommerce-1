---
- name: Install private-network firewall authority
  ansible.builtin.dnf:
    name: [firewalld, nftables]
    state: present
    disablerepo: "*"

- name: Enable and start private-network firewall authority
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Require canonical trust-zone inputs
  ansible.builtin.assert:
    that:
      - mgmt_firewall_role in ['control-plane', 'worker']
      - mgmt_firewall_cidrs['401'] | length > 0
      - mgmt_firewall_cidrs['402'] | length > 0
      - mgmt_firewall_cidrs['403'] | length > 0
      - mgmt_firewall_cidrs['405'] | length > 0
      - groups['access_gateways'] | length == 1
      - hostvars[groups['access_gateways'][0]]['mgmt_ip'] | length > 0
    fail_msg: "Private host filtering requires canonical segments and exactly one canonical access gateway."

# Own the complete dedicated zone, including sources and every allowed rule.
# Replacing this file removes stale grants; additive firewall-cmd updates cannot.
- name: Reconcile complete persistent private enforcement zone
  ansible.builtin.template:
    src: mgmt-private.xml.j2
    dest: /etc/firewalld/zones/mgmt-private.xml
    owner: root
    group: root
    mode: "0600"
  notify: Reload private firewalld

- name: Activate private default-deny policy before RKE2 consumers
  ansible.builtin.meta: flush_handlers

- name: Assert canonical private-network inputs
  ansible.builtin.assert:
    that:
      - mgmt_ip is string
      - mgmt_ip | length > 0
      - mgmt_private_alias_cidrs is sequence
      - mgmt_private_alias_cidrs | length >= 1
      - mgmt_private_alias_cidrs | unique | list | length == mgmt_private_alias_cidrs | length
    fail_msg: >-
      MGMT private-network reconciliation requires one canonical DHCP primary mgmt_ip
      and a non-empty unique mgmt_private_alias_cidrs list from the dynamic inventory.

- name: Discover the private interface carrying the provider DHCP primary
  ansible.builtin.command:
    argv:
      - ip
      - -o
      - -4
      - addr
      - show
      - to
      - "{{ mgmt_ip }}/32"
  register: mgmt_private_primary_probe
  changed_when: false
  check_mode: false

- name: Require exactly one interface for the canonical MGMT primary address
  ansible.builtin.assert:
    that:
      - mgmt_private_primary_probe.stdout_lines | length == 1
      - mgmt_private_primary_probe.stdout_lines[0].split() | length >= 2
    fail_msg: >-
      Could not identify exactly one interface carrying canonical mgmt_ip={{ mgmt_ip }}.
      Hetzner DHCP must configure the segment-401 primary before alias reconciliation.

- name: Select the private interface without guessing a device name
  ansible.builtin.set_fact:
    mgmt_private_interface: >-
      {{ mgmt_private_primary_probe.stdout_lines[0].split()[1].split('@')[0] }}

- name: Discover the active NetworkManager connection for the private interface
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - GENERAL.CONNECTION
      - device
      - show
      - "{{ mgmt_private_interface }}"
  register: mgmt_private_connection_probe
  changed_when: false
  check_mode: false

- name: Require an active NetworkManager connection
  ansible.builtin.assert:
    that:
      - mgmt_private_connection_probe.stdout | trim | length > 0
      - mgmt_private_connection_probe.stdout | trim != "--"
    fail_msg: >-
      The private interface {{ mgmt_private_interface }} has no active NetworkManager
      connection; refusing to create or guess a replacement profile.

- name: Record the active private NetworkManager connection
  ansible.builtin.set_fact:
    mgmt_private_connection: "{{ mgmt_private_connection_probe.stdout | trim }}"

- name: Read the complete configured static alias set on the private connection
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - ipv4.addresses
      - connection
      - show
      - "{{ mgmt_private_connection }}"
  register: mgmt_private_alias_config
  changed_when: false
  check_mode: false

- name: Normalize configured private-network aliases
  ansible.builtin.set_fact:
    mgmt_private_configured_alias_cidrs: >-
      {{ mgmt_private_alias_config.stdout
         | regex_findall('(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}') }}

- name: Report complete alias-set drift in Ansible check mode
  ansible.builtin.debug:
    msg: >-
      Private-network aliases require full reconciliation from
      {{ mgmt_private_configured_alias_cidrs }} to {{ mgmt_private_alias_cidrs }}.
  changed_when: >-
    (mgmt_private_configured_alias_cidrs | sort) != (mgmt_private_alias_cidrs | sort)
  when: ansible_check_mode

- name: Reconcile the complete canonical static alias set on the existing private connection
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ mgmt_private_connection }}"
      - ipv4.addresses
      - "{{ mgmt_private_alias_cidrs | join(',') }}"
  register: mgmt_private_alias_updates
  changed_when: true
  when:
    - not ansible_check_mode
    - (mgmt_private_configured_alias_cidrs | sort) != (mgmt_private_alias_cidrs | sort)

- name: Reapply the existing private connection after alias changes
  ansible.builtin.command:
    argv:
      - nmcli
      - device
      - reapply
      - "{{ mgmt_private_interface }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - mgmt_private_alias_updates is changed

- name: Verify every canonical alias after reconciliation
  ansible.builtin.command:
    argv:
      - ip
      - -o
      - -4
      - addr
      - show
      - dev
      - "{{ mgmt_private_interface }}"
      - to
      - "{{ item.split('/')[0] }}/32"
  loop: "{{ mgmt_private_alias_cidrs }}"
  loop_control:
    label: "{{ item }}"
  register: mgmt_private_alias_verify
  changed_when: false
  when: not ansible_check_mode

- name: Require all canonical aliases to be active
  ansible.builtin.assert:
    that:
      - item.stdout | trim | length > 0
    fail_msg: "Private-network alias {{ item.item }} is still absent after reconciliation."
  loop: "{{ mgmt_private_alias_verify.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('check-mode') }}"
  when: not ansible_check_mode

- name: Create private bootstrap enforcement directory
  ansible.builtin.file:
    path: /etc/ecommerce
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read the provider DHCP server from the active private connection
  ansible.builtin.command:
    argv: [nmcli, --get-values, DHCP4.OPTION, device, show, "{{ mgmt_private_interface }}"]
  register: mgmt_private_dhcp_options
  changed_when: false

- name: Require exactly one observed DHCP server identifier
  ansible.builtin.assert:
    that:
      - mgmt_private_dhcp_options.stdout | regex_findall('(?m)^dhcp_server_identifier = ([0-9.]+)$') | length == 1
    fail_msg: "Private DHCP server identity must be observed before installing renewal policy."

- name: Select observed private DHCP renewal destination
  ansible.builtin.set_fact:
    mgmt_private_dhcp_server: >-
      {{ (mgmt_private_dhcp_options.stdout | regex_findall('(?m)^dhcp_server_identifier = ([0-9.]+)$'))[0] }}

- name: Reject an Internet or malformed DHCP renewal destination
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import ipaddress, sys;
        address = ipaddress.IPv4Address(sys.argv[1]);
        assert address.is_private and not address.is_loopback and not address.is_multicast and not address.is_unspecified
      - "{{ mgmt_private_dhcp_server }}"
  changed_when: false

- name: Render complete deny-Internet egress transaction
  ansible.builtin.template:
    src: mgmt-egress.nft.j2
    dest: /etc/ecommerce/mgmt-egress.nft
    owner: root
    group: root
    mode: "0600"

- name: Check egress syntax before installing the transaction
  ansible.builtin.command:
    argv: [nft, --check, --file, /etc/ecommerce/mgmt-egress.nft]
  changed_when: false

- name: Persist egress enforcement before either RKE2 service
  ansible.builtin.template:
    src: mgmt-egress.service.j2
    dest: /etc/systemd/system/ecommerce-mgmt-egress.service
    owner: root
    group: root
    mode: "0644"

- name: Activate the exact owned egress policy including drift correction
  ansible.builtin.systemd_service:
    name: ecommerce-mgmt-egress
    enabled: true
    daemon_reload: true
    state: restarted

# RKE2 needs a default route to discover a primary interface even offline.
# An on-link route to a deliberately nonexistent peer on a dummy device provides
# that prerequisite without forwarding Internet packets through wg-01.
- name: Inspect persistent offline default-route connection
  ansible.builtin.command:
    argv: [nmcli, --get-values, connection.id, connection, show, ecommerce-offline-default]
  register: mgmt_offline_default_connection
  changed_when: false
  failed_when: mgmt_offline_default_connection.rc not in [0, 10]

- name: Create the isolated dummy connection for offline RKE2
  ansible.builtin.command:
    argv: [nmcli, connection, add, type, dummy, ifname, mgmt-dummy0, con-name, ecommerce-offline-default]
  when: mgmt_offline_default_connection.rc == 10
  changed_when: true

- name: Reconcile a non-forwarding persistent default route
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - ecommerce-offline-default
      - ipv4.method
      - manual
      - ipv4.addresses
      - 203.0.113.254/31
      - ipv4.gateway
      - 203.0.113.255
      - ipv4.route-metric
      - "32760"
      - ipv4.ignore-auto-dns
      - "yes"
      - ipv6.method
      - disabled
      - connection.autoconnect
      - "yes"
  changed_when: true

- name: Activate the offline default before RKE2 starts
  ansible.builtin.command:
    argv: [nmcli, connection, up, ecommerce-offline-default]
  changed_when: true
