---
- name: Install private-network firewall authority
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Enable and start private-network firewall authority
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Require canonical trust-zone inputs
  ansible.builtin.assert:
    that:
      - mgmt_firewall_role in ['control-plane', 'worker']
      - mgmt_firewall_cidrs[401] | length > 0
      - mgmt_firewall_cidrs[402] | length > 0
      - mgmt_firewall_cidrs[403] | length > 0
      - mgmt_firewall_cidrs[405] | length > 0
    fail_msg: "Private host filtering requires distinct canonical management, Kubernetes, storage, and backup segments."

- name: Query the dedicated private enforcement zone
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, --get-zones]
  register: mgmt_private_firewall_zones
  changed_when: false

- name: Create the dedicated private enforcement zone
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, --new-zone=mgmt-private]
  when: "'mgmt-private' not in mgmt_private_firewall_zones.stdout.split()"
  changed_when: true
  notify: Reload private firewalld

- name: Reconcile default-deny target for the private enforcement zone
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, --zone=mgmt-private, --set-target=DROP]
  register: mgmt_private_firewall_target
  changed_when: "'ZONE_ALREADY_SET' not in mgmt_private_firewall_target.stderr"
  failed_when: mgmt_private_firewall_target.rc != 0
  notify: Reload private firewalld

- name: Reconcile canonical source segments into the private enforcement zone
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, --zone=mgmt-private, "--add-source={{ item.value }}"]
  loop: "{{ mgmt_firewall_cidrs | dict2items }}"
  register: mgmt_private_firewall_sources
  changed_when: "'ALREADY_ENABLED' not in mgmt_private_firewall_sources.stderr"
  failed_when: mgmt_private_firewall_sources.rc != 0
  notify: Reload private firewalld

- name: Define canonical private east-west firewall rules
  ansible.builtin.set_fact:
    mgmt_private_firewall_rules: >-
      {{
        [
          'rule family=ipv4 source address=' ~ mgmt_firewall_cidrs[401] ~ ' service name=ssh accept',
          'rule family=ipv4 source address=' ~ mgmt_firewall_cidrs[402] ~ ' port port=10250 protocol=tcp accept',
          'rule family=ipv4 source address=' ~ mgmt_firewall_cidrs[402] ~ ' port port=8472 protocol=udp accept'
        ]
        + (
          [
            'rule family=ipv4 source address=' ~ mgmt_firewall_cidrs[402] ~ ' port port=6443 protocol=tcp accept',
            'rule family=ipv4 source address=' ~ mgmt_firewall_cidrs[402] ~ ' port port=9345 protocol=tcp accept',
            'rule family=ipv4 source address=' ~ mgmt_firewall_cidrs[402] ~ ' port port=2379-2381 protocol=tcp accept'
          ] if mgmt_firewall_role == 'control-plane' else [
            'rule family=ipv4 source address=' ~ mgmt_firewall_cidrs[403] ~ ' accept',
            'rule family=ipv4 source address=' ~ mgmt_firewall_cidrs[405] ~ ' accept'
          ]
        )
      }}

- name: Query persistent private east-west allow rules
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=mgmt-private
      - "--query-rich-rule={{ item }}"
  loop: "{{ mgmt_private_firewall_rules }}"
  register: mgmt_private_firewall_queries
  changed_when: false
  failed_when: mgmt_private_firewall_queries.rc not in [0, 1]

- name: Add missing persistent private east-west allow rules
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=mgmt-private
      - "--add-rich-rule={{ item.item }}"
  loop: "{{ mgmt_private_firewall_queries.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 1
  changed_when: true
  notify: Reload private firewalld

- name: Assert canonical private-network inputs
  ansible.builtin.assert:
    that:
      - mgmt_ip is string
      - mgmt_ip | length > 0
      - mgmt_private_alias_cidrs is sequence
      - mgmt_private_alias_cidrs | length >= 1
      - mgmt_private_alias_cidrs | unique | list | length == mgmt_private_alias_cidrs | length
    fail_msg: >-
      MGMT private-network reconciliation requires one canonical DHCP primary mgmt_ip
      and a non-empty unique mgmt_private_alias_cidrs list from the dynamic inventory.

- name: Discover the private interface carrying the provider DHCP primary
  ansible.builtin.command:
    argv:
      - ip
      - -o
      - -4
      - addr
      - show
      - to
      - "{{ mgmt_ip }}/32"
  register: mgmt_private_primary_probe
  changed_when: false
  check_mode: false

- name: Require exactly one interface for the canonical MGMT primary address
  ansible.builtin.assert:
    that:
      - mgmt_private_primary_probe.stdout_lines | length == 1
      - mgmt_private_primary_probe.stdout_lines[0].split() | length >= 2
    fail_msg: >-
      Could not identify exactly one interface carrying canonical mgmt_ip={{ mgmt_ip }}.
      Hetzner DHCP must configure the segment-401 primary before alias reconciliation.

- name: Select the private interface without guessing a device name
  ansible.builtin.set_fact:
    mgmt_private_interface: >-
      {{ mgmt_private_primary_probe.stdout_lines[0].split()[1].split('@')[0] }}

- name: Discover the active NetworkManager connection for the private interface
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - GENERAL.CONNECTION
      - device
      - show
      - "{{ mgmt_private_interface }}"
  register: mgmt_private_connection_probe
  changed_when: false
  check_mode: false

- name: Require an active NetworkManager connection
  ansible.builtin.assert:
    that:
      - mgmt_private_connection_probe.stdout | trim | length > 0
      - mgmt_private_connection_probe.stdout | trim != "--"
    fail_msg: >-
      The private interface {{ mgmt_private_interface }} has no active NetworkManager
      connection; refusing to create or guess a replacement profile.

- name: Record the active private NetworkManager connection
  ansible.builtin.set_fact:
    mgmt_private_connection: "{{ mgmt_private_connection_probe.stdout | trim }}"

- name: Probe each canonical alias on the selected private interface
  ansible.builtin.command:
    argv:
      - ip
      - -o
      - -4
      - addr
      - show
      - dev
      - "{{ mgmt_private_interface }}"
      - to
      - "{{ item.split('/')[0] }}/32"
  loop: "{{ mgmt_private_alias_cidrs }}"
  loop_control:
    label: "{{ item }}"
  register: mgmt_private_alias_probe
  changed_when: false
  check_mode: false

- name: Report alias changes in Ansible check mode
  ansible.builtin.debug:
    msg: >-
      Private-network aliases requiring reconciliation: {{ mgmt_private_alias_probe.results
      | selectattr('stdout', 'equalto', '') | map(attribute='item') | list }}
  changed_when: >-
    (mgmt_private_alias_probe.results | selectattr('stdout', 'equalto', '') | list | length) > 0
  when: ansible_check_mode

- name: Persist missing canonical aliases on the existing private connection
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ mgmt_private_connection }}"
      - +ipv4.addresses
      - "{{ item.item }}"
  loop: "{{ mgmt_private_alias_probe.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: mgmt_private_alias_updates
  changed_when: true
  when:
    - not ansible_check_mode
    - item.stdout | trim == ""

- name: Reapply the existing private connection after alias changes
  ansible.builtin.command:
    argv:
      - nmcli
      - device
      - reapply
      - "{{ mgmt_private_interface }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - mgmt_private_alias_updates is changed

- name: Verify every canonical alias after reconciliation
  ansible.builtin.command:
    argv:
      - ip
      - -o
      - -4
      - addr
      - show
      - dev
      - "{{ mgmt_private_interface }}"
      - to
      - "{{ item.split('/')[0] }}/32"
  loop: "{{ mgmt_private_alias_cidrs }}"
  loop_control:
    label: "{{ item }}"
  register: mgmt_private_alias_verify
  changed_when: false
  when: not ansible_check_mode

- name: Require all canonical aliases to be active
  ansible.builtin.assert:
    that:
      - item.stdout | trim | length > 0
    fail_msg: "Private-network alias {{ item.item }} is still absent after reconciliation."
  loop: "{{ mgmt_private_alias_verify.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('check-mode') }}"
  when: not ansible_check_mode
