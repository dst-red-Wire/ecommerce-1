---
- name: Install baseline workstation packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - jq
      - make
      - pipx
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 86400
  become: true
  tags: [workstation, bootstrap]

- name: Create project-owned Ansible collection directory
  ansible.builtin.file:
    path: "{{ repo_root }}/.ansible/collections"
    state: directory
    mode: '0755'
  tags: [workstation, bootstrap, ansible_collections]

- name: Reconcile pinned project Ansible collections
  ansible.builtin.command:
    argv:
      - ansible-galaxy
      - collection
      - install
      - --requirements-file
      - "{{ repo_root }}/platform/ansible/requirements.yml"
      - --collections-path
      - "{{ repo_root }}/.ansible/collections"
  register: ansible_collection_install
  changed_when: "'Nothing to do.' not in ansible_collection_install.stdout"
  tags: [workstation, bootstrap, ansible_collections]

- name: Read repository Git default lines
  ansible.builtin.set_fact:
    developer_git_default_lines: >-
      {{ lookup('ansible.builtin.file', repo_root + '/config/workstation/git-local.conf').splitlines() }}
    developer_git_defaults: []
  tags: [workstation, git]

- name: Select active repository Git defaults
  ansible.builtin.set_fact:
    developer_git_defaults: "{{ developer_git_defaults + [item] }}"
  loop: "{{ developer_git_default_lines }}"
  when:
    - item | trim | length > 0
    - not (item | trim).startswith('#')
  tags: [workstation, git]

- name: Validate repository Git defaults
  ansible.builtin.assert:
    that:
      - "'=' in item"
      - "item.split('=', 1)[0] | trim | length > 0"
      - "item.split('=', 1) | length == 2"
    fail_msg: >-
      Invalid repository Git default entry {{ item | to_json }}:
      expected a non-empty key and an accessible value in key=value form.
  loop: "{{ developer_git_defaults }}"
  loop_control:
    label: "{{ item }}"
  tags: [workstation, git]

- name: Read current repository-local Git defaults
  ansible.builtin.command:
    argv: [git, config, --local, --get, "{{ item.split('=', 1)[0] }}"]
    chdir: "{{ repo_root }}"
  loop: "{{ developer_git_defaults }}"
  register: developer_git_current
  failed_when: false
  changed_when: false
  tags: [workstation, git]

- name: Reconcile repository-local Git defaults
  ansible.builtin.command:
    argv:
      - git
      - config
      - --local
      - "{{ item.split('=', 1)[0] }}"
      - "{{ item.split('=', 1)[1] }}"
    chdir: "{{ repo_root }}"
  loop: "{{ developer_git_current.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: >-
    item.rc != 0 or
    (item.stdout | trim) != item.item.split('=', 1)[1]
  changed_when: true
  tags: [workstation, git]

- name: Validate Git identity fields without inventing identity
  ansible.builtin.command:
    argv: [git, config, --get, "{{ item }}"]
    chdir: "{{ repo_root }}"
  loop: [user.name, user.email]
  changed_when: false
  tags: [workstation, git]

- name: Validate origin remote
  ansible.builtin.command:
    argv: [git, remote, get-url, origin]
    chdir: "{{ repo_root }}"
  changed_when: false
  tags: [workstation, git]

- name: Probe Docker daemon
  ansible.builtin.command:
    argv: [docker, info]
  register: docker_probe
  changed_when: false
  failed_when: false
  tags: [workstation, docker]

- name: Start Docker Desktop through the supported Windows Docker CLI
  ansible.builtin.command:
    argv: [docker.exe, desktop, start]
  register: docker_desktop_start
  changed_when: true
  failed_when: false
  when: docker_probe.rc != 0
  tags: [workstation, docker]

- name: Fall back to the official Docker Desktop executable through PowerShell
  ansible.builtin.command:
    argv:
      - powershell.exe
      - -NoLogo
      - -NoProfile
      - -NonInteractive
      - -Command
      - "$p = Join-Path $Env:ProgramFiles 'Docker\\Docker\\Docker Desktop.exe'; if (Test-Path $p) { Start-Process -FilePath $p; exit 0 } else { exit 1 }"
  when: docker_probe.rc != 0 and docker_desktop_start.rc != 0
  changed_when: true
  tags: [workstation, docker]

- name: Wait until Docker daemon is reachable
  ansible.builtin.command:
    argv: [docker, info]
  register: docker_ready
  changed_when: false
  retries: 30
  delay: 2
  until: docker_ready.rc == 0
  when: docker_probe.rc != 0
  tags: [workstation, docker]

- name: Install repository pre-commit hooks
  ansible.builtin.command:
    argv: [pre-commit, install, --install-hooks]
    chdir: "{{ repo_root }}"
  changed_when: false
  tags: [workstation, bootstrap]

- name: Install repository pre-push hook
  ansible.builtin.command:
    argv: [pre-commit, install, --hook-type, pre-push]
    chdir: "{{ repo_root }}"
  changed_when: false
  tags: [workstation, bootstrap]
