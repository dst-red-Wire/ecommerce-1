---
- name: Require the supported immutable host contract
  ansible.builtin.assert:
    that:
      - ansible_facts.system == "Linux"
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version == qualification_ubuntu_release
      - ansible_facts.architecture == qualification_architecture
      - qualification_user is defined
      - qualification_user | length > 0
    fail_msg: >-
      Qualification requires Ubuntu {{ qualification_ubuntu_release }} on
      {{ qualification_architecture }} and an explicit non-root qualification_user.

- name: Look up the pre-existing qualification account
  ansible.builtin.getent:
    database: passwd
    key: "{{ qualification_user }}"
    fail_key: true

- name: Require a regular interactive qualification account
  ansible.builtin.assert:
    that:
      - getent_passwd[qualification_user][1] | int >= 1000
      - getent_passwd[qualification_user][1] | int < 60000
      - getent_passwd[qualification_user][4] == '/home/' + qualification_user
      - getent_passwd[qualification_user][5] is match('^/(bin|usr/bin)/(bash|sh|zsh)$')
    fail_msg: >-
      qualification_user must be a pre-existing Ubuntu regular account (UID
      1000-59999) with /home/<user> and an interactive shell.

- name: Require non-interactive escalation for repository bootstrap
  ansible.builtin.command:
    argv: [sudo, --non-interactive, "true"]
  become_user: "{{ qualification_user }}"
  changed_when: false

- name: Configure the immutable Ubuntu archive snapshot
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ubuntu-qualification-snapshot.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://snapshot.ubuntu.com/ubuntu/{{ qualification_ubuntu_snapshot }}
      Suites: {{ qualification_ubuntu_codename }} {{ qualification_ubuntu_codename }}-updates {{ qualification_ubuntu_codename }}-security
      Components: main universe
      Architectures: amd64
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

- name: Find mutable Ubuntu package sources
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "*.list"
      - "*.sources"
    excludes: ubuntu-qualification-snapshot.sources
    file_type: file
  register: qualification_mutable_sources

- name: Remove mutable Ubuntu package sources from the ephemeral runner
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ qualification_mutable_sources.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Remove the legacy mutable Ubuntu package source
  ansible.builtin.file:
    path: /etc/apt/sources.list
    state: absent

- name: Install exact qualification host packages
  ansible.builtin.apt:
    name: "{{ qualification_packages }}"
    state: present
    update_cache: true
    allow_downgrade: true

- name: Prevent silent qualification package drift
  ansible.builtin.dpkg_selections:
    name: "{{ item.split('=')[0] }}"
    selection: hold
  loop: "{{ qualification_packages }}"

- name: Persist container network forwarding
  ansible.builtin.copy:
    dest: "{{ qualification_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
    content: "net.ipv4.ip_forward=1\n"
  notify: Load qualification network forwarding

- name: Enable and start Docker Engine
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Grant the qualification user Docker socket access
  ansible.builtin.user:
    name: "{{ qualification_user }}"
    groups: docker
    append: true

- name: Apply persistent network configuration before verification
  ansible.builtin.meta: flush_handlers

- name: Read live IPv4 forwarding state before reconciliation
  ansible.builtin.command:
    argv: [sysctl, -n, net.ipv4.ip_forward]
  register: qualification_ip_forward_before
  changed_when: false

- name: Reconcile live IPv4 forwarding state
  ansible.builtin.command:
    argv: [sysctl, -w, net.ipv4.ip_forward=1]
  when: qualification_ip_forward_before.stdout != "1"
  changed_when: true

- name: Verify persistent IPv4 forwarding value
  ansible.builtin.command:
    argv: [sysctl, -n, net.ipv4.ip_forward]
  register: qualification_ip_forward
  changed_when: false
  failed_when: qualification_ip_forward.stdout != "1"

- name: Verify Docker client and server as qualification user without sudo
  ansible.builtin.command:
    argv: [docker, version]
  become: true
  become_user: "{{ qualification_user }}"
  register: qualification_docker_version
  changed_when: false
  failed_when: >-
    qualification_docker_version.rc != 0 or
    'Server:' not in qualification_docker_version.stdout

- name: Verify Docker daemon information as qualification user without sudo
  ansible.builtin.command:
    argv: [docker, info]
  become: true
  become_user: "{{ qualification_user }}"
  changed_when: false
