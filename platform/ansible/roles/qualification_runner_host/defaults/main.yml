---
# Ubuntu package versions are deliberately exact. Update them only after the
# replacement Ubuntu 24.04 repository snapshot has passed the qualification.
qualification_ubuntu_release: "24.04"
qualification_packages:
  - "docker.io=26.1.3-0ubuntu1~24.04.1"
  - "git=1:2.43.0-1ubuntu7.3"
  - "make=4.3-4.1build2"
  - "python3=3.12.3-0ubuntu2.1"
qualification_sysctl_file: /etc/sysctl.d/60-ecommerce-m1-qualification.conf

