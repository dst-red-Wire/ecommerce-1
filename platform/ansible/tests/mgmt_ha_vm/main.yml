---
- name: Qualify six-node local Rocky RKE2 HA
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - contract.yml
  vars:
    ha_repo: "{{ (playbook_dir ~ '/../../../..') | realpath }}"
    ha_head_sha: "{{ lookup('pipe', 'git -C ' ~ (ha_repo | quote) ~ ' rev-parse HEAD') | trim }}"
    ha_state: "{{ ha_repo }}/.context/mgmt-ha/{{ ha_head_sha }}"
    ha_token_file: "{{ ha_state }}/rke2-token"
    ha_haproxy_tar: "{{ ha_repo }}/{{ mgmt_local_ha_contract.ha_endpoint.image.cache_tar }}"
    ha_haproxy_evidence: "{{ ha_repo }}/{{ mgmt_local_ha_contract.ha_endpoint.image.cache_evidence }}"
    ha_inventory: "{{ ha_state }}/inventory.yml"
    ha_cluster_log: "{{ ha_state }}/cluster.log"
    ha_completion: "{{ ha_state }}/completion.json"
    ha_sources: "{{ mgmt_local_ha_contract.canonical_sources }}"
    ha_single_contract_path: "{{ ha_repo }}/{{ ha_sources.local_vm_contract }}"
    ha_single_contract: "{{ (lookup('file', ha_single_contract_path) | from_yaml).mgmt_local_vm_contract }}"
    ha_bootstrap_path: "{{ ha_repo }}/{{ ha_sources.mgmt_bootstrap }}"
    ha_network_plan_path: "{{ ha_repo }}/{{ ha_sources.network_plan }}"
    ha_bundle_lock_path: "{{ ha_repo }}/{{ ha_single_contract.bundle_lock }}"
    ha_rke2_version: "{{ (lookup('file', ha_bootstrap_path) | from_yaml).rke2.version }}"
    ha_bundle_version: "{{ ha_rke2_version | regex_replace('[+.]', '-') }}"
    ha_bundle_dir: "{{ ha_repo }}/.context/rke2-offline-bundle-{{ ha_bundle_version }}"
    ha_manifest_sha256: "{{ (lookup('file', ha_bundle_lock_path) | from_json).approved_manifest_sha256 }}"
    ha_single_fixture: "{{ ha_repo }}/{{ ha_sources.local_vm_entrypoint }}"
    ha_ansible_playbook: "{{ ansible_playbook_python | dirname }}/ansible-playbook"
    ha_lifecycle_guard: "{{ playbook_dir }}/lifecycle_guard.py"
    ha_nodes: "{{ mgmt_local_ha_contract.nodes | dict2items }}"
    ha_cold_stage_batches: >-
      {{
        ha_nodes
        | batch(mgmt_local_ha_contract.execution.cold_stage_parallelism)
        | list
      }}
    ha_cleanup_batches: >-
      {{
        ha_nodes
        | batch(mgmt_local_ha_contract.execution.cleanup_parallelism)
        | list
      }}
  tasks:
    - name: Require exact SHA input from registered launcher
      ansible.builtin.assert:
        that:
          - ha_head_sha is match('^[0-9a-f]{40}$')
          - ha_repo is match('^/')
          - ha_repo == ((playbook_dir ~ '/../../../..') | realpath)
          - ha_head_sha == (lookup('pipe', 'git -C ' ~ (ha_repo | quote) ~ ' rev-parse HEAD') | trim)
          - mgmt_local_ha_contract.nodes | length == 6
          - mgmt_local_ha_contract.capacity_production_claim is false

    - name: Create bounded HA evidence directory
      ansible.builtin.file:
        path: "{{ ha_state }}"
        state: directory
        mode: "0700"

    - name: Remove stale HA completion marker before any state-changing campaign
      ansible.builtin.file:
        path: "{{ ha_completion }}"
        state: absent

    - name: Require existing PR 128 offline bundle
      ansible.builtin.stat:
        path: "{{ ha_bundle_dir }}"
      register: ha_bundle_stat

    - name: Refuse to rebuild or download the PR 128 bundle implicitly
      ansible.builtin.assert:
        that:
          - ha_bundle_stat.stat.isdir | default(false)
        fail_msg: >-
          Missing {{ ha_bundle_dir }}. Rebuild the already-qualified PR 128 bundle explicitly
          before HA qualification; this workflow never widens PR 128 by downloading implicitly.

    - name: Verify exact Windows VirtualBox version
      ansible.builtin.command:
        argv: ["{{ mgmt_local_ha_contract.controller.virtualbox_windows }}", --version]
      register: ha_vbox_version
      changed_when: false
      failed_when: >-
        ha_vbox_version.rc != 0
        or ha_vbox_version.stdout | trim != mgmt_local_ha_contract.controller.virtualbox_version

    - name: Discover Windows fixture state root without changing host settings
      ansible.builtin.command:
        argv:
          - /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
          - -NoProfile
          - -NonInteractive
          - -Command
          - '[Environment]::GetFolderPath("LocalApplicationData")'
      register: ha_localappdata
      changed_when: false

    - name: Resolve Windows fixture state root to WSL
      ansible.builtin.command:
        argv: [wslpath, -u, "{{ ha_localappdata.stdout | trim }}"]
      register: ha_windows_parent
      changed_when: false

    - name: Define canonical Windows fixture state root
      ansible.builtin.set_fact:
        ha_windows_state_root: "{{ ha_windows_parent.stdout | trim }}/Temp/ecommerce/.context"
      changed_when: false

    - name: Require pre-prepared digest-pinned HAProxy archive
      ansible.builtin.stat:
        path: "{{ ha_haproxy_tar }}"
      register: ha_haproxy_tar_stat

    - name: Require bounded HAProxy preparation evidence
      ansible.builtin.stat:
        path: "{{ ha_haproxy_evidence }}"
      register: ha_haproxy_evidence_stat

    - name: Refuse implicit HAProxy download during qualification
      ansible.builtin.assert:
        that:
          - ha_haproxy_tar_stat.stat.isreg | default(false)
          - ha_haproxy_evidence_stat.stat.isreg | default(false)
        fail_msg: >-
          Run 'make rke2-local-ha-prepare' while Docker Desktop is available,
          then Docker Desktop may be closed before the six-VM qualification.

    - name: Read HAProxy preparation evidence
      ansible.builtin.slurp:
        src: "{{ ha_haproxy_evidence }}"
      register: ha_haproxy_preparation

    - name: Hash cached HAProxy archive before use
      ansible.builtin.command:
        argv: [sha256sum, "{{ ha_haproxy_tar }}"]
      register: ha_haproxy_archive_hash
      changed_when: false

    - name: Require cached HAProxy bytes to match digest-bound preparation evidence
      ansible.builtin.assert:
        that:
          - (ha_haproxy_preparation.content | b64decode | from_json).status == 'PASS'
          - >-
            (ha_haproxy_preparation.content | b64decode | from_json).source_reference
            == mgmt_local_ha_contract.ha_endpoint.image.reference
          - >-
            (ha_haproxy_preparation.content | b64decode | from_json).archive_sha256
            == (ha_haproxy_archive_hash.stdout | trim).split()[0]
          - >-
            (ha_haproxy_preparation.content | b64decode | from_json).run_as_user
            == mgmt_local_ha_contract.ha_endpoint.run_as_user
          - >-
            (ha_haproxy_preparation.content | b64decode | from_json).run_as_group
            == mgmt_local_ha_contract.ha_endpoint.run_as_group

    - name: Validate selected host-only adapter and address
      ansible.builtin.command:
        argv: ["{{ mgmt_local_ha_contract.controller.virtualbox_windows }}", list, hostonlyifs]
      register: ha_hostonly
      changed_when: false

    - name: Require exact existing host-only network without modifying host networking
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - >-
            import re,sys;
            blocks=[dict(line.split(':',1) for line in block.splitlines() if ':' in line)
            for block in re.split(r'\n\s*\n',sys.stdin.read())];
            blocks=[{k.strip():v.strip() for k,v in block.items()} for block in blocks];
            selected=[b for b in blocks if b.get('Name')==sys.argv[1]];
            assert len(selected)==1;
            assert selected[0].get('IPAddress')==sys.argv[2];
            assert selected[0].get('NetworkMask')=='255.255.255.0';
            assert selected[0].get('DHCP')=='Disabled'
          - "{{ mgmt_local_ha_contract.controller.hostonly_adapter }}"
          - "{{ mgmt_local_ha_contract.controller.host_address }}"
        stdin: "{{ ha_hostonly.stdout }}"
      changed_when: false

    - name: Require all fixed fixture addresses to be unique
      ansible.builtin.assert:
        that:
          - >-
            (mgmt_local_ha_contract.nodes | dict2items
             | map(attribute='value.address') | list | unique | length) == 6
          - >-
            mgmt_local_ha_contract.ha_endpoint.host in mgmt_local_ha_contract.nodes

    - name: List registered VirtualBox machines before HA creation
      ansible.builtin.command:
        argv: ["{{ mgmt_local_ha_contract.controller.virtualbox_windows }}", list, vms]
      register: ha_registered_vms
      changed_when: false

    - name: Refuse collisions with owned HA VM names
      ansible.builtin.assert:
        that:
          - item.value.vm_name not in ha_registered_vms.stdout
        fail_msg: "VirtualBox already contains {{ item.value.vm_name }}; cleanup is required before HA qualification."
      loop: "{{ ha_nodes }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Probe fixed HA addresses on the selected Windows host-only segment before VM creation
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - >-
            import subprocess,sys;
            raise SystemExit(subprocess.run(
            [sys.argv[1],'-n','1','-w','1000','-S',sys.argv[2],sys.argv[3]],
            stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode)
          - "{{ mgmt_local_ha_contract.controller.windows_ping }}"
          - "{{ mgmt_local_ha_contract.controller.host_address }}"
          - "{{ item.value.address }}"
      loop: "{{ ha_nodes }}"
      loop_control:
        label: "{{ item.key }}={{ item.value.address }}"
      register: ha_address_probes
      changed_when: false
      failed_when: false

    - name: Require fixed HA addresses not to answer before creation
      ansible.builtin.assert:
        that:
          - item.rc != 0
        fail_msg: >-
          Address {{ item.item.value.address }} responds from the selected VirtualBox
          host-only source {{ mgmt_local_ha_contract.controller.host_address }};
          refusing a local host-only network collision.
      loop: "{{ ha_address_probes.results }}"
      loop_control:
        label: "{{ item.item.key }}={{ item.item.value.address }}"

    - name: Require a clean frozen worktree immediately before VM creation
      ansible.builtin.command:
        argv: [git, -C, "{{ ha_repo }}", status, --porcelain, --untracked-files=all]
      register: ha_frozen_status
      changed_when: false
      failed_when: ha_frozen_status.stdout | trim | length > 0

    - name: Fingerprint exact HA sources before creating machines
      ansible.builtin.command:
        argv:
          - sha256sum
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/contract.yml"
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/main.yml"
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/single_vm_action.yml"
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/cold_stage_batch.yml"
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/destroy_vm_batch.yml"
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/retry_destroy_vm.yml"
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/lifecycle_guard.py"
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/cluster.yml"
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/server_node.yml"
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/agent_node.yml"
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/lab_services.py"
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/service_probe.py"
          - "{{ ha_repo }}/platform/ansible/tests/mgmt_ha_vm/ha_probe.py"
          - "{{ ha_repo }}/platform/ansible/roles/rke2_server/tasks/main.yml"
          - "{{ ha_repo }}/platform/ansible/roles/rke2_agent/tasks/main.yml"
          - "{{ ha_repo }}/{{ ha_sources.private_firewall_template }}"
          - "{{ ha_repo }}/{{ ha_sources.egress_template }}"
          - "{{ ha_repo }}/{{ ha_sources.egress_service_template }}"
          - "{{ ha_repo }}/scripts/repoctl.py"
          - "{{ ha_bundle_lock_path }}"
          - "{{ ha_bootstrap_path }}"
          - "{{ ha_network_plan_path }}"
          - "{{ ha_repo }}/{{ ha_sources.qualification_policy }}"
          - "{{ ha_repo }}/config/contracts/toolchain-lock.json"
          - "{{ ha_repo }}/config/toolchain/versions.env"
          - "{{ ha_repo }}/platform/ansible/requirements.yml"
      register: ha_source_hashes
      changed_when: false

    - name: Preserve exact HA source fingerprints
      ansible.builtin.copy:
        dest: "{{ ha_state }}/source.sha256"
        content: "{{ ha_source_hashes.stdout }}\n"
        mode: "0600"

    - name: Create and cold-stage all six Rocky VMs from the PR 128 fixture
      block:
        - name: Generate invocation-local shared RKE2 token
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - -c
              - >-
                import pathlib,secrets,sys;
                p=pathlib.Path(sys.argv[1]);
                p.write_text(secrets.token_urlsafe(48)+'\n',encoding='utf-8');
                p.chmod(0o600)
              - "{{ ha_token_file }}"
          changed_when: true
          no_log: true

        - name: Create each Rocky VM sequentially and fail fast before the next node
          ansible.builtin.include_tasks: single_vm_action.yml
          loop: "{{ ha_nodes }}"
          loop_control:
            loop_var: ha_node
            label: "{{ ha_node.key }}"
          vars:
            ha_single_vm_action: create

        - name: Cold-stage the approved PR 128 bundle two VMs at a time
          ansible.builtin.include_tasks: cold_stage_batch.yml
          loop: "{{ ha_cold_stage_batches }}"
          loop_control:
            loop_var: ha_vm_batch
            label: >-
              {{
                ha_vm_batch | map(attribute='key') | join(',')
              }}

        - name: Render six-node Ansible inventory using pinned per-VM SSH identities
          ansible.builtin.copy:
            dest: "{{ ha_inventory }}"
            mode: "0600"
            content: |
              all:
                children:
                  control_planes:
                    hosts:
              {% for item in ha_nodes if item.value.role == 'control-plane' %}
                      {{ item.value.hostname }}:
                        ha_node_ip: {{ item.value.address }}
                        mgmt_ip: {{ item.value.address }}
                        ansible_host: {{ item.value.vm_name }}
                        ansible_user: vagrant
                        ansible_become: true
                        ansible_python_interpreter: /usr/bin/python3
                        ansible_ssh_common_args: "-F {{ ha_repo }}/.context/mgmt-offline-vm/{{ item.value.vm_name }}/ssh_config"
              {% endfor %}
                  workers:
                    hosts:
              {% for item in ha_nodes if item.value.role == 'worker' %}
                      {{ item.value.hostname }}:
                        ha_node_ip: {{ item.value.address }}
                        mgmt_ip: {{ item.value.address }}
                        ansible_host: {{ item.value.vm_name }}
                        ansible_user: vagrant
                        ansible_become: true
                        ansible_python_interpreter: /usr/bin/python3
                        ansible_ssh_common_args: "-F {{ ha_repo }}/.context/mgmt-offline-vm/{{ item.value.vm_name }}/ssh_config"
              {% endfor %}
                  access_gateways:
                    hosts:
                      ha-worker-03:

        - name: Execute complete six-node HA campaign
          ansible.builtin.command:
            argv:
              - "{{ ha_ansible_playbook }}"
              - -i
              - "{{ ha_inventory }}"
              - "{{ playbook_dir }}/cluster.yml"
              - --forks
              - "{{ mgmt_local_ha_contract.execution.max_forks }}"
              - -e
              - "ha_repo={{ ha_repo }}"
              - -e
              - "ha_head_sha={{ ha_head_sha }}"
              - -e
              - "ha_state={{ ha_state }}"
              - -e
              - "ha_token_file={{ ha_token_file }}"
              - -e
              - "ha_haproxy_tar={{ ha_haproxy_tar }}"
              - -e
              - "ha_manifest_sha256={{ ha_manifest_sha256 }}"
          environment:
            PYTHONDONTWRITEBYTECODE: "1"
            ANSIBLE_ROLES_PATH: "{{ ha_repo }}/platform/ansible/roles"
          register: ha_cluster
          failed_when: false
          changed_when: true

        - name: Preserve bounded cluster log
          ansible.builtin.copy:
            dest: "{{ ha_cluster_log }}"
            content: "{{ ha_cluster.stdout }}\n{{ ha_cluster.stderr }}\n"
            mode: "0600"

        - name: Require complete HA campaign success
          ansible.builtin.assert:
            that:
              - ha_cluster.rc == 0
            fail_msg: "Inspect {{ ha_cluster_log }}; HA evidence is not accepted on partial success."

        - name: Read authoritative HA result
          ansible.builtin.slurp:
            src: "{{ ha_state }}/result.json"
          register: ha_result

        - name: Require exact-SHA PASS evidence
          ansible.builtin.assert:
            that:
              - (ha_result.content | b64decode | from_json).status == 'PASS'
              - (ha_result.content | b64decode | from_json).head_sha == ha_head_sha
              - (ha_result.content | b64decode | from_json).six_machines_simultaneously_running | bool
              - (ha_result.content | b64decode | from_json).control_planes == 3
              - (ha_result.content | b64decode | from_json).workers == 3
              - (ha_result.content | b64decode | from_json).etcd_members == 3
              - (ha_result.content | b64decode | from_json).etcd_healthy_members == 3
              - (ha_result.content | b64decode | from_json).etcd_alarms | length == 0
              - (ha_result.content | b64decode | from_json).quorum_write_pass | bool
              - (ha_result.content | b64decode | from_json).control_plane_recovered | bool
              - (ha_result.content | b64decode | from_json).snapshot_nonempty | bool
              - (ha_result.content | b64decode | from_json).ha_registration_pass | bool
              - (ha_result.content | b64decode | from_json).ha_api_read_write_pass | bool
              - (ha_result.content | b64decode | from_json).public_egress_denied | bool
              - (ha_result.content | b64decode | from_json).selinux_enforcing | bool
              - (ha_result.content | b64decode | from_json).capacity_production is false
              - (ha_result.content | b64decode | from_json).real_hetzner_network is false
              - (ha_result.content | b64decode | from_json).physical_failure is false

        - name: Require sources unchanged throughout HA campaign
          ansible.builtin.command:
            argv: [sha256sum, --check, "{{ ha_state }}/source.sha256"]
          changed_when: false

      always:
        - name: Initialize bounded cleanup result accumulator
          ansible.builtin.set_fact:
            ha_destroy_results: []
            ha_destroy_retry_results: []
          changed_when: false

        - name: Destroy owned HA VMs two at a time while attempting all six
          ansible.builtin.include_tasks: destroy_vm_batch.yml
          loop: "{{ ha_cleanup_batches }}"
          loop_control:
            loop_var: ha_vm_batch
            label: >-
              {{
                ha_vm_batch | map(attribute='key') | join(',')
              }}

        - name: Remove invocation-local cluster token
          ansible.builtin.file:
            path: "{{ ha_token_file }}"
            state: absent

        - name: Preserve every bounded-pair cleanup result before reconciliation
          ansible.builtin.copy:
            dest: "{{ ha_state }}/cleanup-initial.json"
            content: "{{ ha_destroy_results | to_nice_json }}"
            mode: "0600"

        - name: Preserve each failed cleanup result for deterministic classification
          ansible.builtin.copy:
            dest: "{{ ha_state }}/cleanup-{{ item.node }}-initial.json"
            content: "{{ item | to_nice_json }}"
            mode: "0600"
          loop: "{{ ha_destroy_results | selectattr('rc', 'ne', 0) | list }}"
          loop_control:
            label: "{{ item.node }}"

        - name: Reconcile only failed cleanup results sequentially and at most once
          ansible.builtin.include_tasks: retry_destroy_vm.yml
          loop: "{{ ha_destroy_results | selectattr('rc', 'ne', 0) | list }}"
          loop_control:
            loop_var: ha_failed_destroy
            label: "{{ ha_failed_destroy.node }}"

        - name: Preserve bounded sequential cleanup reconciliation results
          ansible.builtin.copy:
            dest: "{{ ha_state }}/cleanup-retry.json"
            content: "{{ ha_destroy_retry_results | to_nice_json }}"
            mode: "0600"

        - name: List VirtualBox registrations after every cleanup attempt
          ansible.builtin.command:
            argv: ["{{ mgmt_local_ha_contract.controller.virtualbox_windows }}", list, vms]
          register: ha_registered_vms_after_cleanup
          changed_when: false

        - name: Preserve final VirtualBox cleanup postcondition
          ansible.builtin.copy:
            dest: "{{ ha_state }}/cleanup-final-vbox.json"
            content: >-
              {{
                {
                  'rc': ha_registered_vms_after_cleanup.rc,
                  'stdout': ha_registered_vms_after_cleanup.stdout,
                  'stderr': ha_registered_vms_after_cleanup.stderr,
                  'cmd': ha_registered_vms_after_cleanup.cmd
                } | to_nice_json
              }}
            mode: "0600"

        - name: Require successful destruction of every owned HA VM
          ansible.builtin.assert:
            that:
              - ha_destroy_results | length == ha_nodes | length
              - >-
                ha_destroy_results
                | selectattr('finished', 'defined')
                | selectattr('finished', 'equalto', true)
                | list | length == ha_nodes | length
              - >-
                (ha_destroy_results | selectattr('rc', 'equalto', 0) | list | length)
                +
                (ha_destroy_retry_results | selectattr('rc', 'equalto', 0) | list | length)
                == ha_nodes | length
              - >-
                ha_destroy_retry_results | length
                == ha_destroy_results | selectattr('rc', 'ne', 0) | list | length
              - >-
                mgmt_local_ha_contract.nodes.values()
                | map(attribute='vm_name')
                | select('in', ha_registered_vms_after_cleanup.stdout)
                | list | length == 0
            fail_msg: >-
              At least one owned HA VM could not be destroyed; all six cleanup attempts
              were issued in bounded pairs, but qualification remains failed until every
              owned VM cleanup result is complete and successful.

    - name: Hash final authoritative HA result after all campaign postconditions
      ansible.builtin.command:
        argv: [sha256sum, "{{ ha_state }}/result.json"]
      register: ha_final_result_hash
      changed_when: false

    - name: Hash frozen source manifest after successful cleanup
      ansible.builtin.command:
        argv: [sha256sum, "{{ ha_state }}/source.sha256"]
      register: ha_final_source_manifest_hash
      changed_when: false

    - name: Publish completion marker only after source verification and full cleanup
      ansible.builtin.copy:
        dest: "{{ ha_completion }}"
        mode: "0600"
        content: >-
          {{
            {
              'schema_version': 1,
              'status': 'PASS',
              'head_sha': ha_head_sha,
              'evidence_sha256': (ha_final_result_hash.stdout | trim).split()[0],
              'source_manifest_sha256': (ha_final_source_manifest_hash.stdout | trim).split()[0],
              'cleanup_complete': true
            } | to_nice_json
          }}
