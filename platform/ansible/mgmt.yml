---
- name: Configure MGMT Rocky Linux baseline in parallel
  hosts: all
  become: true
  gather_facts: true
  # Hosts are intentionally independent; no task uses run_once in this play.
  strategy: free # noqa: run-once[play]

  tasks:
    - name: Apply Rocky baseline with bounded host concurrency
      ansible.builtin.include_role:
        name: rocky_baseline
        apply:
          throttle: 10

    - name: Reconcile canonical Hetzner private-network aliases before RKE2
      ansible.builtin.include_role:
        name: mgmt_private_network
        apply:
          throttle: 10

- name: Bootstrap first RKE2 control plane
  hosts: cp-01
  become: true
  gather_facts: false
  serial: 1

  tasks:
    - name: Configure bootstrap RKE2 server
      ansible.builtin.include_role:
        name: rke2_server

- name: Join remaining RKE2 control planes sequentially
  hosts:
    - cp-02
    - cp-03
  become: true
  gather_facts: false
  serial: 1

  tasks:
    - name: Join one additional control plane at a time
      ansible.builtin.include_role:
        name: rke2_server

- name: Join RKE2 workers in bounded rolling batches
  hosts: rke2_agents
  become: true
  gather_facts: false
  serial: '25%'

  tasks:
    - name: Join workers without overloading the control plane
      ansible.builtin.include_role:
        name: rke2_agent
        apply:
          throttle: 5
