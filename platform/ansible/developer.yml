---
- name: Reconcile ecommerce-1 developer environment
  hosts: localhost
  connection: local
  gather_facts: true
  pre_tasks:
    - name: Require repository root input
      ansible.builtin.assert:
        that:
          - repo_root is defined
          - repo_root | length > 1
        fail_msg: "Pass -e repo_root=/absolute/path/to/ecommerce-1."
      tags: [always]

    - name: Require supported Linux execution environment
      ansible.builtin.assert:
        that:
          - ansible_facts.system == 'Linux'
          - ansible_facts.distribution == 'Ubuntu'
        fail_msg: "Bootstrap supports Ubuntu Linux, including WSL2, Codex Cloud and Linux CI runners."
      tags: [always]

    - name: Read kernel release for conditional WSL adaptations
      ansible.builtin.command:
        argv: [uname, -r]
      register: developer_kernel
      changed_when: false
      tags: [always]

    - name: Detect WSL2 without making it a global prerequisite
      ansible.builtin.set_fact:
        developer_is_wsl2: "{{ 'microsoft' in developer_kernel.stdout | lower }}"
      tags: [always]

  roles:
    - role: developer_workstation
      tasks_from: prerequisites
    - role: developer_toolchain
    - role: developer_workstation
      tasks_from: hooks
    - role: api_codegen
    - role: product_persistence
