[defaults]
forks = 30
inventory = inventories/mgmt/inventory.rb
roles_path = roles
# Project-owned collections take precedence over system and user installations.
# The directory is ignored because `requirements.yml` is the reproducible source.
collections_path = ../../.ansible/collections
collections_scan_sys_path = False
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml

[ssh_connection]
pipelining = True
