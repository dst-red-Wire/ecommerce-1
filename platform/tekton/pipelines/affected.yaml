apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ecommerce-affected
  annotations:
    ecommerce-1.io/tekton-api-fields: beta
spec:
  params:
    - name: runner-image
      type: string
    - name: repo-url
      type: string
    - name: base
      type: string
    - name: head
      type: string
    - name: evidence-repository
      type: string
    - name: evidence-signing-secret
      type: string
    - name: registry-auth-secret
      type: string
    - name: status-secret
      type: string
  workspaces:
    - name: source
  tasks:
    - name: source-checkout
      taskRef:
        name: ecommerce-source-checkout
      params:
        - name: runner-image
          value: $(params.runner-image)
        - name: repo-url
          value: $(params.repo-url)
        - name: base
          value: $(params.base)
        - name: head
          value: $(params.head)
      workspaces:
        - name: source
          workspace: source

    - name: classify
      runAfter: [source-checkout]
      taskRef:
        name: ecommerce-affected-components
      params:
        - name: runner-image
          value: $(params.runner-image)
        - name: base
          value: $(params.base)
        - name: head
          value: $(params.head)
        - name: record-dir
          value: .context/tekton/$(context.pipelineRun.uid)
        - name: evidence-repository
          value: $(params.evidence-repository)
        - name: evidence-signing-secret
          value: $(params.evidence-signing-secret)
        - name: registry-auth-secret
          value: $(params.registry-auth-secret)
      workspaces:
        - name: source
          workspace: source

    - name: global-gates
      runAfter: [classify]
      taskRef:
        name: ecommerce-global-gates
      params:
        - name: runner-image
          value: $(params.runner-image)
        - name: base
          value: $(params.base)
        - name: head
          value: $(params.head)
        - name: record-dir
          value: .context/tekton/$(context.pipelineRun.uid)
      workspaces:
        - name: source
          workspace: source

    - name: affected-component-gates
      runAfter: [classify]
      taskRef:
        name: ecommerce-component-gate
      matrix:
        params:
          - name: component
            value: $(tasks.classify.results.components[*])
      params:
        - name: runner-image
          value: $(params.runner-image)
        - name: base
          value: $(params.base)
        - name: head
          value: $(params.head)
        - name: record-dir
          value: .context/tekton/$(context.pipelineRun.uid)
      workspaces:
        - name: source
          workspace: source
  finally:
    - name: finalize-evidence
      taskRef:
        name: ecommerce-finalize-evidence
      params:
        - name: runner-image
          value: $(params.runner-image)
        - name: base
          value: $(params.base)
        - name: head
          value: $(params.head)
        - name: record-dir
          value: .context/tekton/$(context.pipelineRun.uid)
        - name: evidence-repository
          value: $(params.evidence-repository)
        - name: evidence-signing-secret
          value: $(params.evidence-signing-secret)
        - name: registry-auth-secret
          value: $(params.registry-auth-secret)
        - name: status-secret
          value: $(params.status-secret)
      workspaces:
        - name: source
          workspace: source
