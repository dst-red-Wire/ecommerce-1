apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ecommerce-affected-components
spec:
  params:
    - name: runner-image
      type: string
    - name: base
      type: string
    - name: head
      type: string
    - name: record-dir
      type: string
  results:
    - name: components
      type: array
      description: Component gates that must execute; "none" is a no-op sentinel.
    - name: global-gates
      type: array
      description: Global gates derived from the canonical execution policy.
  workspaces:
    - name: source
  steps:
    - name: classify
      image: $(params.runner-image)
      workingDir: $(workspaces.source.path)
      env:
        - {name: HOME, value: /tekton/home}
        - {name: ECOMMERCE_EXECUTION_SCOPE, value: ci}
        - {name: ECOMMERCE_FORCE_FULL_QUALIFICATION, value: "1"}
        - {name: CI_EVIDENCE_REPOSITORY, value: ""}
        - {name: GITEA_TOKEN, value: ""}
        - {name: GITHUB_TOKEN, value: ""}
      command: [python3, scripts/repoctl.py]
      args:
        - tekton-plan
        - --base
        - $(params.base)
        - --head
        - $(params.head)
        - --record-dir
        - $(params.record-dir)
        - --result-path
        - $(results.components.path)
        - --global-result-path
        - $(results.global-gates.path)
