apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ecommerce-component-gate
spec:
  params:
    - name: runner-image
      type: string
    - name: component
      type: string
    - name: base
      type: string
    - name: head
      type: string
    - name: record-dir
      type: string
  workspaces:
    - name: source
  steps:
    - name: component-gate
      image: $(params.runner-image)
      workingDir: $(workspaces.source.path)
      command: [python3, scripts/repoctl.py]
      args:
        - ci-component
        - --component
        - $(params.component)
        - --base
        - $(params.base)
        - --head
        - $(params.head)
        - --record-dir
        - $(params.record-dir)
