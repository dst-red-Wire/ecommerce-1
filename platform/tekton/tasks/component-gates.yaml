apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ecommerce-component-gate
spec:
  params:
    - name: runner-image
      type: string
    - name: component
      type: string
    - name: base
      type: string
    - name: head
      type: string
    - name: record-dir
      type: string
  workspaces:
    - name: source
  volumes:
    - name: isolated-checkout
      emptyDir: {}
  steps:
    - name: clone-isolated-checkout
      image: $(params.runner-image)
      workingDir: $(workspaces.source.path)
      command: [git]
      args:
        - clone
        - --quiet
        - --shared
        - --no-checkout
        - $(workspaces.source.path)
        - /var/ecommerce-run/repository
      volumeMounts:
        - name: isolated-checkout
          mountPath: /var/ecommerce-run
    - name: checkout-exact-head
      image: $(params.runner-image)
      workingDir: /var/ecommerce-run/repository
      command: [git]
      args: [checkout, --quiet, --detach, $(params.head)]
      volumeMounts:
        - name: isolated-checkout
          mountPath: /var/ecommerce-run
    - name: component-gate
      image: $(params.runner-image)
      workingDir: /var/ecommerce-run/repository
      env:
        - name: GOCACHE
          value: $(workspaces.source.path)/.context/cache/go-build
        - name: GOMODCACHE
          value: $(workspaces.source.path)/.context/cache/go-mod
      command: [python3, scripts/repoctl.py]
      args:
        - ci-component
        - --component
        - $(params.component)
        - --base
        - $(params.base)
        - --head
        - $(params.head)
        - --record-dir
        - $(workspaces.source.path)/$(params.record-dir)
      volumeMounts:
        - name: isolated-checkout
          mountPath: /var/ecommerce-run
