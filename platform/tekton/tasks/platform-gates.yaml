apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ecommerce-platform-gates
spec:
  params:
    - name: runner-image
      type: string
    - name: area
      type: string
  workspaces:
    - name: source
  steps:
    - name: platform-gates
      image: $(params.runner-image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        case "$(params.area)" in
          terraform) make terraform ;;
          ansible) make ansible ;;
          *) echo "unsupported platform area: $(params.area)" >&2; exit 2 ;;
        esac
