apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ecommerce-platform-gates
spec:
  params:
    - name: runner-image
      type: string
    - name: area
      type: string
  workspaces:
    - name: source
  steps:
    - name: platform-gates
      image: $(params.runner-image)
      workingDir: $(workspaces.source.path)
      command: [python3, scripts/repoctl.py]
      args: [$(params.area)]
