apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ecommerce-finalize-evidence
spec:
  params:
    - name: runner-image
      type: string
    - name: base
      type: string
    - name: head
      type: string
    - name: record-dir
      type: string
  workspaces:
    - name: source
  steps:
    - name: finalize
      image: $(params.runner-image)
      workingDir: $(workspaces.source.path)
      env:
        - {name: HOME, value: /tekton/home}
        - {name: ECOMMERCE_EXECUTION_SCOPE, value: ci}
        - {name: CI_EVIDENCE_REPOSITORY, value: ""}
        - {name: CI_EVIDENCE_COSIGN_KEY, value: ""}
        - {name: COSIGN_PASSWORD, value: ""}
        - {name: GITEA_TOKEN, value: ""}
        - {name: GITHUB_TOKEN, value: ""}
      command: [python3, scripts/repoctl.py]
      args:
        - ci-finalize
        - --base
        - $(params.base)
        - --head
        - $(params.head)
        - --record-dir
        - $(params.record-dir)
