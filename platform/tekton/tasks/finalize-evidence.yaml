apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ecommerce-finalize-evidence
spec:
  params:
    - name: runner-image
      type: string
    - name: base
      type: string
    - name: head
      type: string
    - name: record-dir
      type: string
  workspaces:
    - name: source
  steps:
    - name: finalize
      image: $(params.runner-image)
      workingDir: $(workspaces.source.path)
      command: [python3, scripts/repoctl.py]
      args:
        - ci-finalize
        - --base
        - $(params.base)
        - --head
        - $(params.head)
        - --record-dir
        - $(params.record-dir)
