apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ecommerce-frontend-gates
spec:
  params:
    - name: runner-image
      type: string
    - name: scope
      type: string
  workspaces:
    - name: source
  steps:
    - name: frontend-gates
      image: $(params.runner-image)
      workingDir: $(workspaces.source.path)
      command: [python3, scripts/repoctl.py]
      args: [frontend, check, $(params.scope)]
