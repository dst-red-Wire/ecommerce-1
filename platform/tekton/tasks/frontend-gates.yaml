apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ecommerce-frontend-gates
spec:
  params:
    - name: runner-image
      type: string
    - name: scope
      type: string
  workspaces:
    - name: source
  steps:
    - name: frontend-gates
      image: $(params.runner-image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        ./scripts/ci-frontend.sh check "$(params.scope)"
