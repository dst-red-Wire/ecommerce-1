apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ecommerce-go-service-gates
spec:
  params:
    - name: runner-image
      type: string
    - name: service
      type: string
  workspaces:
    - name: source
  steps:
    - name: service-gates
      image: $(params.runner-image)
      workingDir: $(workspaces.source.path)
      command: [python3, scripts/repoctl.py]
      args: [service, $(params.service)]
