apiVersion: ecommerce.dev/v1alpha1
kind: SecretContract
metadata:
  name: chains-ghcr-write
  namespace: tekton-chains
spec:
  activationStatus: NOT_PROVEN
  kubernetesType: kubernetes.io/dockerconfigjson
  permission: packages:write
  scope: ghcr.io/dst-red-wire/ecommerce-1 provenance-referrers-only
  provisionedBy: external-secret-management-process
  allowedConsumers:
    - system:serviceaccount:tekton-chains:tekton-chains-controller
  forbiddenConsumers:
    - system:serviceaccount:tekton-ci:tekton-test
    - system:serviceaccount:tekton-ci:tekton-source-scan
    - system:serviceaccount:tekton-ci:tekton-evidence
    - system:serviceaccount:tekton-ci:tekton-evidence-verifier
  repositoryValuesForbidden: true
  rotationRequired: true
