title = "E-Commerce repository gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Ignore documentation placeholders and generated test fixtures"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)node_modules/''',
  '''(^|/)vendor/''',
  '''(^|/)test-results/''',
  '''(^|/)tests/fixtures/''',
]
commits = [
  # Historical false positive: Ruby compares the declared key set to a constant list.
  "1c32f8abad270261778475427b1bc41086dd29a7",
]
