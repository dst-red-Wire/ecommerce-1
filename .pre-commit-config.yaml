minimum_pre_commit_version: '4.6.2'
repos:
  - repo: local
    hooks:
      - id: affected-precommit
        name: ecommerce-1 affected pre-commit
        entry: python3 scripts/repoctl.py precommit
        language: system
        pass_filenames: false
      - id: affected-prepush
        name: ecommerce-1 exact-SHA affected pre-push
        entry: python3 scripts/repoctl.py prepush
        language: system
        pass_filenames: false
        stages: [pre-push]
