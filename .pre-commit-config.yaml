minimum_pre_commit_version: '4.6.2'
repos:
  - repo: local
    hooks:
      - id: governance
        name: ecommerce-1 governance
        entry: make governance
        language: system
        pass_filenames: false
      - id: lint
        name: ecommerce-1 lint
        entry: make lint
        language: system
        pass_filenames: false
      - id: secrets
        name: ecommerce-1 secret scan
        entry: make security
        language: system
        pass_filenames: false
      - id: ansible
        name: ecommerce-1 ansible
        entry: make ansible
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: terraform
        name: ecommerce-1 terraform
        entry: make terraform
        language: system
        pass_filenames: false
        stages: [pre-push]
