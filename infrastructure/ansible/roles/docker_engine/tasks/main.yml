---
- name: Vérifier que le noyau expose cgroup v2
  ansible.builtin.command:
    cmd: stat -fc %T /sys/fs/cgroup
  register: cgroup_filesystem
  changed_when: false

- name: Refuser un hôte sans cgroup v2
  ansible.builtin.assert:
    that:
      - cgroup_filesystem.stdout | trim == 'cgroup2fs'
    fail_msg: >-
      Docker natif staging exige cgroup v2 ; filesystem détecté :
      {{ cgroup_filesystem.stdout | trim }}.

- name: Installer les prérequis du dépôt Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - jq
      - git
      - make
      - python3
      - tar
      - unzip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Créer le répertoire des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Installer la clé officielle Docker APT
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Configurer le dépôt officiel Docker APT
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ tool_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Installer Docker Engine natif et ses plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Configurer des logs Docker bornés
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "live-restore": true,
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size }}",
          "max-file": "{{ docker_log_max_file }}"
        }
      }
  notify: Redémarrer Docker Engine

- name: Activer et démarrer Docker Engine
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
    daemon_reload: true

- name: Vérifier Docker Engine et cgroup v2
  ansible.builtin.command:
    cmd: docker info --format '{{ "{{.CgroupVersion}}" }}'
  register: docker_cgroup_version
  changed_when: false

- name: Refuser une configuration Docker non conforme
  ansible.builtin.assert:
    that:
      - docker_cgroup_version.stdout | trim == '2'
    fail_msg: >-
      Docker ne fonctionne pas en cgroup v2 ; valeur détectée :
      {{ docker_cgroup_version.stdout | trim }}.
