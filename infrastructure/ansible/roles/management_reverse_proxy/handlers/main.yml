---
- name: Pull the immutable Caddy image
  ansible.builtin.command:
    cmd: docker compose --file compose.yml pull --quiet
    chdir: "{{ management_install_root }}/caddy"
  changed_when: true
  listen: Reconcile Caddy

- name: Start the Caddy Compose project
  ansible.builtin.command:
    cmd: docker compose --file compose.yml up --detach --remove-orphans --wait --wait-timeout 180
    chdir: "{{ management_install_root }}/caddy"
  changed_when: true
  listen: Reconcile Caddy
