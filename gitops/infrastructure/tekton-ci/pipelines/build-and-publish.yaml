apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-and-publish
  namespace: tekton-ci
spec:
  description: Test once, build once, scan, bind evidence, then expose the final artifact.
  params:
    - name: repository-url
      type: string
      default: https://github.com/dst-red-Wire/ecommerce-1.git
    - name: source-revision
      type: string
    - name: service-context
      type: string
    - name: dockerfile
      type: string
      default: Dockerfile
    - name: image-repository
      type: string
    - name: image-tag
      type: string
  workspaces:
    - name: source
    - name: source-snapshot
    - name: evidence
  results:
    - name: SOURCE_COMMIT
      value: $(tasks.clone.results.COMMIT_SHA)
    - name: SOURCE_SNAPSHOT_SHA256
      value: $(tasks.clone.results.SNAPSHOT_SHA256)
    - name: IMAGE_URL
      value: $(tasks.create-evidence.results.APPROVED_IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.create-evidence.results.APPROVED_IMAGE_DIGEST)
    - name: IMAGE_REFERENCE
      value: $(tasks.create-evidence.results.IMAGE_REFERENCE)
    - name: SCAN_REPORT_PATH
      value: $(tasks.scan-image.results.SCAN_REPORT_PATH)
    - name: SBOM_PATH
      value: $(tasks.generate-sbom.results.SBOM_PATH)
    - name: DELIVERY_EVIDENCE_PATH
      value: $(tasks.create-evidence.results.DELIVERY_EVIDENCE_PATH)
    - name: DELIVERY_EVIDENCE_SHA256
      value: $(tasks.create-evidence.results.DELIVERY_EVIDENCE_SHA256)
    - name: APPROVAL_STATE
      value: $(tasks.create-evidence.results.APPROVAL_STATE)
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: repository-url
          value: $(params.repository-url)
        - name: revision
          value: $(params.source-revision)
      workspaces:
        - name: source
          workspace: source
        - name: source-snapshot
          workspace: source-snapshot
    - name: test
      runAfter: [clone]
      taskRef:
        name: go-test
      params:
        - name: context
          value: $(params.service-context)
      workspaces:
        - name: source
          workspace: source
    - name: source-security
      runAfter: [clone]
      taskRef:
        name: source-security
      workspaces:
        - name: source
          workspace: source
        - name: evidence
          workspace: evidence
    - name: build
      runAfter: [test, source-security]
      taskRef:
        name: build-push
      params:
        - name: context
          value: $(params.service-context)
        - name: dockerfile
          value: $(params.dockerfile)
        - name: image-repository
          value: $(params.image-repository)
        - name: image-tag
          value: $(params.image-tag)
        - name: expected-snapshot-sha256
          value: $(tasks.clone.results.SNAPSHOT_SHA256)
      workspaces:
        - name: source-snapshot
          workspace: source-snapshot
    - name: scan-image
      runAfter: [build]
      taskRef:
        name: scan-image
      params:
        - name: image-reference
          value: $(tasks.build.results.BUILT_IMAGE_REFERENCE)
      workspaces:
        - name: evidence
          workspace: evidence
    - name: generate-sbom
      runAfter: [build]
      taskRef:
        name: generate-sbom
      params:
        - name: image-reference
          value: $(tasks.build.results.BUILT_IMAGE_REFERENCE)
      workspaces:
        - name: evidence
          workspace: evidence
    - name: create-evidence
      runAfter: [scan-image, generate-sbom]
      taskRef:
        name: create-delivery-evidence
      params:
        - name: repository-url
          value: $(params.repository-url)
        - name: source-commit
          value: $(tasks.clone.results.COMMIT_SHA)
        - name: source-snapshot-sha256
          value: $(tasks.clone.results.SNAPSHOT_SHA256)
        - name: pipeline-run-uid
          value: $(context.pipelineRun.uid)
        - name: service-context
          value: $(params.service-context)
        - name: image-url
          value: $(tasks.build.results.BUILT_IMAGE_URL)
        - name: image-repository
          value: $(params.image-repository)
        - name: image-digest
          value: $(tasks.build.results.BUILT_IMAGE_DIGEST)
        - name: gitleaks-report-path
          value: $(tasks.source-security.results.GITLEAKS_REPORT_PATH)
        - name: source-scan-report-path
          value: $(tasks.source-security.results.SOURCE_SCAN_REPORT_PATH)
        - name: image-scan-report-path
          value: $(tasks.scan-image.results.SCAN_REPORT_PATH)
        - name: sbom-path
          value: $(tasks.generate-sbom.results.SBOM_PATH)
      workspaces:
        - name: evidence
          workspace: evidence
