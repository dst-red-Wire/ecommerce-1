# No public egress policy intentionally selects test, create-evidence, or
# verify-proof. Tests use vendored Go modules with GOPROXY=off; evidence binding
# and offline Cosign verification need only their mounted files.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: document-offline-roles
  namespace: tekton-ci
  annotations:
    ecommerce.dev/offline-pipeline-tasks: test,create-evidence,verify-proof
spec:
  podSelector:
    matchExpressions:
      - key: tekton.dev/pipelineTask
        operator: In
        values: [test, create-evidence, verify-proof]
  policyTypes: [Egress]
