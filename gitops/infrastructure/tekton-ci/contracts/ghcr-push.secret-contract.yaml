apiVersion: ecommerce.dev/v1alpha1
kind: SecretContract
metadata:
  name: ghcr-push
  namespace: tekton-ci
spec:
  activationStatus: NOT_PROVEN
  kubernetesType: kubernetes.io/dockerconfigjson
  registry: https://ghcr.io
  permission: packages:write
  allowedConsumers: [tekton-image-push]
  forbiddenConsumers:
    - tekton-source-read
    - tekton-test
    - tekton-source-scan
    - tekton-image-read
    - tekton-evidence
    - tekton-evidence-verifier
    - tekton-git-promotion
  rotationRequired: true
  repositoryValuesForbidden: true
