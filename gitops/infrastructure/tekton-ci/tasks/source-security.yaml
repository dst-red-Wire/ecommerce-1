apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: source-security
  namespace: tekton-ci
spec:
  description: Reuse repository Gitleaks policy and scan source/IaC with Trivy.
  params:
    - name: source-subdirectory
      type: string
      default: source
  workspaces:
    - name: source
      readOnly: true
    - name: evidence
  results:
    - name: GITLEAKS_REPORT_PATH
    - name: SOURCE_SCAN_REPORT_PATH
  steps:
    - name: gitleaks
      # zricethezav/gitleaks:v8.30.1
      image: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      workingDir: $(workspaces.source.path)/$(params.source-subdirectory)
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/bin/sh
        set -eu
        report="$(workspaces.evidence.path)/gitleaks-source.json"
        gitleaks dir --config .gitleaks.toml --redact --no-banner \
          --report-format json --report-path "$report" .
        test -s "$report"
        printf '%s' "$report" >"$(results.GITLEAKS_REPORT_PATH.path)"
    - name: trivy-source
      # aquasec/trivy:0.74.0
      image: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      workingDir: $(workspaces.source.path)/$(params.source-subdirectory)
      env:
        - name: TRIVY_CACHE_DIR
          value: /tmp/trivy
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      script: |
        #!/bin/sh
        set -eu
        report="$(workspaces.evidence.path)/trivy-source.json"
        trivy filesystem --exit-code 1 --severity HIGH,CRITICAL \
          --scanners vuln,misconfig,secret --format json --output "$report" \
          --no-progress .
        test -s "$report"
        printf '%s' "$report" >"$(results.SOURCE_SCAN_REPORT_PATH.path)"
