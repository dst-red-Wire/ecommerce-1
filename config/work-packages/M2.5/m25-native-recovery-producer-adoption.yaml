execution:
  preflight_required: true
  runtime_required: false
  recovery_required: false
  required_capabilities:
  - toolchain-pinned
  capability_parameters:
    toolchain-pinned:
      sha256: sha256:107f73c10a1ff7f2cadcf628852362e28e09c7c4e18c3f1b3ec2dd7123d8008e
review:
  code: required
  security: required
completion:
  post_merge_verification: true
exit_criteria:
- One closed canonical dispatch recognizes existing LAB and native host recovery producers, with stable
  functional identities.
- Known fixtures validate; unknown producers, wrong scope, mismatched digests or provenance, duplicate
  declarations and missing observations fail closed.
- Repeated validation is deterministic and cannot convert fixture verdicts into runtime evidence.
- Historical consumers require the original signed bundle identity and protected observations.
- The canonical exact-base risk classification and every resulting qualification, review, owner and merge
  gate pass before adoption.
- No native runner, host setting, VM lifecycle or paid resource is changed by this adoption.
