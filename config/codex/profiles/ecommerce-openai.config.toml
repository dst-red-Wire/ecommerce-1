# User profile installed by Ansible. Select only for OpenAI/Codex/API documentation work.
project_doc_max_bytes = 4096
tool_output_token_limit = 4096

[skills]
max_context_tokens = 1200

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
enabled_tools = ["search_openai_docs", "fetch_openai_doc"]
startup_timeout_sec = 3
tool_timeout_sec = 20

[mcp_servers.openaiDeveloperDocs.tools.search_openai_docs]
output_token_limit = 2048

[mcp_servers.openaiDeveloperDocs.tools.fetch_openai_doc]
output_token_limit = 2048
