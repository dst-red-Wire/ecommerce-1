version: 5
status: exact
graph_policy:
  root_wave: 00-underlay
  unique_wave_ids_required: true
  requires_must_resolve: true
  cycles_forbidden: true
  unreachable_waves_forbidden: true
execution_policy:
  activation_requires_resolved_binding: true
  placeholders_forbidden: true
  unbound_components_forbidden: true
  unknown_bindings_forbidden: true
  automatic_destroy: forbidden

execution_profiles:
  infrastructure:
    timeout: 30m
    retry:
      max_attempts: 3
      backoff: 60s
    health_checks: [controller-ready, declared-gates-pass]
    evidence:
      exact_sha: required
      environment: required
      component: required
      wave: required
      observed_revision: required
      gate_results: required
    failure:
      behavior: fail-closed-block-dependent-waves
      hook: reconcile-last-approved-state
      automatic_destroy: forbidden
  operator:
    timeout: 15m
    retry:
      max_attempts: 3
      backoff: 30s
    health_checks: [deployment-ready, crds-established, declared-gates-pass]
    evidence:
      exact_sha: required
      environment: required
      component: required
      wave: required
      observed_revision: required
      gate_results: required
    failure:
      behavior: fail-closed-block-dependent-waves
      hook: reconcile-last-approved-state
      automatic_destroy: forbidden
  stateful:
    timeout: 30m
    retry:
      max_attempts: 2
      backoff: 60s
    health_checks: [workload-ready, storage-bound, quorum-healthy, declared-gates-pass]
    evidence:
      exact_sha: required
      environment: required
      component: required
      wave: required
      observed_revision: required
      gate_results: required
    failure:
      behavior: fail-closed-preserve-data
      hook: preserve-data-and-reconcile
      automatic_destroy: forbidden
  stateless:
    timeout: 10m
    retry:
      max_attempts: 3
      backoff: 30s
    health_checks: [workload-ready, declared-gates-pass]
    evidence:
      exact_sha: required
      environment: required
      component: required
      wave: required
      observed_revision: required
      gate_results: required
    failure:
      behavior: fail-closed-block-dependent-waves
      hook: reconcile-last-approved-state
      automatic_destroy: forbidden
  qualification:
    timeout: 60m
    retry:
      max_attempts: 1
      backoff: 30s
    health_checks: [declared-gate-pass]
    evidence:
      exact_sha: required
      environment: required
      component: required
      wave: required
      observed_revision: required
      gate_results: required
    failure:
      behavior: fail-closed
      hook: none
      automatic_destroy: forbidden
  backup:
    timeout: 60m
    retry: {max_attempts: 1, backoff: 60s}
    health_checks: [job-ready, archive-created, integrity-verified, restore-evidence-gate-pass]
    evidence: {exact_sha: required, environment: required, component: required, wave: required, observed_revision: required, gate_results: required}
    failure: {behavior: fail-closed-block-destroy, hook: preserve-data-and-evidence, automatic_destroy: forbidden}
  inference:
    timeout: 30m
    retry: {max_attempts: 1, backoff: 30s}
    health_checks: [crds-established, controller-ready, immutable-model-digest, shadow-canary-gates-pass, manual-promotion-approval]
    evidence: {exact_sha: required, environment: required, component: required, wave: required, observed_revision: required, gate_results: required}
    failure: {behavior: fail-closed-no-automatic-model-promotion, hook: reconcile-last-approved-state, automatic_destroy: forbidden}

