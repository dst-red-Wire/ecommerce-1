version: 4
status: exact
graph_policy:
  root_wave: 00-underlay
  unique_wave_ids_required: true
  requires_must_resolve: true
  cycles_forbidden: true
  unreachable_waves_forbidden: true
execution_policy:
  default:
    health_condition: all-components-ready-and-declared-gates-pass
    timeout: required-runtime-binding-before-activation
    retry_semantics: bounded-controller-retry-required
    failure_behavior: fail-closed-block-dependent-waves
    evidence_output: exact-sha-environment-reference-required
    rollback_destroy_hook: required-before-activation

waves:
  - id: 00-underlay
    requires: []
    components: [network, dns-prerequisites, time-sync, image-mirrors]
  - id: 10-rke2
    requires: [00-underlay]
    components: [rke2-control-plane, rke2-workers]
  - id: 20-network-security
    requires: [10-rke2]
    components: [cilium, hubble, pod-security, kyverno, tetragon]
  - id: 30-gitops-identity
    requires: [20-network-security]
    components: [rancher-fleet, spire, istio]
  - id: 40-secrets-registry-ci
    requires: [30-gitops-identity]
    components: [openbao, external-secrets, harbor, tekton]
  - id: 45-object-storage
    requires: [40-secrets-registry-ci, 20-network-security]
    components: [seaweedfs]
  - id: 48-observability-operators
    requires: [45-object-storage]
    components: [mongodb-community-operator, opensearch-operator]
  - id: 50-observability-stateful
    requires: [48-observability-operators]
    components: [victoriametrics, victorialogs, clickhouse, mongodb-oss-self-hosted, opensearch-security]
  - id: 55-observability-services
    requires: [50-observability-stateful]
    components: [rotel, opentelemetry-collector, vmagent, vmalert, alertmanager, grafana, hyperdx, data-prepper-security, wazuh]
  - id: 58-stateful-operators
    requires: [45-object-storage, 40-secrets-registry-ci, 20-network-security]
    components: [cloudnativepg]
  - id: 60-stateful
    requires: [58-stateful-operators, 45-object-storage, 40-secrets-registry-ci, 20-network-security]
    parallel_groups:
      - [lakefs-metadata-cnpg, mlflow-metadata-cnpg, strimzi-kafka, rabbitmq, redis]
      - [opensearch-business, apicurio]
    serial_after_parallel: [lakefs, mlflow]
  - id: 70-iam-edge
    requires: [60-stateful, 30-gitops-identity]
    components: [keycloak, haproxy, caddy, coraza, kong, ats, istio-gateway, squid-egress]
  - id: 80-golden-service
    requires: [55-observability-services, 60-stateful, 70-iam-edge]
    components: [product]
  - id: 90-commerce
    requires: [80-golden-service]
    parallel_groups:
      - [inventory, pricing, tax, order, payment, shipping, fraud-risk, search, user-profile, notification]
    serial_after_parallel: [catalog, cart, tracking, review, fulfillment, returns, billing, checkout]
  - id: 100-frontends
    requires: [90-commerce]
    components: [storefront, admin]
  - id: 110-qualification
    requires: [100-frontends]
    components: [smoke, security, contracts, integration, bdd, e2e, performance, chaos-dr]
rules:
  wait_only_on_declared_dependencies: true
  fail_fast_on_blocking_gate: true
  no_perf_before_prior_gates: true
  no_chaos_dr_before_prior_gates: true
  no_prod_promotion_from_test_state: true
