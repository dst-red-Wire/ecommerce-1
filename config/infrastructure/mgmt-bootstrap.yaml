version: 1
status: offline-path-implemented-real-six-node-validation-pending
milestone: M2-5-persistent-mgmt-bootstrap
authority: architecture.lock.yaml
scope:
  implementation: static-only
  runtime_activation: deferred-to-consolidated-cloud-qualification
  paid_resources_created: 0

wireguard_authority:
  phase_selector: required-runtime-input
  bootstrap:
    mode: bootstrap-local
    authority: wg-01-local-host
    human_gate: required
    gateway_key:
      generation: local-on-wg01
      permissions: root-0600
    peer_public_keys: runtime-staged-non-secret
    permanent_use: forbidden
  steady_state:
    mode: runtime-openbao-read
    authority: openbao
    authentication: runtime-injected-nonpersisted
    raw-controller-secret_environment: forbidden
  transition:
    required: true
    key_rotation: mandatory-replacement-not-copy
    bootstrap_key_cleanup: mandatory
    bootstrap_peer_staging_cleanup: mandatory
    bootstrap_public_ssh_cleanup: mandatory
    execution_owner: M4-platform-baseline
    executed_in_m2_5: false

rke2:
  version: v1.37.0+rke2r1
  os: rocky-linux-9
  cni: cilium
  token_source: runtime-secret-input
  bootstrap_server: cp-01
  server_endpoint_source: config/infrastructure/mgmt-inventory.yaml#control_planes.cp-01.k8s_ip

state:
  bootstrap:
    backend: local
    location: operator-controlled-encrypted-workstation
    repository_storage: forbidden
    purpose: first-provider-provisioning-only
    human_apply_gate: required
  persistent:
    backend: s3-compatible
    target: seaweedfs-s3
    availability_dependency: post-bootstrap
    credentials: runtime-only
    locking: required
    migration: human-reviewed-after-backend-is-reachable
  dependency_direction: bootstrap-state-creates-mgmt-then-migrate-to-persistent
  circular_dependency: forbidden

platform_bootstrap:
  activation_owner: M4-platform-baseline
  order: [rke2, cilium, tetragon, openbao-bootstrap, external-secrets, gitea, harbor, rancher, rancher-fleet, tekton]
  services:
    gitea:
      version: 1.24.6
      namespace: gitea
      placement: mgmt-workers
      persistence: required
      exposure: Z5-wireguard-only
      admin_secret_ref: openbao-runtime-reference
      probes: [readiness, liveness]
      backup_restore_owner: platform-backup-policy
    harbor:
      version: 2.13.2
      namespace: harbor
      placement: mgmt-workers
      persistence: required
      exposure: Z5-wireguard-only
      tls_secret_ref: openbao-eso-runtime-reference
      credentials: runtime-only
      project_bootstrap_owner: M4-tekton-bootstrap
      immutable_images: required
      integration_boundary: tekton-buildkit-push-by-digest
    tekton:
      version: 1.4.0
      namespace: tekton-pipelines
      purpose: M4-ci-capability-activation
      pipeline_activation: deferred
    rancher:
      version: 2.12.2
      namespace: cattle-system
      exposure: Z5-wireguard-only
    rancher-fleet:
      version: 0.13.0
      namespace: cattle-fleet-system
      gitops_authority: true
      reconciliation: deferred
    openbao-bootstrap:
      version: 2.4.4
      namespace: openbao
      initialized_state: forbidden
      unseal_keys: runtime-only
      root_token: runtime-only
      initialization_boundary: human-authorized-M4-ceremony
      secret_handoff: openbao-to-eso-after-initialization
    external-secrets:
      version: 1.1.1
      namespace: external-secrets
      dependency: openbao-initialized-and-scoped-auth-created
    tetragon:
      version: 1.5.0
      namespace: kube-system
      mode: static-foundation-only
      enforcement_proven: false

cost_inventory:
  persistent_servers: 7
  control_planes: 3
  workers: 3
  access_gateways: 1
  networks: 1
  subnets: 6
  firewalls: 2
  volumes: 0
  load_balancers: 0
  floating_ips: 0
  public_ipv4: 1
  public_ipv6: 1
  billable_classes: [servers, public-ip-addresses]

# Bootstrap transport exists before Kubernetes. No dependency on cluster Harbor,
# Istio Egress Gateway, Internet NAT through wg-01 or public package repositories.
offline_installation:
  owner: M2-5-persistent-mgmt-bootstrap
  source: independently-approved-controller-local-bundle
  delivery: ansible-copy-over-existing-governed-ssh
  source_available_before_kubernetes: required
  manifest_authorization: independently-supplied-sha256
  target: rocky-9-amd64
  inventory:
    os_packages: full-rpm-dependency-closure-with-nevra-sha256-and-signature-checks
    required_packages_source: scripts/mgmt_airgap.py#REQUIRED_RPMS
    runtime: rke2-embedded-containerd
    binary: canonical-rke2-version-and-sha256
    images: canonical-rke2-core-and-cilium-image-archives
    image_identities: required-in-validated-archive-manifests
    rpm_signing_keys: manifest-bound-offline-input
  network:
    artifact_downloads_from_nodes: forbidden
    dns: explicit-internal-ipv4-runtime-input
    ntp: explicit-internal-ipv4-runtime-input
    private_cluster_routes: canonical-network-plan-only
    default_route: isolated-dummy-no-internet-forwarding
    internet_ipv4_ipv6: default-deny-output-and-forward
    wireguard_internet_nat: forbidden
  installation:
    package_repositories: all-disabled
    missing_artifact: fail-before-installation
    integrity_failure: fail-before-installation
    registry_default_endpoint_fallback: disabled
    selinux: enabled-with-offline-policy-rpms
  evidence:
    local_container: installation-subset-and-egress-isolation-only
    six_node_rocky_rke2: pending-real-target-and-service-inputs
    provisioning_authorization: separate-human-gate-required
