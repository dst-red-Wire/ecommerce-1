version: 1
status: exact
site: mgmt
provider: hetzner-cloud
lifecycle:
  mode: persistent
vm_profiles:
  wireguard-gateway:
    vcpu: 2
    ram_gib: 2
    os_disk_gib: 40
access_gateways:
  wg-01:
    profile: wireguard-gateway
    role: wireguard-operator-access
    trust_zone: Z5
    mgmt_vlan: 401
    mgmt_ip: 10.243.1.41
    kubernetes_member: false
    public_endpoint: provider-runtime-output
    bootstrap_ssh:
      enabled_default: false
      node_scope: wg-01-only
      source_cidrs: explicit-runtime-input
      unrestricted_cidrs: forbidden
      human_gate: required
      teardown: mandatory-after-wireguard-proof
    steady_public_ssh: forbidden
implementation:
  terraform_wiring: platform/terraform/modules/hcloud-mgmt
  ansible_wiring: platform/ansible/roles/wireguard_gateway
  human_apply_gate: true
