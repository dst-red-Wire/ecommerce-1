version: 1
status: exact
authority: resilience-governance
purpose: measurable recovery objectives for stateful platform data whose storage contract delegates backup objectives

profiles:
  mlops-metadata-cnpg:
    components: [lakefs-metadata-cnpg, mlflow-metadata-cnpg]
    backup_method: barman-pitr-compatible
    backup_object_authority: seaweedfs-s3
    backup_execution_authority: rancher-fleet-kubernetes-cronjob
    schedule: {preprod: 12h, prod: 6h}
    retention: {preprod: 7d, prod: 30d}
    rpo: {preprod: 12h, prod: 6h}
    rto: {preprod: 4h, prod: 2h}
    restore_validation: required
    backup_failure_domain: independent-from-source-site
    local_objective_override: forbidden

validation:
  duration_format: positive-integer-hours-or-days
  null_objectives_forbidden: true
  restore_validation_required: true
  undeclared_profile_forbidden: true
