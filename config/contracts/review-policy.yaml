version: 1
status: exact

pull_request_review:
  forge: github
  ci: tekton

  owner_authorization:
    authority_source: architecture.lock.yaml#repository_governance.owner_authorization
    local_override: forbidden

  deterministic_gate:
    authority: true
    required_for_merge: true
    binds_exact_commit_sha: true
    fail_closed: true

  ai_reviewer:
    enabled: true
    provider: ChatGPT
    sole_code_security_authority: true
    exact_sha_binding: required
    prior_sha_review: historical-only
    merge_readiness:
      code_review_complete: required
      security_review_complete: required
      unresolved_blocking_findings: forbidden
    codex:
      review_authority: forbidden
      trigger: forbidden
      polling: forbidden
      merge_readiness_dependency: forbidden
    evidence:
      transport: github-pr-comment
      marker: chatgpt-exact-sha-review:v1
      required_kinds: [code, security]
      required_status: PASS
      exact_sha_required: true
      comment_author: repository-owner
    advisory_only: true
    may_comment: true
    may_request_changes: true
    may_approve: false
    may_merge: false
    may_sign: false
    may_promote: false
    may_push: false

  human_gate:
    required_for:
      - architecture_changes
      - infrastructure_apply
      - destructive_changes
      - state_migrations
      - dns_network_iam_secret_changes

repository_delivery:
  forge: github
  default_branch: main

  publish:
    qualification: exact-sha
    exact_evidence_required: true
    force_push: forbidden
    direct_default_branch_write: forbidden
    push_target: current-feature-branch

  pull_request:
    required: true
    head_sha_binding: exact
    draft_merge: forbidden
    record_after_merge: retained-by-forge

  merge:
    method: merge
    match_head_commit: required
    branch_protection: required
    required_checks: when-configured
    bypass_branch_protection: forbidden

  cleanup:
    merged_pr_state: merged-closed
    remote_branch: delete
    local_branch: delete
    automatic_branch_cleanup:
      enabled: true
      triggers: [git-sync, finish-pr]
      default_branch_ref: origin/<default-branch>
      delete_when:
        - head-is-ancestor-of-default-branch
        - merged-pr-head-matches-current-branch-head
      merged_pr_base_must_match_default: true
      github_merge_proof: exact-head-sha
      preserve:
        - default-branch
        - master
        - current-branch
        - active-worktree
        - branch-with-unabsorbed-head
        - branch-advanced-after-merged-pr
      github_cli_optional_for_ancestor_cleanup: true
      force_local_delete_after_exact_merged_pr_proof: true
