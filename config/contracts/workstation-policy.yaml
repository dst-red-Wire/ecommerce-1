version: 1
status: exact
architecture_authority: architecture.lock.yaml
scope: developer-workstation

git:
  projection: config/workstation/git-local.conf
  settings:
    core.autocrlf: input
    core.eol: lf
    fetch.prune: "true"
    fetch.pruneTags: "true"
    pull.ff: only
    push.default: simple
    rerere.enabled: "true"
    rebase.autoStash: "false"

wsl2:
  projection: config/workstation/wslconfig.template
  settings:
    networkingMode: nat
    firewall: "true"
    dnsTunneling: "true"
    autoProxy: "true"

container_runtime:
  provider: docker-engine-rootless
  scope: ubuntu-wsl2-developer-tests
  version_authority: config/contracts/toolchain-lock.json
  provisioning_owner: platform/ansible/roles/developer_workstation
  api_socket: /run/user/%UID%/docker.sock
  image_pins:
    kind_node: KIND_NODE_IMAGE
    testcontainers_postgresql: TESTCONTAINERS_POSTGRES_IMAGE
    testcontainers_ryuk: TESTCONTAINERS_RYUK_IMAGE
  lifecycle:
    startup: on-demand
    enabled_at_login: false
    stop_after_qualification: required
    ha_campaign_state: stopped
  security:
    rootful_daemon: disabled
    tcp_socket: forbidden
    ryuk_cleanup: required
  qualification:
    - docker-info-rootless
    - testcontainers-postgresql
    - ryuk-zero-container-cleanup
    - kind-single-node-smoke
    - memory-before-during-after

winget:
  projection: .config/configuration.winget
  processor: dscv3
  package_policy: latest-platform-provided
  packages:
    Git:
      id: Git.Git
      source: winget
    PowerShell:
      id: Microsoft.PowerShell
      source: winget
    WindowsTerminal:
      id: Microsoft.WindowsTerminal
      source: winget
    VSCode:
      id: Microsoft.VisualStudioCode
      source: winget
    GitHubCLI:
      id: GitHub.cli
      source: winget

rules:
  workstation_files_are_projections: true
  workstation_packages_are_not_static_qualification_authority: true
  local_override_of_repository_git_defaults: user-owned
