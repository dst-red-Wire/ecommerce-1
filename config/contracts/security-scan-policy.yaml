version: 1
status: exact
architecture_authority: architecture.lock.yaml
scope: entire-repository

scanner:
  name: gitleaks
  version_authority: architecture.lock.yaml#machine_contracts.toolchain_lock
  version_key: GITLEAKS_VERSION
  checksum_key: GITLEAKS_SHA256_LINUX_AMD64
  local_config: forbidden
  generated_config: required

capabilities:
  container_and_filesystem:
    implementation: trivy
    status: active
    execution: affected-container-and-configuration-inputs
  secret_detection:
    implementation: gitleaks
    status: active
    execution: exact-materialized-git-tree
  go_static_analysis:
    implementation: gosec
    status: active
    execution: affected-go-modules
  go_vulnerabilities:
    implementation: govulncheck
    status: active
    execution: affected-go-modules
  kubernetes_cis:
    implementation: kube-bench
    status: deferred
    execution: qualified-rke2-cluster-only
    reason: no current qualified RKE2 campaign executes kube-bench
    policy_authority: architecture.lock.yaml#security

configuration:
  use_default_rules: true
  allowlist:
    description: Ignore repository metadata, dependencies, generated test outputs and explicit fixtures
    paths:
      - '(^|/)\.git/'
      - '(^|/)node_modules/'
      - '(^|/)vendor/'
      - '(^|/)test-results/'
      - '(^|/)tests/fixtures/'

execution:
  worktree:
    mode: materialized-git-tree
    exact_tree_required: true
  exact_commit:
    mode: git-history
  fallback:
    mode: directory
  cache: forbidden
  redact: true
  no_banner: true

rules:
  secret_scan_failure: blocking
  config_generation_failure: blocking
  local_policy_override: forbidden
