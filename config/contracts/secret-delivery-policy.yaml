version: 1
status: active
architecture_authority: architecture.lock.yaml

authorities:
  secret_source: openbao
  kubernetes_sync: external-secrets-operator
  kubernetes_materialization: secret
  workload_identity: spire

rules:
  git-stored-secrets: forbidden
  kubernetes-secret-is-authority: false
  prefer-workload-identity-over-static-secret: true
  static-secret-allowed-only-when-protocol-requires-it: true
  secret-rotation-must-be-automatic-when-provider-supports-it: true
  secret-consumer-must-reference-owner-and-purpose: true
  cross-namespace-secret-sharing: forbidden-unless-explicitly-declared
  application-must-not-read-openbao-directly-when-eso-contract-exists: true

provider_credentials:
  stripe: {consumer: payment, authority: openbao, delivery: eso}
  carrier-adapters: {consumer: shipping, authority: openbao, delivery: eso}
  qonto-pa: {consumer: billing, authority: openbao, delivery: eso}
  keycloak-reference: {consumer: user-profile, authority: openbao, delivery: eso}
