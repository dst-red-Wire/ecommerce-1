version: 1
kind: CanonicalContractSchema
status: exact
architecture_authority: architecture.lock.yaml
scope: entire-repository
authority_claims:
  - governance.contract-shape
required_envelope:
  - version
  - kind
  - status
  - architecture_authority
  - scope
  - authority_claims
canonical_statuses:
  - exact
  - enforced
  - declared
rules:
  root_registration: required
  duplicate_authority_claim: forbidden
  unregistered_machine_contract: forbidden
  parallel_policy_authority: forbidden
  derived_projection_may_not_be_authority: true
  generic_validation: required
