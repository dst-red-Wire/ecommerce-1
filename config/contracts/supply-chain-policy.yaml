version: 1
kind: SupplyChainPolicy
status: declared
architecture_authority: architecture.lock.yaml
scope: build-and-delivery
authority_claims:
  - repository.supply-chain.enforcement
architecture_refs:
  components: architecture.lock.yaml#supply_chain
  registry: architecture.lock.yaml#platform.registry
  promotion: architecture.lock.yaml#developer_platform.promotion
rules:
  vulnerability_scan_before_certification: required
  sbom_before_certification: required
  signature_before_production: required
  provenance_binding: exact-source-sha
milestone_enforcement:
  M1-monorepo-bootstrap: contract-only
  M7-qualification: enforce-scan-and-sbom
  M8-preprod-certification: enforce-signature-and-provenance
