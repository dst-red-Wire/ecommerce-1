version: 1
kind: CachePolicy
status: enforced
architecture_authority: architecture.lock.yaml
scope: qualification-and-bootstrap
authority_claims:
  - repository.cache.identity
  - repository.cache.invalidation
  - repository.cache.qualification-reuse

principles:
  cache_is_acceleration_not_authority: true
  cache_miss_must_preserve_correctness: true
  successful_results_only: true
  deterministic_inputs_only: true
  dynamic_state_cache_authority: forbidden
  floating_tool_identity: forbidden

pinning:
  digest_algorithm: sha256
  toolchain_authority: architecture.lock.yaml#machine_contracts.toolchain_lock
  floating_versions: forbidden
  executable_sha256_in_cache_key: required
  remote_managed_artifact_checksum: sha256
  immutable_oci_reference: digest-only

eligibility:
  cacheable:
    - deterministic-static-parsing
    - deterministic-static-global-gates
    - deterministic-static-component-gates
    - deterministic-code-generation-inputs
  forbidden:
    - git-status
    - current-head-sha
    - remote-ci-state
    - review-state
    - owner-authorization
    - docker-runtime-state
    - kubernetes-runtime-state
    - network-state
    - secrets-and-authentication
    - provisioning-state

layers:
  l1:
    type: process-memory
    enabled: true
  l2:
    type: persistent-disk
    enabled: true
    root_source: ECOMMERCE_TOOL_HOME
    fallback_root: ~/.cache/ecommerce-1
    subdirectory: qualification-cache/v1

identity:
  algorithm: sha256
  required_key_material:
    - namespace
    - input-content-digest
    - validator-content-digest
    - tool-identity
    - normalized-options
  repository-paths-must-be-content-addressed: true
  file-name-only-keying: forbidden
  successful-results-only: true
  tool_identity:
    executable_sha256: required
    exact_version_contract: architecture.lock.yaml#machine_contracts.toolchain_lock

safety:
  cache-hit-must-not-authorize-dynamic-state: true
  caller-mutation-must-not-modify-memory-cache: true
  atomic-disk-write-required: true
  corrupt-entry-behavior: miss
  cache-io-failure-behavior: miss-without-skipping-qualification
  tool-identity-change-behavior: miss
  validator-change-behavior: miss
  input-change-behavior: miss

invalidation:
  contract_change: miss
  tool_version_change: miss
  tool_executable_sha256_change: miss
  dependency_lock_change: miss
  relevant_source_change: miss

consumers:
  qualification_execution:
    authority: architecture.lock.yaml#machine_contracts.qualification_execution_policy
    gate_inventory: delegated
    persistence: l2
  psych_yaml:
    enabled: true
    persistence: l1-l2
  security_scan:
    persistence: forbidden
    reason: exact Git history and worktree state must be scanned fresh
  dynamic_checks:
    persistence: forbidden
