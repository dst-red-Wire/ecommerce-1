version: 1
kind: RoadmapPolicy
status: enforced
architecture_authority: architecture.lock.yaml
document: docs/project/MASTER_EXECUTION_PLAN.md

github:
  tracker_type: issue
  completed_state: closed
  completed_state_reason: completed
  repository_source: current-origin

rendering:
  milestone_section_heading: "## 3. Milestone program"
  next_section_heading: "## 4. Critical path"
  begin_marker: "<!-- BEGIN GENERATED ROADMAP MILESTONES -->"
  end_marker: "<!-- END GENERATED ROADMAP MILESTONES -->"
  derived_status_label: "DERIVED — run make roadmap-check"

status_derivation:
  manual_status_override: forbidden
  projection_output: .context/evidence/roadmap-status.json
  qualification_base_ref: origin/main
  evidence_max_age_seconds: 86400
  dependency_terminal_statuses: [DONE, PROVEN]
  statuses:
    NOT_STARTED: no-valid-contract-or-implementation
    CONTRACTED: architecture-and-acceptance-defined
    PARTIAL: some-required-implementation-or-evidence-present
    IMPLEMENTED: required-implementation-exists-without-complete-proof
    PROVEN: all-required-exact-and-runtime-evidence-valid
    BLOCKED: explicit-condition-or-required-dependency-blocked
  runtime_evidence_contract:
    schema_version: 1
    required_fields:
      - schema_version
      - status
      - exact_commit_evidence
      - runtime_execution
      - head_sha
      - head_tree_sha
      - created_at_epoch
      - milestone
      - environment
      - runtime_identity
      - outcome
    accepted_status: PASS
    accepted_outcome: PASS
    runtime_identity_required_fields: [kind, id]

qce_traceability:
  architecture_authority: architecture.lock.yaml#developer_platform.quality_cloud_engineering.sectors
  sectors_must_be_derived: true
  label_prefix: "qce:"
  labels_are_relations_not_evidence: true
  unknown_label: reject
  manual_proven: forbidden
  github_metadata_snapshot: .context/qce/github-metadata.json
  evidence_output: .context/evidence/qce-status.json
  evidence_max_age_seconds: 86400
  runtime_evidence_contract:
    schema_version: 1
    required_fields:
      - schema_version
      - status
      - exact_commit_evidence
      - runtime_execution
      - head_sha
      - head_tree_sha
      - created_at_epoch
      - capabilities
      - environment
      - runtime_identity
      - outcome
    accepted_status: PASS
    accepted_outcome: PASS
    allowed_environments: [management, lab, preprod, prod-a, prod-b]
    runtime_identity_required_fields: [kind, id]
    exact_commit_evidence_required: true
    runtime_execution_required: true
    claimed_capability_membership_required: true
  statuses:
    NOT_STARTED: no-contracted-capability
    CONTRACTED: valid-contract-without-complete-implementation
    PARTIAL: some-required-capability-or-evidence-present
    IMPLEMENTED: all-required-capabilities-exist-without-current-proof
    PROVEN: all-required-gates-pass-in-fresh-exact-sha-evidence
    BLOCKED: explicit-blocker-prevents-target-state
  capabilities:
    continuous_testing:
      - id: affected-tests
        milestone: M1
        gates: [system]
        implementation_paths: [scripts/ci-affected.rb, scripts/repoctl.py]
        proof: {kind: qualification-gates}
      - id: exact-sha-qualification
        milestone: M1
        gates: [governance, contracts, security]
        implementation_paths: [config/contracts/ci-evidence.yaml, scripts/repoctl.py]
        proof: {kind: qualification-gates}
    test_first:
      - id: regression-test-contract
        milestone: M2
        gates: [system]
        implementation_paths: [tests/test_m2_product_golden.py]
        proof: {kind: qualification-gates}
    test_strategy:
      - id: impact-to-test-routing
        milestone: M1
        gates: [governance, system]
        implementation_paths: [scripts/ci-affected.rb, config/contracts/qualification-execution-policy.yaml]
        proof: {kind: qualification-gates}
    automation:
      - id: ansible-first-automation
        milestone: M1
        gates: [automation]
        implementation_paths: [platform/ansible/developer.yml, scripts/repoctl.py]
        proof: {kind: qualification-gates}
      - id: multi-cluster-platform-orchestration
        milestone: M4
        gates: [governance, system]
        implementation_paths:
          - config/infrastructure/kratix-platform.yaml
          - platform/fleet/bundles/kratix/kustomization.yaml
          - platform/fleet/bundles/kratix/git-state-store.yaml
          - tests/test_kratix_platform.py
        proof:
          kind: runtime-execution
          evidence_path: .context/evidence/kratix-platform-self-service.json
        activation_guard:
          contract: config/infrastructure/kratix-platform.yaml
          field: [security_qualification, final_result]
          allowed_values: [PASS]
    monitoring_observability:
      - id: telemetry-contract
        milestone: M4
        gates: [governance]
        implementation_paths: [config/contracts/observability-topology.yaml]
        proof: {kind: qualification-gates}
      - id: runtime-slo-signals
        milestone: M5
        gates: []
        implementation_paths: []
        proof: {kind: runtime-execution, evidence_path: .context/evidence/runtime-slo-signals.json}
    release_governance_automation:
      - id: immutable-supply-chain
        milestone: M4
        gates: [security]
        implementation_paths: [platform/tekton/tasks/product-supply-chain.yaml]
        proof: {kind: qualification-gates}
      - id: governed-promotion-proof
        milestone: M5
        gates: []
        implementation_paths: []
        proof: {kind: runtime-execution, evidence_path: .context/evidence/governed-promotion-proof.json}
    golden_path:
      - id: service-generator
        milestone: M2
        gates: [system]
        implementation_paths: [scripts/servicegen.py]
        proof: {kind: qualification-gates}
      - id: platform-self-service
        milestone: M4
        gates: [governance, system]
        implementation_paths:
          - config/infrastructure/kratix-platform.yaml
          - platform/fleet/bundles/kratix/kustomization.yaml
          - tests/test_kratix_platform.py
        proof:
          kind: runtime-execution
          evidence_path: .context/evidence/kratix-platform-self-service.json
        activation_guard:
          contract: config/infrastructure/kratix-platform.yaml
          field: [security_qualification, final_result]
          allowed_values: [PASS]
    developer_hub:
      - id: backstage-self-service
        milestone: M4
        gates: []
        implementation_paths: []
        proof: {kind: runtime-execution, evidence_path: .context/evidence/backstage-self-service.json}
    measuring_engineering:
      - id: engineering-metrics
        milestone: M1
        gates: [governance]
        implementation_paths: [config/contracts/engineering-metrics-policy.yaml, scripts/modern_engineering.py]
        proof: {kind: qualification-gates}
      - id: outcome-feedback
        milestone: M5
        gates: []
        implementation_paths: []
        proof: {kind: runtime-execution, evidence_path: .context/evidence/outcome-feedback.json}

milestones:
  - id: M0
    name: Architecture Sync
    owner: ChatGPT
    objective: lock `architecture.lock.yaml` as the canonical V5 authority and remove architecture collisions
    entry_gate: validated project decisions
    exit_gate: V5 lock, derived index, agent rules and merged sync PR
    fixed_status: DONE

  - id: M1
    name: Monorepo Bootstrap
    owner: Codex
    tracker: 13
    section_heading: "### M1 — Bootstrap"
    objective: create minimal maintainable monorepo skeleton
    entry_gate: M0 merged
    exit_gate: exactly 19 services + 2 frontends represented, repo checks green
    requires: [M0]
    requirements:
      implementation_paths: [architecture.lock.yaml, scripts/repoctl.py]
      qualification_gates: [governance, contracts, security, system]
      qce_capabilities: [affected-tests, exact-sha-qualification, impact-to-test-routing, ansible-first-automation]
      runtime_evidence: []

  - id: M2
    name: Golden Service Product
    owner: Codex
    tracker: 14
    section_heading: "### M2 — Golden Service"
    objective: prove one production-grade Go service pattern
    entry_gate: M1 PROVEN
    exit_gate: Product REST/gRPC/PostgreSQL/Outbox/Kafka/tests/container/Fleet/Tekton pattern PROVEN
    requires: [M1]
    requirements:
      implementation_paths: [services/product/go.mod, tests/test_m2_product_golden.py]
      qualification_gates: [security, system]
      qce_capabilities: [regression-test-contract, service-generator]
      runtime_evidence: []

  - id: M2.5
    name: Persistent MGMT Bootstrap
    owner: Codex
    tracker: 32
    section_heading: "### M2.5 — Persistent MGMT Bootstrap"
    objective: bootstrap the persistent management plane required before PREPROD
    entry_gate: M1 PROVEN
    exit_gate: persistent MGMT bootstrap PROVEN under the canonical architecture contracts
    requires: [M1]
    requirements:
      implementation_paths: [config/infrastructure/mgmt-bootstrap.yaml, platform/terraform/environments/mgmt, platform/ansible]
      qualification_gates: [governance, contracts, system]
      qce_capabilities: []
      runtime_evidence: []

  - id: M3
    name: PREPROD Infrastructure
    owner: Codex
    tracker: 16
    section_heading: "### M3 — PREPROD Infrastructure"
    objective: provision reproducible JIT infrastructure foundation
    entry_gate: M2.5 PROVEN; exact infrastructure contracts already merged
    exit_gate: Terraform/Ansible/Proxmox/Rocky/RKE2 baseline reproducible, destroyable, zero-resource verified
    requires: [M2.5]
    requirements:
      implementation_paths: [config/infrastructure/preprod-inventory.yaml, platform/terraform/environments/qualification]
      qualification_gates: [governance, contracts, system]
      qce_capabilities: []
      runtime_evidence:
        - path: .context/evidence/roadmap/M3-preprod-infrastructure.json
          environments: [preprod]

  - id: M4
    name: Platform Baseline
    owner: Codex
    tracker: 17
    section_heading: "### M4 — Platform Baseline"
    objective: deploy security, delivery, observability and stateful platform baseline
    entry_gate: M3 PROVEN
    exit_gate: platform services healthy, declarative, observable, secured, restore prerequisites present
    requires: [M3]
    requirements:
      implementation_paths: [config/infrastructure/deployment-waves.yaml, platform/fleet, platform/tekton]
      qualification_gates: [governance, contracts, security, system]
      qce_capabilities: [multi-cluster-platform-orchestration, telemetry-contract, immutable-supply-chain, platform-self-service, backstage-self-service]
      runtime_evidence:
        - path: .context/evidence/roadmap/M4-platform-baseline.json
          environments: [management]

  - id: M5
    name: Commerce Vertical Slice
    owner: Codex
    tracker: 18
    section_heading: "### M5 — Vertical Slice"
    objective: deliver first end-to-end commerce path
    entry_gate: M2 + M4 PROVEN
    exit_gate: Storefront through domain/data/event paths passes contracts, BDD, E2E and baseline performance
    requires: [M2, M4]
    requirements:
      implementation_paths: [services/product, frontend/apps/storefront]
      qualification_gates: [contracts, security, system]
      qce_capabilities: [runtime-slo-signals, governed-promotion-proof, outcome-feedback]
      runtime_evidence:
        - path: .context/evidence/roadmap/M5-commerce-vertical-slice.json
          environments: [preprod]

  - id: M6
    name: Full Application
    owner: Codex
    tracker: 19
    section_heading: "### M6 — Full Application"
    objective: complete 19 services + Storefront + Admin
    entry_gate: M5 PROVEN
    exit_gate: all scoped business capabilities implemented with contracts/tests/ownership
    requires: [M5]
    requirements:
      implementation_paths: [services, frontend/apps/storefront, frontend/apps/admin]
      qualification_gates: [contracts, security, system]
      qce_capabilities: []
      runtime_evidence:
        - path: .context/evidence/roadmap/M6-full-application.json
          environments: [preprod]

  - id: M7
    name: Qualification
    owner: Codex
    tracker: 20
    section_heading: "### M7 — Qualification"
    objective: run full QA/security/supply-chain/perf/chaos/DR gates
    entry_gate: M6 feature complete and platform stable
    exit_gate: qualification evidence complete; no unresolved release blocker
    requires: [M6]
    requirements:
      implementation_paths: [config/contracts/qualification-execution-policy.yaml, scripts/repoctl.py]
      qualification_gates: [automation, contracts, governance, security, system]
      qce_capabilities: [exact-sha-qualification]
      runtime_evidence:
        - path: .context/evidence/roadmap/M7-qualification.json
          environments: [preprod]

  - id: M8
    name: PREPROD Certification
    owner: Codex execution + Work reporting; release governance authority
    tracker: 21
    section_heading: "### M8 — Certification"
    objective: execute three PREPROD campaigns and certify material equivalence
    entry_gate: M7 PROVEN
    exit_gate: standard + endurance + PROD-equivalent PASS; evidence archived; test state destroyed; READY_FOR_PROD
    requires: [M7]
    requirements:
      implementation_paths: [docs/project/MASTER_EXECUTION_PLAN.md]
      qualification_gates: [governance, security, system]
      qce_capabilities: []
      runtime_evidence:
        - path: .context/evidence/roadmap/M8-standard-campaign.json
          environments: [preprod]
        - path: .context/evidence/roadmap/M8-endurance-campaign.json
          environments: [preprod]
        - path: .context/evidence/roadmap/M8-prod-equivalent-campaign.json
          environments: [preprod]

  - id: M9
    name: PROD A/B Rollout
    owner: Codex execution; release governance authority; Work launch pack
    tracker: 22
    section_heading: "### M9 — PROD A/B"
    objective: build trusted PROD A/B and progressive rollout
    entry_gate: M8 READY_FOR_PROD
    exit_gate: controlled rollout, rollback proven, monitoring/business operations ready, release evidence complete
    requires: [M8]
    requirements:
      implementation_paths: [config/infrastructure/prod-inventory.yaml]
      qualification_gates: [governance, security, system]
      qce_capabilities: []
      runtime_evidence:
        - path: .context/evidence/roadmap/M9-prod-a.json
          environments: [prod-a]
        - path: .context/evidence/roadmap/M9-prod-b.json
          environments: [prod-b]
