version: 1
status: active
architecture_authority: architecture.lock.yaml
observability_topology: config/contracts/observability-topology.yaml
mesh_observability_policy: config/contracts/mesh-observability-policy.yaml

classification:
  forbidden_fields:
    - authorization
    - cookie
    - set-cookie
    - access_token
    - refresh_token
    - id_token
    - api_key
    - card_pan
    - card_cvc
    - raw_payment_payload
  sensitive_fields:
    - email
    - phone
    - postal_address
    - customer_name
    - user_id
    - order_id
    - payment_id
  allowed_identifiers:
    - trace_id
    - span_id
    - request_id
    - correlation_id
    - service_name
    - route_template

redaction:
  edge:
    authority: caddy-coraza
    strip_sensitive_headers_before_logging: true
  api:
    authority: kong
    redact_authentication-material: true
  mesh:
    authority: istio
    redact_payment-authorization-data: true
  application:
    authority: application-otel-sdk
    pii-default: redact-or-tokenize

rules:
  secrets-in-logs: forbidden
  credentials-in-traces: forbidden
  raw-request-body-logging: forbidden-by-default
  raw-response-body-logging: forbidden-by-default
  payment-sensitive-data-in-telemetry: forbidden
  security-telemetry-may-contain-sensitive-metadata-only-when-explicitly-approved: true
  telemetry-failure-must-not-break-business-traffic: true
  retention-must-be-defined-before-prod: true
