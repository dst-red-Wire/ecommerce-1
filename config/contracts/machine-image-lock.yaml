version: 1
status: exact
architecture_authority: architecture.lock.yaml
scope: rocky-10.2-golden-images

packer_image:
  id: rocky-10.2-base
  os:
    distribution: rocky
    version: "10.2"
    architecture: x86_64-v3

  source:
    iso: Rocky-10.2-x86_64-dvd1.iso
    url: https://download.rockylinux.org/pub/rocky/10.2/isos/x86_64/Rocky-10.2-x86_64-dvd1.iso
    sha256: 16ca9c96cdb221ba6e1f68579f21bd69fd8da81c6a921d9068949796f91c8feb
    mutable_aliases: forbidden

  packages:
    lock: config/artifacts/rocky-10.2-base-packages.lock.json
    projection_from: packer_image.profiles.*.rpm_packages
    schema: profile-separated-rpm-closure-v2
    single_definition_for_all_outputs: true
    transaction:
      repositories: forbidden
      local_package_gpg_check: required
      iso_conflict_replacement: allowerasing
      skip_broken: forbidden
      nobest: forbidden
      qualification: exact-profile-roots
    sources:
      rocky:
        repositories:
          baseos: https://download.rockylinux.org/pub/rocky/10.2/BaseOS/x86_64/os/
          appstream: https://download.rockylinux.org/pub/rocky/10.2/AppStream/x86_64/os/
          extras: https://download.rockylinux.org/pub/rocky/10.2/extras/x86_64/os/
        signing_key:
          category: rpm-signing-key
          file: rocky-10-public.asc
          fingerprint: FC226859C0860BF0DDB95B085B106C736FEDFC85
          sha256: be8c4f070b696e64d8ce40e59a95a57e8b5c776f0015c2fd64e14b896622bdb4
          url: https://dl.rockylinux.org/pub/rocky/RPM-GPG-KEY-Rocky-10
      epel:
        repository: https://dl.fedoraproject.org/pub/epel/10.2/Everything/x86_64/
        signing_key:
          category: rpm-signing-key
          file: epel-10-public.asc
          fingerprint: 7D8D15CBFC4E62688591FB2633D98517E37ED158
          sha256: de390fc168eae5ab2852e9e93d34a0b9ddf05cf9ce90ee28d97de26a4b1f6b93
          url: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-10

  external_tools:
    registry: config/contracts/toolchain-lock.json#tools
    staging: checksum-verified-before-packer
    network_during_packer: forbidden

  profiles:
    base:
      kind: shared-component
      rpm_packages:
        - openssh-server
        - sudo
        - python3
        - ca-certificates
        - bash-completion
        - which
        - file
        - less
        - tree
        - curl
        - tar
        - gzip
        - xz
        - zstd
        - rsync
        - zip
        - unzip
        - acl
        - attr
        - procps-ng
        - util-linux
        - openssl
        - NetworkManager
        - iproute
        - iputils
        - ethtool
        - bind-utils
        - lsof
        - socat
        - tcpdump
        - nmap-ncat
        - chrony
        - nftables
        - iptables-nft
        - conntrack-tools
        - policycoreutils
        - libselinux-utils
        - container-selinux
        - kernel
        - kernel-modules
        - kernel-modules-extra
        - fzf
        - jq
        - bat
        - tmux
      external_tools: [ripgrep, fd, yq]
      compatibility_substitutions:
        curl-minimal:
          resolved_package: curl
          reason: unavailable-in-locked-rocky-10.2-repositories
    rke2:
      kind: build-profile
      extends: base
      rpm_packages: [openscap-scanner, scap-security-guide]
      external_tools: [kube-bench]
      required_tools: [oscap, scap-security-guide, kube-bench]
      forbidden_tools: [gh, git, strace, sysstat, mtr, shellcheck, shfmt]
    admin-qualification:
      kind: build-profile
      extends: base
      rpm_packages: [git, strace, sysstat, mtr, ShellCheck]
      external_tools: [gh, shfmt]
      required_tools: [git, gh, strace, sysstat, mtr, shellcheck, shfmt]

  hypervisors:
    virtualbox:
      base_agent: none
      guest_additions: disabled
    qemu_kvm:
      rpm_packages: [qemu-guest-agent]

  kernel:
    nevra: kernel-0:6.12.0-211.58.1.el10_2.x86_64
    modules_extra: required
    required_modules: [br_netfilter, nf_conntrack, overlay, vxlan]

  security:
    selinux: enforcing
    container_selinux: required
    firewall_backend: nftables
    firewalld: absent
    ssh_root_login: forbidden
    ssh_password_authentication: forbidden
    ssh_empty_passwords: forbidden
    kernel_redirect_acceptance: disabled
    core_dumps: restricted

  networking:
    manager: NetworkManager
    ipv4_forwarding: prepared
    static_ip: forbidden

  services:
    enabled: [NetworkManager, chronyd, sshd]
    disabled: [firewalld]

  kubernetes_prerequisites:
    swap: disabled
    cgroup: v2
    bpffs: required
    rke2_selinux: supplied-by-locked-rke2-bundle

  build:
    packer_version_ref: config/contracts/toolchain-lock.json#versions.PACKER_VERSION
    resources:
      authority: shared-all-hypervisors
      vcpus: 2
      memory_mib: 4096
      disk_mib: 32768
    storage:
      authority: shared-all-hypervisors
      firmware: bios
      partition_table: gpt
      bios_boot_mib: 1
      boot_mib: 2048
      root_min_mib: 10240
      root_filesystem: xfs
      lvm: forbidden
      swap: forbidden
    timeouts:
      authority: shared-all-hypervisors
      ssh_seconds: 3600
    host_tool_versions:
      virtualbox: config/contracts/toolchain-lock.json#versions.VIRTUALBOX_VERSION
      vagrant: config/contracts/toolchain-lock.json#versions.VAGRANT_VERSION
      qemu: config/contracts/toolchain-lock.json#versions.QEMU_VERSION
    credential:
      type: runtime-injected-temporary-ssh-key
      committed_private_key: forbidden
      committed_password_or_hash: forbidden
      password_authentication: forbidden
      private_key_storage: host-local-outside-repository
      private_key_cleanup_after_qualification: required
      released_artifact_private_key_exists: forbidden
      authorized_public_key_purpose: build-and-local-qualification-only
      build_user_final_state: password-locked-key-only
    virtualbox:
      version: 7.2.18
      plugin:
        source: github.com/hashicorp/virtualbox
        version: 1.1.5
    qemu_kvm:
      plugin:
        source: github.com/hashicorp/qemu
        version: 1.1.6
    vagrant_post_processor:
      plugin:
        source: github.com/hashicorp/vagrant
        version: 1.1.7

  outputs:
    logical_base: rocky-10.2-base
    local_artifact_root: .artifacts/packer/rocky-10.2
    local_evidence_root: .context/evidence/rocky-image/rocky-10.2
    evidence_by_profile:
      windows:
        build: .context/evidence/rocky-image/rocky-10.2/windows/build.json
        qualification: .context/evidence/rocky-image/rocky-10.2/windows/qualification.json
        release: .context/evidence/rocky-image/rocky-10.2/windows/release.json
      linux:
        build: .context/evidence/rocky-image/rocky-10.2/linux/build.json
        qualification: .context/evidence/rocky-image/rocky-10.2/linux/qualification.json
        release: .context/evidence/rocky-image/rocky-10.2/linux/release.json
    rke2:
      virtualbox: rocky-10.2-rke2-virtualbox.box
      qemu_kvm: rocky-10.2-rke2-kvm.qcow2
    admin_qualification:
      virtualbox: rocky-10.2-admin-qualification-virtualbox.box
      qemu_kvm: rocky-10.2-admin-qualification-kvm.qcow2

  distribution:
    authority: oras
    registry: harbor
    artifact_type: application/vnd.ecommerce.rocky-machine-image.v1
    repository_entrypoints:
      push: image-rocky-oras-push
      pull: image-rocky-oras-pull
    push:
      repository_environment: ORAS_REPOSITORY
      tag_format: git-{source_sha}
      output_reference: repository@sha256:digest
      requires: [release-evidence-pass, clean-exact-source-sha, published-exact-source-sha, artifact-sha256]
    pull:
      reference_environment: ORAS_REF
      reference_format: repository@sha256:digest
      mutable_tag: forbidden
    cache:
      environment: ORAS_CACHE
      default: .context/cache/oras
      layout: materialized/sha256/{artifact_sha256}
      synchronization: rsync
      synchronization_flags: [--archive, --checksum, --partial, --delay-updates]
      integrity: sha256-before-and-after-sync
    profiles:
      windows:
        artifact: rocky-10.2-rke2-virtualbox.box
        layer_media_type: application/vnd.hashicorp.vagrant.box
      linux:
        artifact: rocky-10.2-rke2-kvm.qcow2
        layer_media_type: application/vnd.qemu.qcow2
    evidence_by_profile:
      windows:
        push: .context/evidence/rocky-image/rocky-10.2/windows/oras-push.json
        pull: .context/evidence/rocky-image/rocky-10.2/windows/oras-pull.json
      linux:
        push: .context/evidence/rocky-image/rocky-10.2/linux/oras-push.json
        pull: .context/evidence/rocky-image/rocky-10.2/linux/oras-pull.json
    timeouts_seconds:
      oras: 7200
      rsync: 7200

  clone_hygiene:
    hostname: rocky-10-2-base
    machine_id: cleaned-before-export
    ssh_host_keys: regenerate-on-first-boot
    private_keys: forbidden
    build_authorized_keys: ephemeral-public-half-only
    build_private_key: destroyed-after-qualification-before-release
    build_user: password-locked-key-only
    secrets: forbidden
    rke2_token: forbidden

  evidence:
    sbom: required
    sha256: required
    package_manifest: required
    profile_inventory: required

  qualification:
    os_release: rocky-10.2
    cgroup_filesystem: cgroup2fs
    swap: disabled
    selinux: enforcing
    firewall_backend: nftables
    github_credentials: forbidden
    gh:
      profile: admin-qualification
      version: 2.101.0
      offline_help_capabilities: [--paginate, --slurp]
    rke2_security:
      openscap_profile: xccdf_org.ssgproject.content_profile_cis_server_l1
      openscap_datastream: /usr/share/xml/scap/ssg/content/ssg-rl10-ds.xml
      kube_bench_profile: rke2-cis-1.9
      kube_bench_profile_status: unsupported-for-rke2-v1.37

  local_pipeline:
    source_root: platform/packer/rocky-10.2
    vagrant_smoke_root: platform/vagrant/rocky-image-smoke
    windows_scripts_root: scripts/windows
    linux_orchestrator: scripts/linux_image_pipeline.py
    windows_stage_root: LOCALAPPDATA/ecommerce-1/packer/rocky-10.2
    linux_stage_root: .context/packer-linux/rocky-10.2
    profiles:
      windows:
        builder: virtualbox-iso
        artifact_root: .artifacts/packer/rocky-10.2/windows
        artifact: rocky-10.2-rke2-virtualbox.box
        repository_entrypoints:
          preflight: image-rocky-windows-preflight
          build: image-rocky-windows-build
          qualification: image-rocky-windows-qualify
          release: image-rocky-windows-release
      linux:
        host_os: ubuntu-24.04-x86_64
        builder: qemu
        artifact_root: .artifacts/packer/rocky-10.2/linux
        artifact: rocky-10.2-rke2-kvm.qcow2
        repository_entrypoints:
          preflight: image-rocky-linux-preflight
          build: image-rocky-linux-build
          qualification: image-rocky-linux-qualify
          release: image-rocky-linux-release
    stages: [preflight, build, qualification, release]
    separation:
      build_is_qualification: false
      qualification_is_release: false
      release_publishes_remote_artifact: false
      distribution_is_explicit_after_release: true
    timeouts_seconds:
      command_probe: 15
      wsl_bridge: 60
      wsl_render: 300
      packer_init: 300
      packer_validate: 120
      packer_build: 7200
      vagrant_box_add: 600
      vagrant_boot: 900
      ssh_probe: 120
      guest_probe: 120
      cleanup: 300
    retries:
      ssh_attempts: 12
      delay_seconds: 5
    evidence:
      encoding: utf-8-no-bom
      schema: 1
      exact_artifact_sha256: required
      runtime_pass_may_be_static: false
    path_policy:
      windows_program_working_directory_unc: forbidden
      local_windows_staging_required_for_unc_repository: true
      wsl_to_windows_conversion: wslpath
      linux_profile_requires_native_host: true
    network_policy:
      packer_plugins_initialized_before_isolated_guest_provisioning: required
      guest_package_network_access: forbidden
      vagrant_smoke_nat: ephemeral-cleaned
      qemu_smoke_user_nat: ephemeral-cleaned

responsibility_boundary:
  packer:
    - immutable-os-base
    - kernel-and-modules
    - common-package-set
    - common-os-hardening
  ansible:
    - ip-addresses
    - hostname
    - control-plane-worker-role
    - rke2-token
    - rke2-cluster-init-and-join
    - haproxy
    - cilium
    - dns
    - cluster-network-and-security-policies
  rke2_bundle:
    - exact-rke2
    - exact-cilium-images
    - rke2-selinux
    - complete-runtime-rpm-closure

rules:
  packer_may_invoke_ansible: forbidden
  cluster_identity_in_image: forbidden
  runtime_secrets_in_image: forbidden
  rke2_token_in_image: forbidden
  network_identity_in_image: forbidden
  generated_images_in_git: forbidden
  one_responsibility_one_authority: required
  packer_execution_must_match_selected_host_profile: required
  packer_in_wsl2: forbidden
  vagrant_provisioning: forbidden
  release_without_build_and_qualification_evidence: forbidden
