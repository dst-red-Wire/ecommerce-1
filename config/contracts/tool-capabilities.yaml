---
kind: ToolCapabilityRegistry
non_capability_tools:
- ansible-lint
- ast-grep
- bazel
- corepack
- fd
- gh
- go
- helm
- kubectl
- kustomize
- node
- nx
- oasdiff
- oxfmt
- oxlint
- pnpm
- pre-commit
- rg
- ruff
- scap-security-guide
- shfmt
- yq
policy_ref: config/contracts/execution-properties-policy.yaml
relationships:
- implements
- enforces
- verifies
- observes
- produces_evidence
- aggregates_evidence
- transports_evidence
requirement_vocabulary:
- pinned_inputs
- immutable_source_versions
- checksums_verified
- deterministic_build_definition
- declared_dependencies
- network_access_controlled
- artifact_digest
- source_sha
- toolchain_digest
- second_apply_test
- second_apply_changes_zero
- desired_state
- observed_state
- convergence_test
- state_locking
- bounded_timeout
- capture_before_mutation
- restore_on_failure
- restore_verification
- valid_signature
- provenance_attestation
- policy_pass
- reconciliation_enabled
- runtime_evidence
- referenced_runtime_evidence
- digest_addressing
- retention_configured
- encrypted_secret_source
- decryption_verified
- runtime_version_pinned
- scan_gate_pass
- policy_loaded
- fail_closed_result
- execution_bounds
- transfer_digest_preserved
- generator_version_pinned
- input_contract_digest
- output_digest
scopes:
- infrastructure
- machine_image
- machine_configuration
- bootstrap
- configuration
- kubernetes
- artifact
- pipeline
- application
- security
semantics: potential-abilities-only
toolchain_aliases:
  ansible:
  - ansible-core
  - ansible-playbook
  - ansible-galaxy
  buildkit:
  - docker-buildx
tools:
  age:
    capabilities:
      declarative_reproducibility:
        relationships:
        - implements
        requires:
          all:
          - encrypted_secret_source
          - pinned_inputs
        scopes:
        - security
        gate: age-declarative_reproducibility
      verification:
        relationships:
        - verifies
        requires:
          all:
          - decryption_verified
        scopes:
        - security
        gate: age-verification
    discovery:
    - marker: age
      path: config/contracts/secret-delivery-policy.yaml
    not_guaranteed:
    - convergence
    - idempotency
    version_ref: AGE_VERSION
  ansible:
    capabilities:
      bounded_execution:
        relationships:
        - enforces
        requires:
          all:
          - bounded_timeout
        scopes:
        - configuration
        gate: ansible-bounded_execution
      convergence:
        relationships:
        - implements
        requires:
          all:
          - desired_state
          - observed_state
          - convergence_test
        scopes:
        - machine_configuration
        gate: ansible-convergence
      determinism:
        relationships:
        - implements
        requires:
          all:
          - pinned_inputs
          - immutable_source_versions
        scopes:
        - configuration
        gate: ansible-determinism
      idempotency:
        relationships:
        - implements
        - verifies
        requires:
          all:
          - second_apply_test
          - second_apply_changes_zero
        scopes:
        - machine_configuration
        gate: ansible-idempotency
      recovery:
        relationships:
        - implements
        requires:
          all:
          - capture_before_mutation
          - restore_on_failure
          - restore_verification
        scopes:
        - bootstrap
        gate: ansible-recovery
      reproducibility:
        relationships:
        - implements
        requires:
          all:
          - pinned_inputs
          - immutable_source_versions
        scopes:
        - configuration
        gate: ansible-reproducibility
      verification:
        relationships:
        - verifies
        requires:
          all:
          - runtime_evidence
        scopes:
        - configuration
        gate: ansible-verification
    discovery:
    - path: platform/ansible/mgmt.yml
    - path: platform/ansible/requirements.yml
    not_guaranteed:
    - artifact_immutability
    - provenance
    version_ref: ANSIBLE_CORE_VERSION
  buildkit:
    capabilities:
      determinism:
        relationships:
        - implements
        requires:
          all:
          - pinned_inputs
          - immutable_source_versions
        scopes:
        - artifact
        gate: buildkit-determinism
      hermeticity:
        relationships:
        - enforces
        requires:
          all:
          - declared_dependencies
          - network_access_controlled
        scopes:
        - artifact
        gate: buildkit-hermeticity
      immutability:
        relationships:
        - produces_evidence
        requires:
          all:
          - source_sha
          - toolchain_digest
          - artifact_digest
        scopes:
        - artifact
        gate: buildkit-immutability
      provenance:
        relationships:
        - produces_evidence
        requires:
          all:
          - source_sha
          - toolchain_digest
          - artifact_digest
        scopes:
        - artifact
