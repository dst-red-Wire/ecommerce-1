version: 1
status: exact-prerequisites
scope: management-plane-tekton-trigger-runtime

api_contract:
  pipelines: tekton.dev/v1
  triggers: triggers.tekton.dev/v1beta1
  required_trigger_resources:
    - EventListener
    - TriggerBinding
    - TriggerTemplate
  crds_must_be_proven_before_activation: true

namespace:
  dedicated_required: true
  value_source: management-plane-runtime-config
  hardcoded_in_trigger_manifests: false

source_checkout:
  owner: tekton-affected-pipeline
  initial_workspace: empty
  immutable_base_head_required: true
  trigger_may_populate_workspace: false

runner_image:
  parameter: runner-image
  registry_authority: harbor
  value_source: management-plane-runtime-config
  immutable_digest_required: true
  digest_pattern: '@sha256:[0-9a-f]{64}$'
  default_forbidden: true
  live_pull_proof_required: true

execution_budget:
  bounded_parallelism_required: true
  enforcement: kubernetes-resourcequota-and-runner-pod-resources
  values_source: management-plane-runtime-config
  hardcoded_concurrency_without_measurement_forbidden: true
  performance_evidence_required_before_tuning: true

identity:
  event_listener_service_account:
    required: true
    least_privilege: true
    wildcard_rbac_forbidden: true
  pipeline_service_account:
    required: true
    least_privilege: true
    wildcard_rbac_forbidden: true

webhook_authentication:
  forge: gitea
  algorithm: hmac-sha256
  accepted_signature_header: X-Hub-Signature-256
  strategy: github-compatible-hmac-interceptor
  reject_unsigned: true
  secret:
    source: openbao-via-eso
    plaintext_in_git_forbidden: true
    kubernetes_secret_name_source: management-plane-runtime-config
    secret_key_source: management-plane-runtime-config

network:
  default_deny_required: true
  ingress:
    public_target: eventlistener-only
    tls_required: true
  egress_required:
    - gitea
    - harbor
    - kubernetes-api
  live_network_policy_proof_required: true

activation:
  trigger_manifests: blocked-until-prerequisites-proven
  required_proofs:
    - triggers-crds-present
    - dedicated-namespace-provisioned
    - runner-image-digest-pullable
    - bounded-execution-budget-proven
    - least-privilege-rbac-proven
    - webhook-secret-synced-from-openbao-via-eso
    - ingress-tls-and-network-policy-proven
  static_contract_is_runtime_proof: false

readiness_gate:
  controller: scripts/repoctl.py
  command: tekton-trigger-readiness
  mode: read-only
  runtime_config_input: required-non-secret-management-plane-yaml
  evidence_output: .context/runtime/tekton-trigger-readiness.json
  static_render:
    tool: kustomize
    root: platform/tekton
  helm_usage: only-when-a-runtime-component-is-chart-owned
  blocked_exit_code: 3
  pass_requires_all_required_proofs: true
  mutation_performed_must_be: false
  proof_pod_annotations:
    runner_pull: ecommerce-1.io/readiness-proof=runner-image-pull
    network_egress: ecommerce-1.io/readiness-proof=network-egress
    network_targets: ecommerce-1.io/readiness-targets=gitea,harbor,kubernetes-api
