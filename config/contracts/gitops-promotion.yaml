schema_version: 1
owner: platform-cd
authority: rancher-fleet
progressive_delivery: argo-rollouts
environments: [preprod, prod]
allowed_paths:
  preprod: platform/gitops/preprod/images.yaml
  prod: platform/gitops/prod/images.yaml
rules:
  qualified_digest_only: true
  same_digest_preprod_prod: true
  direct_deploy: false
  merge: false
  sequential_sites: true
strategy:
  canary_steps: [10, 25, 50, 100]
  human_approval_before: 50
  deterministic_failure: automatic-rollback
  ambiguous_signal: pause
  rollback_digest_retained: true
