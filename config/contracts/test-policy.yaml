version: 1
kind: TestPolicy
status: enforced
architecture_authority: architecture.lock.yaml
scope: entire-repository
authority_claims:
  - repository.tests.selection
  - repository.tests.runtime-boundary
evidence_authority: architecture.lock.yaml#machine_contracts.ci_evidence
principles:
  global_gates_always_run_for_transverse_governance_change: true
  component_tests_are_affected-routed: true
  test_execution_must_not_mutate_source: true
classes:
  unit:
    runtime: static
  integration:
    runtime: conditional
  container-integration:
    runtime: optional-runtime
    unavailable_behavior: platform-not-capable
  architecture:
    runtime: static
routing:
  authority: architecture.lock.yaml#machine_contracts.change_routing_policy
