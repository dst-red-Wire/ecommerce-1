version: 1
status: exact
architecture_authority: architecture.lock.yaml

purpose: reuse deterministic qualification work without weakening exact-SHA evidence

scope:
  cacheable:
    - deterministic-static-parsing
    - deterministic-static-global-gates
    - deterministic-code-generation-inputs
  forbidden:
    - git-status
    - current-head-sha
    - remote-ci-state
    - review-state
    - owner-authorization
    - docker-runtime-state
    - kubernetes-runtime-state
    - network-state
    - secrets-and-authentication
    - provisioning-state

layers:
  l1:
    type: process-memory
    enabled: true
  l2:
    type: persistent-disk
    enabled: true
    root_source: ECOMMERCE_TOOL_HOME
    fallback_root: ~/.cache/ecommerce-1
    subdirectory: qualification-cache/v1

identity:
  algorithm: sha256
  required_key_material:
    - namespace
    - input-content-digest
    - validator-content-digest
    - tool-identity
    - normalized-options
  repository-paths-must-be-content-addressed: true
  file-name-only-keying: forbidden
  successful-results-only: true

safety:
  cache-hit-must-not-authorize-dynamic-state: true
  caller-mutation-must-not-modify-memory-cache: true
  atomic-disk-write-required: true
  corrupt-entry-behavior: miss
  cache-io-failure-behavior: miss-without-skipping-qualification
  tool-identity-change-behavior: miss
  validator-change-behavior: miss
  input-change-behavior: miss

consumers:
  psych_yaml:
    enabled: true
    persistence: l1-l2
  repoctl_global_static_gates:
    enabled: true
    persistence: l2
    gates:
      governance:
        inputs:
          - architecture.lock.yaml
          - config/contracts/**/*
          - config/infrastructure/**/*
          - contracts/**/*
          - docs/architecture/**/*
          - platform/tekton/**/*
          - scripts/*.py
          - scripts/*.rb
          - tests/*.py
          - tests/*.rb
          - AGENTS.md
          - README.md
          - docs/api/README.md
          - docs/project/CODEX_HANDOFFS.md
      runtime-efficiency:
        inputs:
          - architecture.lock.yaml
          - config/contracts/runtime-efficiency.yaml
          - frontend/go.mod
          - frontend/apps/storefront/main.go
          - frontend/apps/admin/main.go
          - frontend/internal/web/layout.templ
          - services/*/Containerfile
          - scripts/validate-runtime-efficiency.rb
          - scripts/resource-sizing.rb
          - tests/runtime_efficiency_test.rb
          - tests/resource_sizing_test.rb
      contracts:
        inputs:
          - architecture.lock.yaml
          - config/contracts/public-api-contracts.yaml
          - config/contracts/service-ownership.yaml
          - config/contracts/dependency-map.yaml
          - config/contracts/event-contracts.yaml
          - contracts/openapi/**/*
          - scripts/validate-openapi.rb
          - scripts/validate-contract-consistency.rb
          - scripts/validate-architecture.rb
          - tests/openapi_validator_test.rb
          - tests/contract_consistency_test.rb
      automation:
        inputs:
          - .gitignore
          - BUILD.bazel
          - "**/*.sh"
          - platform/tekton/**/*
          - scripts/repoctl.py
  security_scan:
    persistence: forbidden
    reason: exact Git history and worktree state must be scanned fresh
  dynamic_checks:
    persistence: forbidden
