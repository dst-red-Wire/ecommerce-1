{
  "version": 1,
  "kind": "ToolchainLock",
  "status": "exact",
  "architecture_authority": "architecture.lock.yaml",
  "scope": "entire-repository",
  "authority_claims": [
    "repository.toolchain.versions",
    "repository.toolchain.capabilities",
    "repository.toolchain.provisioning-ownership",
    "repository.toolchain.gate-requirements"
  ],
  "principles": {
    "single_source_of_truth": true,
    "unmanaged_version_authority": "forbidden",
    "unmanaged_checksum_authority": "forbidden",
    "consumer_embedded_tool_versions": "forbidden",
    "projection_drift": "blocking"
  },
  "runtime_boundaries": {
    "node": {
      "repository_tooling": "allowed",
      "backstage_management_plane": "allowed-required",
      "commerce_runtime": "forbidden",
      "commerce_frontends": "forbidden",
      "commerce_services": "forbidden"
    }
  },
  "legacy_projections": {
    "versions_env": {
      "path": "config/toolchain/versions.env",
      "authority": "derived-projection",
      "comparison": "semantic-key-value"
    },
    "capabilities_json": {
      "path": "config/toolchain/capabilities.json",
      "authority": "derived-projection",
      "comparison": "semantic-json",
      "keys": [
        "schema_version",
        "supported",
        "capabilities",
        "provision_owners",
        "seed_prerequisites",
        "platform_primitives",
        "gate_requirements",
        "command_capabilities",
        "gate_sources"
      ]
    }
  },
