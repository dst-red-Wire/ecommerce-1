version: 1
kind: DocumentationDriftPolicy
status: enforced
architecture_authority: architecture.lock.yaml
scope: active-documentation
authority_claims: [repository.documentation.drift]
principles:
  documentation_is_not_policy_authority: true
  active_docs_must_not_contradict_canonical_contracts: true
forbidden_patterns:
  AGENTS.md:
    - 'portable POSIX `sh`'
    - 'repository shell helpers'
  README.md:
    - 'scripts/ci-\*\.sh'
  docs/project/CODEX_HANDOFFS.md:
    - 'shared POSIX `sh` helpers'
    - 'shared repository scripts factored'
  docs/api/README.md:
    - 'bootstrap CI Woodpecker'
