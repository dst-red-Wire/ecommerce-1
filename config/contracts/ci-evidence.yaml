version: 1
status: exact

evidence:
  schema_version: 5
  local_cache: .context/evidence/<sha>.json
  exact_commit_required: true
  pass_required_for_reuse: true
  direct_parent_only: true
  merge_commit_reuse: forbidden
  wrong_base_reuse: forbidden
  dirty_worktree_reuse: forbidden
  content_cache_authorizes_pass_reuse: false
  maximum_local_age_seconds: 86400
  qualification_identity_required: true
  commit_tree_required: true

bundle:
  schema_version: 1
  scope: exact-head
  root: .context/evidence/<head_sha>
  manifest: .context/evidence/<head_sha>/manifest.json
  manifest_digest_sidecar: .context/evidence/<head_sha>/manifest.sha256
  historical_manifest: .context/evidence/<head_sha>/history/<sha256hex>.json
  canonicalization: utf8-json-sort-keys-compact-trailing-newline
  manifest_digest: sha256-of-canonical-manifest-bytes
  referenced_file_digest: sha256-of-exact-file-bytes
  reference_categories: [artifacts, runtime_evidence, gate_evidence, review_evidence]
  reference_fields: [path, sha256]
  required_identity_fields:
    - base_sha
    - head_sha
    - tree_sha
    - toolchain_digest
    - qualification_identity
    - runtime_identity
  required_manifest_fields:
    - schema_version
    - base_sha
    - head_sha
    - tree_sha
    - toolchain_digest
    - qualification_identity
    - runtime_identity
    - artifacts
    - runtime_evidence
    - gate_evidence
    - review_evidence
    - evidence_digests
    - verdict_authority
  qualification_source: .context/evidence/<head_sha>.json
  qualification_must_be_exact_sha_pass: true
  evidence_digests_required_for_every_reference: true
  retain_superseded_manifests: true
  tracked_git_authority: false
  verdict_authority: false
  missing_or_mismatched_digest: FAIL
  wrong_head_or_tree: FAIL

controller_compatibility:
  schema_version: 1
  kind: QualificationCompatibilityEnvelope
  authority: exact-pr-base-sha-controller
  head_controller_authority: forbidden
  root: .context/evidence/controller-compatibility/v1
  envelope_path: .context/evidence/controller-compatibility/v1/envelopes/<pr>/<head>/<digest>.json
  raw_proof_path: .context/evidence/controller-compatibility/v1/raw/<head>/<digest>.json
  performance_audit_path: .context/evidence/controller-compatibility/v1/audit/<head>/<digest>.json
  prior_head_artifacts: data-only-content-addressed-history
  canonicalization: sorted-keys-compact-ascii
  digest: sha256-of-canonical-envelope-without-envelope_sha256
  required_binding: [repository, pr, base_sha, head_sha, tree_sha]
  qualification_source: independently-validated-exact-base-proof
  required_qualification: [identity, raw_proof_sha256, performance_audit_sha256, gate_results]
  provenance: [controller_source, controller_path, controller_sha256, raw_evidence_kind]
  timestamp_role: informational-only
  self_declared_pass: forbidden
  missing_or_invalid: fail_closed

gate_records:
  required:
    - gate
    - status
    - duration_seconds
    - execution
    - cache_mode
    - scope
    - parallel_safe
    - parallel_group
    - started_at_monotonic_offset
  execution_values:
    - fresh
    - content-cache
    - parent-evidence
    - skipped
  conditional_content_cache_fields:
    - cache_key
    - input_digest
    - source_duration_seconds
    - cache_entries
  dynamic_runtime_cache_authority: forbidden

qualification_proof:
  authority: architecture.lock.yaml#machine_contracts.qualification_execution_policy
  required_before_merge: true
  exact_pass_evidence_required: true
  performance_audit_required: true

performance_campaign:
  authority: architecture.lock.yaml#machine_contracts.qualification_execution_policy
  repetitions_source: workflows.performance_campaign.repetitions
  bind_fields:
    - head_sha
    - head_tree_sha
    - qualification_identity
    - budgets
    - final_product_exact
    - final_verify_exact
  output: .context/performance/campaign-<sha>.json
  required_before_merge: false
  budget_failure_blocks_readiness: false
  native_dependency_caches_must_be_preserved: true
  synthetic_impacts_must_use_isolated_worktrees: true

remote_store:
  authority: harbor
  transport: oci-distribution
  artifact_type: application/vnd.ecommerce1.ci-evidence.v1
  tag_pattern: sha-<full-sha>
  immutable_digest_required_after_publish: true
  files:
    - evidence.json
    - evidence.sigstore.json

authentication:
  signer: cosign
  signature_required: true
  accepted_verification_modes:
    - public-key
    - keyless-certificate-identity-and-oidc-issuer
  verification_failure_behavior: full-reexecution
  missing_remote_evidence_behavior: full-reexecution

provenance:
  bind_fields:
    - base_sha
    - head_sha
    - exact_commit_evidence
    - affected_components
    - gates
    - head_tree_sha
    - qualification_identity
    - created_at_epoch
  remote_status_context: tekton/ecommerce-affected
  forge_status_binds_exact_commit_sha: true

metrics:
  record_gate_duration_seconds: true
  record_reused_source_duration_seconds: true
  report_executed_reused_skipped_counts: true
  compare_full_and_incremental_runs: true
  report_evidence_reuse_hit_ratio: true
  report_content_cache_hits: true
  distinguish_content_cache_from_evidence_reuse: true
  report_critical_path_estimate: true
  report_parallelization_headroom: true
  report_amdahl_priorities: true
  performance_audit_output_source: workflows.qualification_proof.performance_audit_output
  performance_audit_is_authoritative_for_pass: false
