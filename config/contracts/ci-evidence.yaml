version: 1
status: exact

evidence:
  schema_version: 5
  local_cache: .context/evidence/<sha>.json
  exact_commit_required: true
  pass_required_for_reuse: true
  direct_parent_only: true
  merge_commit_reuse: forbidden
  wrong_base_reuse: forbidden
  dirty_worktree_reuse: forbidden
  content_cache_authorizes_pass_reuse: false
  maximum_local_age_seconds: 86400
  qualification_identity_required: true
  commit_tree_required: true

gate_records:
  required:
    - gate
    - status
    - duration_seconds
    - execution
    - cache_mode
    - scope
    - parallel_safe
    - parallel_group
    - started_at_monotonic_offset
  execution_values:
    - fresh
    - content-cache
    - parent-evidence
    - skipped
  conditional_content_cache_fields:
    - cache_key
    - input_digest
    - source_duration_seconds
    - cache_entries
  dynamic_runtime_cache_authority: forbidden

qualification_proof:
  authority: architecture.lock.yaml#machine_contracts.qualification_execution_policy
  required_before_merge: true
  exact_pass_evidence_required: true
  performance_audit_required: true

performance_campaign:
  authority: architecture.lock.yaml#machine_contracts.qualification_execution_policy
  repetitions_source: workflows.performance_campaign.repetitions
  bind_fields:
    - head_sha
    - head_tree_sha
    - qualification_identity
    - budgets
    - final_product_exact
    - final_verify_exact
  output: .context/performance/campaign-<sha>.json
  required_before_merge: false
  budget_failure_blocks_readiness: false
  native_dependency_caches_must_be_preserved: true
  synthetic_impacts_must_use_isolated_worktrees: true

remote_store:
  authority: harbor
  transport: oci-distribution
  artifact_type: application/vnd.ecommerce1.ci-evidence.v1
  tag_pattern: sha-<full-sha>
  immutable_digest_required_after_publish: true
  files:
    - evidence.json
    - evidence.sigstore.json

authentication:
  signer: cosign
  signature_required: true
  accepted_verification_modes:
    - public-key
    - keyless-certificate-identity-and-oidc-issuer
  verification_failure_behavior: full-reexecution
  missing_remote_evidence_behavior: full-reexecution

provenance:
  bind_fields:
    - base_sha
    - head_sha
    - exact_commit_evidence
    - affected_components
    - gates
    - head_tree_sha
    - qualification_identity
    - created_at_epoch
  remote_status_context: tekton/ecommerce-affected
  forge_status_binds_exact_commit_sha: true

metrics:
  record_gate_duration_seconds: true
  record_reused_source_duration_seconds: true
  report_executed_reused_skipped_counts: true
  compare_full_and_incremental_runs: true
  report_evidence_reuse_hit_ratio: true
  report_content_cache_hits: true
  distinguish_content_cache_from_evidence_reuse: true
  report_critical_path_estimate: true
  report_parallelization_headroom: true
  report_amdahl_priorities: true
  performance_audit_output: .context/performance/<sha>.json
  performance_audit_is_authoritative_for_pass: false
