version: 1
status: exact
repository:
  model: modular-monorepo
  affected_only: true

authorities:
  forge: gitea
  ci: tekton
  gitops_cd: rancher-fleet
  progressive_delivery: argo-rollouts
  registry: harbor
  forbidden_parallel_ci:
    - woodpecker
    - github-actions
    - jenkins
    - gitlab-ci
    - drone
    - gitea-actions-as-ci

trigger_flow:
  source: gitea
  events:
    - push
    - pull_request
  transport: webhook
  receiver: tekton-eventlistener
  binding: tekton-triggerbinding
  template: tekton-triggertemplate
  output: tekton-pipelinerun
  implementation_root: platform/tekton/triggers
  webhook_authentication:
    required: true
    algorithm: hmac-sha256
    accepted_signature_headers:
      - X-Gitea-Signature
      - X-Hub-Signature-256
    secret_source: openbao-via-eso

source_checkout:
  owner: tekton-affected-pipeline
  task: platform/tekton/tasks/source-checkout.yaml
  repository_url_input: authenticated-webhook-repository-clone-url
  base_input: immutable-commit-sha
  head_input: immutable-commit-sha
  workspace_initial_state: empty
  exact_head_guard: repoctl-tekton-plan

gitea_actions:
  allowed_for_forge_automation: true
  ci_authority: false
  cd_authority: false
  may_trigger_tekton: false

routing:
  classifier: scripts/ci-affected.rb
  evidence_contract: config/contracts/ci-evidence.yaml
  dependency_contract: config/contracts/dependency-map.yaml
  ownership_contract: config/contracts/service-ownership.yaml
  public_api_contract: config/contracts/public-api-contracts.yaml

pipelines:
  global: platform/tekton/pipelines/global.yaml
  frontend: platform/tekton/pipelines/frontend.yaml
  go_service: platform/tekton/pipelines/go-service.yaml
  platform: platform/tekton/pipelines/platform.yaml
  affected: platform/tekton/pipelines/affected.yaml

component_classes:
  storefront:
    path: frontend/apps/storefront
    pipeline: frontend
    artifact: storefront
  admin:
    path: frontend/apps/admin
    pipeline: frontend
    artifact: admin
  go_services:
    path_pattern: services/<service>
    registry: config/contracts/service-ownership.yaml
    pipeline: go_service
    artifact_pattern: <service>
  terraform:
    path: platform/terraform
    pipeline: platform
  ansible:
    path: platform/ansible
    pipeline: platform

developer_automation:
  state_reconciliation: ansible
  stateless_controller: python
  specialized_validators: [ruby, python, go]
  shell_policy: forbidden
  shell_state_mutation_forbidden: true
  tekton_remains_ci_authority: true

developer_accelerators:
  bazel:
    role: local-verification-entrypoint
    source_of_truth: false
    ci_authority: false
    may_deploy: false
  nx:
    role: derived-contract-graph-visualization
    source_of_truth: false
    ci_authority: false
    may_deploy: false
  turborepo:
    role: frontend-task-scheduling-and-local-cache
    source_of_truth: false
    ci_authority: false
    may_deploy: false

rules:
  one_repository_does_not_imply_one_release: true
  independent_component_artifacts: true
  ci_must_not_deploy_workloads_directly: true
  gitops_digest_update_required: true
  immutable_oci_digests: true
  developer_accelerators_must_not_be_ci_authority: true
  developer_state_reconciliation_must_use_ansible: true
  repository_shell_automation_forbidden: true
  distributed_evidence_must_be_authenticated: true
  remote_ci_status_must_bind_exact_sha: true
