version: 1
kind: ExecutionEnvironmentPolicy
status: enforced
architecture_authority: architecture.lock.yaml
scope: repository-execution
authority_claims: [repository.execution.environments]
principles:
  static_qualification_must_not_require_container_runtime: true
  external_runtime_capabilities_may_block_runtime_profile_only: true
  repository_must_not_install_docker_daemon: true
environments:
  linux-native: {static: supported}
  wsl2:
    static: supported
    docker_runtime: {provider: docker-desktop-or-compatible, ownership: external}
  codex-cloud:
    static: supported
    docker_runtime: {requirement: optional-runtime, absence: platform-not-capable}
profiles:
  static: {external_runtime_required: false}
  runtime: {external_runtime_required: true}
