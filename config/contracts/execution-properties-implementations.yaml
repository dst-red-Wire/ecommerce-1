      - implements
      integrity:
      - verifies
      provenance:
      - produces_evidence
      verification:
      - produces_evidence
    mechanisms:
    - pinned-sources
    - checksum-verification
    - offline-input-bundle
    - immutable-image-digest
    gate: machine-image
    evidence:
      runtime_required: true
      producer: packer-build
