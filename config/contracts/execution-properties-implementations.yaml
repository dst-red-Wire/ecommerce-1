version: 1
kind: ExecutionPropertiesImplementations
status: enforced
policy_ref: config/contracts/execution-properties-policy.yaml
architecture_authority: architecture.lock.yaml
semantics: references-only
relationship_values:
- implements
- enforces
- verifies
- observes
- produces_evidence
- transports_evidence
evidence_model:
  declaration: policy-requirement
  implementation: mechanism-reference
  proof: runtime-record
  gate: fail-closed-proof-validation
  aggregation: qce-consumes-verified-proof
  status: roadmap-derives-from-gates
required_implementations:
- packer
- opentofu
- ansible
- packer_ansible_chain
- buildkit
- cosign
- fleet
- tekton
- harbor
- rke2
- cilium
- qce
