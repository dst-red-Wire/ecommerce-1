version: 1
kind: QualificationExecutionPolicy
status: enforced
architecture_authority: architecture.lock.yaml
scope: entire-repository

principles:
  single_execution_authority: true
  fail_closed_on_unknown_gate: true
  affected_only_by_default: true
  cache_is_acceleration_not_authority: true
  exact_sha_evidence_remains_authoritative: true
  dynamic_state_must_be_fresh: true

runtime_orchestration:
  enabled: true
  single_authority: true
  lifecycle:
    - resolve
    - capture
    - preflight
    - prepare
    - verify
    - execute
    - restore
    - verify_restore
    - evidence
  rules:
    preflight_before_mutation: required
    capture_initial_state: required
    bounded_mutations: required
    restore_on_success: required
    restore_on_failure: required
    restore_on_interrupt: required
    restore_verification: required
    fail_on_restore_failure: required
    tracked_source_mutation_for_evidence: forbidden
    evidence_root: .context
    secrets_in_evidence: forbidden
    dynamic_state_cache: forbidden
  mutation_classes:
    - none
    - local-ephemeral
    - local-virtualization
    - external-governed
    - production-governed
  external_paid_resources:
    implicit_creation: forbidden
  production:
    implicit_mutation: forbidden
    prepare_default: readonly
  lock:
    scope: host-user-global
    runtime_directory_env: XDG_RUNTIME_DIR
    runtime_relative_path: ecommerce-1/qualification-orchestration.lock
    fallback_relative_path: .cache/ecommerce-1/runtime/qualification-orchestration.lock
    timeout_seconds: 30
    tracked: false
    crash_safety: operating-system-advisory-lock
    owner: current-user
    directory_mode: "0700"
    file_mode: "0600"
  mutation_executor:
    owner: ansible
    playbook: platform/ansible/runtime-capability.yml
    persistence: forbidden
    direct_python_host_mutation: forbidden
  stale_state:
    detect_prior_incomplete_evidence: required
    recapture_current_state: required
    restore_from_prior_session: forbidden
  capabilities:
    docker-runtime:
      handler: docker-rootless
      requires: [ansible-runtime]
      mutation_class: local-ephemeral
      timeout_seconds: 30
      privilege: user-systemd
      global_lock: true
      operations:
        detector: docker-info-and-user-service
        preflight: non-mutating-rootless-ownership-check
        prepare: ansible-start-rootless-user-service-if-stopped
        verify: docker-info
        restore: ansible-restore-captured-user-service-state
        verify_restore: compare-captured-user-service-state
      evidence_fields: [satisfied, runtime, docker_host, endpoint_source, service_active, service_state, service_loaded, manager_reachable, socket_present]
    ip-forward:
      handler: ip-forward
      requires: [ansible-runtime]
      mutation_class: local-ephemeral
      timeout_seconds: 10
      privilege: root-or-sudo-noninteractive
      global_lock: true
      operations:
        detector: sysctl-read
        preflight: noninteractive-privilege-check-when-change-required
        prepare: ansible-set-one-if-required
        verify: sysctl-read-one
        restore: ansible-restore-captured-value
        verify_restore: compare-captured-value
      evidence_fields: [satisfied, value, readable]
    testcontainers:
      handler: dependency
      requires: [docker-runtime, ip-forward]
      mutation_class: none
      timeout_seconds: 1
      privilege: none
      global_lock: false
      operations:
        detector: dependency-closure
        preflight: dependency-closure
        prepare: none
        verify: dependency-closure
        restore: none
        verify_restore: none
      evidence_fields: [satisfied]
    virtualbox-runtime-available:
      handler: command
      requires: [wsl-windows-interop]
      mutation_class: local-virtualization
      timeout_seconds: 15
      privilege: none
      global_lock: true
      parameters:
        command: [/mnt/c/Program Files/Oracle/VirtualBox/VBoxManage.exe, --version]
      operations:
        detector: version-probe
        preflight: read-only-availability
        prepare: none
        verify: version-probe
        restore: no-host-resource-created
        verify_restore: no-host-resource-created
      evidence_fields: [satisfied, command, exit_code, output_matches]
    vagrant-runtime:
      handler: command
      requires: [virtualbox-runtime-available]
      mutation_class: none
      timeout_seconds: 15
      privilege: none
      global_lock: false
      parameters:
        command: [/mnt/c/Program Files/Vagrant/bin/vagrant.exe, --version]
      operations:
        detector: exact-version-probe
        preflight: read-only-availability
        prepare: none
        verify: exact-version-probe
        restore: none
        verify_restore: none
      evidence_fields: [satisfied, command, exit_code, output_matches]
    wsl-windows-interop:
      handler: wsl-interop
      requires: []
      mutation_class: none
      timeout_seconds: 10
      privilege: none
      global_lock: false
      operations:
        detector: windows-process-probe
        preflight: read-only-availability
        prepare: none
        verify: windows-process-probe
        restore: none
        verify_restore: none
      evidence_fields: [satisfied, wsl]
    memory-capacity:
      handler: memory
      requires: []
      mutation_class: none
      timeout_seconds: 2
      privilege: none
      global_lock: false
      operations:
        detector: proc-meminfo-physical-memory
        preflight: minimum-available-memory
        prepare: none
        verify: none
        restore: none
        verify_restore: none
      evidence_fields: [total_mib, available_mib]
    cpu-capacity:
      handler: cpu
      requires: []
      mutation_class: none
      timeout_seconds: 2
      privilege: none
      global_lock: false
      operations:
        detector: logical-cpu-count
        preflight: minimum-cpu-count
        prepare: none
        verify: none
        restore: none
        verify_restore: none
      evidence_fields: [available_count]
    disk-capacity:
      handler: disk
      requires: []
      mutation_class: none
      timeout_seconds: 2
      privilege: none
      global_lock: false
      operations:
        detector: filesystem-free-space
        preflight: minimum-free-space
        prepare: none
        verify: none
        restore: none
        verify_restore: none
      evidence_fields: [path, available_mib]
    ansible-runtime:
      handler: command
      requires: []
      mutation_class: none
      timeout_seconds: 15
      privilege: none
      global_lock: false
      parameters:
        command: [ansible-playbook, --version]
      operations:
        detector: version-probe
        preflight: read-only-availability
        prepare: none
        verify: version-probe
        restore: none
        verify_restore: none
      evidence_fields: [satisfied, command, exit_code]
    terraform-runtime:
      handler: command
      requires: []
      mutation_class: none
      timeout_seconds: 15
      privilege: none
      global_lock: false
      parameters:
        commands:
          - [tofu, version]
          - [terraform, version]
      operations:
        detector: version-probe
        preflight: read-only-availability
        prepare: none
        verify: version-probe
        restore: none
        verify_restore: none
      evidence_fields: [satisfied, command, exit_code]
    kubernetes-context:
      handler: kubernetes-context
      requires: []
      mutation_class: external-governed
      timeout_seconds: 15
      privilege: authenticated-client
      global_lock: false
      parameters:
        command: [kubectl, config, current-context]
      operations:
        detector: current-context-read
        preflight: authenticated-read-only-check
        prepare: readonly
        verify: current-context-read
        restore: none
        verify_restore: none
      evidence_fields: [satisfied, command, exit_code]
    container-registry-auth:
      handler: command
      requires: []
      mutation_class: external-governed
      timeout_seconds: 15
      privilege: authenticated-client
      global_lock: false
      operations:
        detector: caller-supplied-read-only-probe
        preflight: authenticated-read-only-check
        prepare: readonly
        verify: caller-supplied-read-only-probe
        restore: none
        verify_restore: none
      evidence_fields: [satisfied, command, exit_code]
    harbor-readiness:
      handler: command
      requires: [container-registry-auth]
      mutation_class: external-governed
      timeout_seconds: 20
      privilege: authenticated-client
      global_lock: false
      operations:
        detector: caller-supplied-read-only-probe
        preflight: authenticated-read-only-check
        prepare: readonly
        verify: caller-supplied-read-only-probe
        restore: none
        verify_restore: none
      evidence_fields: [satisfied, command, exit_code]
    tekton-readiness:
      handler: command
      requires: [kubernetes-context]
      mutation_class: external-governed
      timeout_seconds: 20
      privilege: authenticated-client
      global_lock: false
      operations:
        detector: caller-supplied-read-only-probe
        preflight: authenticated-read-only-check
        prepare: readonly
        verify: caller-supplied-read-only-probe
        restore: none
        verify_restore: none
      evidence_fields: [satisfied, command, exit_code]
    production-context:
      handler: command
      requires: [kubernetes-context]
      mutation_class: production-governed
      timeout_seconds: 15
      privilege: authenticated-readonly-client
      global_lock: false
      operations:
        detector: caller-supplied-read-only-probe
        preflight: authenticated-read-only-check
        prepare: readonly
        verify: caller-supplied-read-only-probe
        restore: none
        verify_restore: none
      evidence_fields: [satisfied, command, exit_code]

qualification_lifecycle:
  applies_to: every-qualification-workflow
  single_authority: config/contracts/qualification-execution-policy.yaml
  per_workflow_policy_duplication: forbidden
  phases:
    - development
    - freeze
    - qualification
    - complete
  registration:
    registry: workflows
    unregistered_authoritative_qualification: forbidden
    local_lifecycle_override: forbidden
  completed_proof_registration:
    registration_is_execution: false
    execute_entrypoint_on_registration: forbidden
    proof_binding: qualified-source-sha-and-invalidation-inputs
    metadata_only_registry_change_invalidates_runtime_proof: false
    reuse_until_invalidation_input_changes: true
  workflow_defaults:
    exact_sha_required: true
    clean_worktree_required: true
    freeze_before_authoritative_run: true
    source_change_after_freeze_invalidates_evidence: true
    evidence_must_not_modify_tracked_files: true
    stop_when_exit_criteria_pass: true
    post_pass_scope_expansion: forbidden
    non_blocking_findings: follow-up-work-item
    blocking_findings: return-to-development
  required_per_workflow:
    - owner
    - purpose
    - entrypoint
    - exit_criteria
    - evidence
  evidence:
    root: .context
    tracked: false
    exact_sha_binding_required: true
    source_mutation_for_evidence: forbidden
  authoritative_completion:
    applies_when: merge_authoritative=true
    same_sha_pass_replay: reuse-valid-evidence
    same_sha_failed_replay: requires-explicit-blocking-reason
    final_candidate_runs: 1
  waits:
    every_wait_must_be_bounded: true
    indefinite_wait: forbidden
  reruns:
    additional_final_run_requires:
      - source-change-new-sha
      - blocking-failure
      - evidence-expired-or-invalid
    non_blocking_improvement_creates_follow_up: true
  duplication:
    precommit_is_development_gate: true
    merge_authoritative_duplicate_full_gate_run_same_sha: forbidden
    non_merge_authoritative_measurement_repetitions: allowed-when-centrally-declared

execution:
  global_gate_order:
    - governance
    - runtime-efficiency
    - contracts
    - automation
    - security
  local_max_workers: 4
  python_unittest_method_shard_min_tests: 4
  ci_max_workers_env: ECOMMERCE_QUALIFICATION_MAX_WORKERS
  ci_max_workers_required: true
  global_parallelism: bounded
  component_parallelism: bounded
  stable_output_order: true

cache_modes:
  content-pass: deterministic PASS may be reused from the content-addressed qualification cache
  native-only: only tool-native caches may accelerate execution
  fresh: always execute
  forbidden: no cache of any kind may authorize skipping execution
  composed: aggregate gate whose child gates own cache decisions

gates:
  governance:
    scope: global
    parallel_safe: false
    cache_mode: composed
    dependencies: []
    command:
      action: governance
    ci_fanout: true
    owned_tests:
      - tests/test_architecture_authority.py
      - tests/test_commit_provenance.py
      - tests/test_qualification_cache.py
      - tests/test_qualification_execution_policy.py
      - tests/test_runtime_orchestration.py
      - tests/architecture_validator_test.rb
      - tests/observability_topology_test.rb
      - tests/ci_authority_test.rb
      - tests/ci_affected_test.rb
    tools: [python3, ruby, git]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
      - scripts/architecture_authority.py
      - scripts/validate-architecture.rb
      - scripts/validate-architecture-boundaries.rb
      - scripts/validate-service-policy-chain.rb
      - scripts/validate-service-mesh-policy.rb
      - scripts/validate-contract-consistency.rb
      - scripts/validate-observability.rb
    inputs:
      - architecture.lock.yaml
      - config/contracts/**/*
      - config/infrastructure/**/*
      - config/toolchain/**/*
      - contracts/**/*
      - docs/architecture/**/*
      - scripts/architecture_authority.py
      - scripts/validate-architecture.rb
      - scripts/validate-architecture-boundaries.rb
      - scripts/validate-service-policy-chain.rb
      - scripts/validate-service-mesh-policy.rb
      - scripts/validate-contract-consistency.rb
      - scripts/validate-observability.rb
      - tests/test_architecture_authority.py
      - tests/test_commit_provenance.py
      - tests/test_qualification_cache.py
      - tests/test_runtime_orchestration.py
      - tests/architecture_validator_test.rb
      - tests/observability_topology_test.rb
      - tests/ci_authority_test.rb
      - tests/ci_affected_test.rb
      - AGENTS.md
      - README.md
      - docs/api/README.md
      - docs/project/CODEX_HANDOFFS.md
  governance:authority:
    scope: internal
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    tools: [python3, git, ruby]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
      - scripts/architecture_authority.py
    inputs:
      - architecture.lock.yaml
      - config/contracts/**/*
      - config/infrastructure/**/*
      - scripts/architecture_authority.py
  "governance:validator:*":
    scope: internal
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    tools: [ruby]
    validators:
      - <target>
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - <target>
      - architecture.lock.yaml
      - config/contracts/**/*
      - config/infrastructure/**/*
      - contracts/**/*
  "governance:test:*":
    scope: internal
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    tools: [python3, ruby, git]
    validators:
      - <target>
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - <target>
      - architecture.lock.yaml
      - config/contracts/**/*
      - config/infrastructure/**/*
      - contracts/**/*
      - scripts/**/*.py
      - scripts/**/*.rb
  governance:documentation:
    scope: internal
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    tools: [python3]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - AGENTS.md
      - README.md
      - docs/api/README.md
      - docs/project/CODEX_HANDOFFS.md
      - scripts/repoctl.py
  runtime-efficiency:
    scope: global
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    command:
      action: runtime-efficiency
    ci_fanout: true
    owned_tests:
      - tests/runtime_efficiency_test.rb
      - tests/resource_sizing_test.rb
    tools: [python3, ruby]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
      - scripts/validate-runtime-efficiency.rb
      - scripts/resource-sizing.rb
    inputs:
      - architecture.lock.yaml
      - config/contracts/runtime-efficiency.yaml
      - frontend/go.mod
      - frontend/apps/storefront/main.go
      - frontend/apps/admin/main.go
      - frontend/internal/web/layout.templ
      - services/*/Containerfile
      - scripts/validate-runtime-efficiency.rb
      - scripts/resource-sizing.rb
      - tests/runtime_efficiency_test.rb
      - tests/resource_sizing_test.rb
  contracts:
    scope: global
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    command:
      action: contracts
      context_args: base-head
    ci_fanout: true
    owned_tests:
      - tests/openapi_validator_test.rb
      - tests/contract_consistency_test.rb
    tools: [python3, ruby, git, go, oasdiff, oapi-codegen]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
      - scripts/validate-openapi.rb
      - scripts/validate-contract-consistency.rb
      - scripts/validate-architecture.rb
    inputs:
      - architecture.lock.yaml
      - config/contracts/public-api-contracts.yaml
      - config/contracts/service-ownership.yaml
      - config/contracts/dependency-map.yaml
      - config/contracts/event-contracts.yaml
      - contracts/openapi/**/*
      - contracts/proto/**/*
      - scripts/validate-openapi.rb
      - scripts/validate-contract-consistency.rb
      - scripts/validate-architecture.rb
      - tests/openapi_validator_test.rb
      - tests/contract_consistency_test.rb
  automation:
    scope: global
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    command:
      action: automation-policy
    ci_fanout: true
    tools: [python3, git]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - .gitignore
      - BUILD.bazel
      - "**/*.sh"
      - platform/tekton/**/*
      - scripts/repoctl.py
  security:
    scope: global
    parallel_safe: true
    cache_mode: fresh
    dependencies: []
    command:
      action: security
    ci_fanout: true
    tools: [gitleaks, trivy, gosec, govulncheck, git]
    validators:
      - scripts/repoctl.py
    inputs:
      - architecture.lock.yaml
      - config/contracts/security-scan-policy.yaml
    fresh_prechecks:
      - exact-git-history-and-worktree-scan
  system:
    scope: component
    parallel_safe: false
    cache_mode: composed
    dependencies: []
    command:
      action: system
    tools: [python3, ruby, git]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - tests/**/*
      - scripts/**/*
  "system:test:*":
    scope: internal
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    tools: [python3, ruby, git]
    validators:
      - <target>
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - <target>
      - architecture.lock.yaml
      - config/contracts/**/*
      - config/infrastructure/**/*
      - contracts/**/*
      - frontend/**/*
      - platform/**/*
      - scripts/**/*
      - services/**/*
      - Makefile
      - BUILD.bazel
      - go.work
  platform:ansible:
    scope: component
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    command:
      action: ansible
    tools: [ansible-lint, ansible-playbook, ansible-galaxy]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - architecture.lock.yaml
      - config/contracts/source-quality-policy.yaml
      - config/contracts/toolchain-lock.json
      - platform/ansible/**/*
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    fresh_prechecks:
      - project-owned-collection-version-reconciliation
    runtime_capabilities:
      - ansible-runtime
  platform:terraform:
    scope: component
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    command:
      action: terraform
    tools: [tofu, terraform]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - architecture.lock.yaml
      - config/contracts/source-quality-policy.yaml
      - config/contracts/terraform-provider-lock.yaml
      - config/contracts/toolchain-lock.json
      - platform/terraform/**/*.tf
      - platform/terraform/**/*.tftpl
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    fresh_prechecks:
      - approved-terraform-executable-availability
      - canonical-provider-lock-contract
    runtime_capabilities:
      - terraform-runtime
  "frontend:*":
    scope: component
    parallel_safe: true
    cache_mode: native-only
    dependencies: []
    command:
      action: frontend
      static_args: [check]
      suffix_arg: true
    tools: [go, gofmt, templ]
    validators:
      - scripts/repoctl.py
    inputs:
      - frontend/**/*
      - architecture.lock.yaml
      - config/contracts/toolchain-lock.json
  "service-static:*":
    scope: internal
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    tools: [go, gofmt, sqlc]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - services/<target>/**/*
      - contracts/proto/**/*
      - go.work
      - architecture.lock.yaml
      - config/contracts/toolchain-lock.json
      - config/contracts/source-quality-policy.yaml
  "service:*":
    scope: component
    parallel_safe: true
    cache_mode: native-only
    dependencies: []
    command:
      action: service
      suffix_arg: true
    requires_path: services/<target>/go.mod
    tools: [go, gofmt]
    validators:
      - scripts/repoctl.py
    inputs:
      - services/<service>/**/*
      - go.work
      - architecture.lock.yaml
      - config/contracts/toolchain-lock.json
    runtime_capabilities:
      - name: testcontainers
        when:
          path_glob: services/<service>/**/*_test.go
          contains: testcontainers


workflows:
  qualification_proof:
    owner: quality-engineering
    purpose: merge-authoritative exact-SHA repository qualification
    entrypoint: scripts/repoctl.py qualification-proof
    exit_criteria:
      - verify-change-pass
      - exact-sha-evidence-valid
      - performance-audit-pass
    evidence:
      authoritative: .context/evidence/<sha>.json
      supplementary: .context/performance/<sha>.json
    verify_change_runs: 1
    performance_audit_runs: 1
    performance_audit_output: .context/performance/<sha>.json
    performance_campaign_required: false
    merge_authoritative: true
    runtime_capabilities:
      inherit_from_selected_gates: true
  rke2_local_virtualbox:
    owner: platform / M2.5 persistent MGMT bootstrap
    purpose: prove one disposable Rocky control plane can cold-install and start the pinned offline RKE2/Cilium stack under the canonical isolation boundary
    entrypoint: scripts/repoctl.py rke2-local-virtualbox-qualification --inputs .context/mgmt-vm-inputs.json
    exit_criteria:
      - fresh-rocky-own-kernel-systemd-selinux-enforcing
      - cold-offline-artifact-install-pass
      - rke2-node-ready-and-cilium-ready
      - nftables-output-and-forward-drop
      - public-egress-denied
      - tampered-artifact-rejected-before-install
      - symlink-safe-cleanup-pass
      - idempotent-server-replay-pass
      - make-ci-pass
      - exact-sha-code-review-pass
      - exact-sha-security-review-pass
    evidence:
      source: .context/mgmt-offline-vm/<name>/server-source.json
      runtime: .context/mgmt-offline-vm/<name>/rke2-result.json
      artifact: .context/mgmt-offline-vm/<name>/role-result.json
      tamper: .context/mgmt-offline-vm/<name>/tamper-result.json
    merge_authoritative: true
    runtime_capabilities:
      - name: memory-capacity
        parameters:
          minimum_mib:
            context: vm_memory
      - name: cpu-capacity
        parameters:
          minimum_count:
            context: vm_cpus
      - name: vagrant-runtime
        parameters:
          expected_stdout:
            context: vagrant_expected_stdout
    superseded_completion:
      superseded_by: rocky-10.2-packer-image-migration
      status: complete
      criteria_status: PASS
      proof_registration: existing-proof-no-rerun
