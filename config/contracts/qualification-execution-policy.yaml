version: 1
kind: QualificationExecutionPolicy
status: enforced
architecture_authority: architecture.lock.yaml
scope: entire-repository

principles:
  single_execution_authority: true
  fail_closed_on_unknown_gate: true
  affected_only_by_default: true
  cache_is_acceleration_not_authority: true
  exact_sha_evidence_remains_authoritative: true
  dynamic_state_must_be_fresh: true

qualification_lifecycle:
  applies_to: every-qualification-workflow
  single_authority: config/contracts/qualification-execution-policy.yaml
  per_workflow_policy_duplication: forbidden
  phases:
    - development
    - freeze
    - qualification
    - complete
  registration:
    registry: workflows
    unregistered_authoritative_qualification: forbidden
    local_lifecycle_override: forbidden
  completed_proof_registration:
    registration_is_execution: false
    execute_entrypoint_on_registration: forbidden
    proof_binding: qualified-source-sha-and-invalidation-inputs
    metadata_only_registry_change_invalidates_runtime_proof: false
    reuse_until_invalidation_input_changes: true
  workflow_defaults:
    exact_sha_required: true
    clean_worktree_required: true
    freeze_before_authoritative_run: true
    source_change_after_freeze_invalidates_evidence: true
    evidence_must_not_modify_tracked_files: true
    stop_when_exit_criteria_pass: true
    post_pass_scope_expansion: forbidden
    non_blocking_findings: follow-up-work-item
    blocking_findings: return-to-development
  required_per_workflow:
    - owner
    - purpose
    - entrypoint
    - exit_criteria
    - evidence
  evidence:
    root: .context
    tracked: false
    exact_sha_binding_required: true
    source_mutation_for_evidence: forbidden
  authoritative_completion:
    applies_when: merge_authoritative=true
    same_sha_pass_replay: reuse-valid-evidence
    same_sha_failed_replay: requires-explicit-blocking-reason
    final_candidate_runs: 1
  waits:
    every_wait_must_be_bounded: true
    indefinite_wait: forbidden
  reruns:
    additional_final_run_requires:
      - source-change-new-sha
      - blocking-failure
      - evidence-expired-or-invalid
    non_blocking_improvement_creates_follow_up: true
  duplication:
    precommit_is_development_gate: true
    merge_authoritative_duplicate_full_gate_run_same_sha: forbidden
    non_merge_authoritative_measurement_repetitions: allowed-when-centrally-declared

execution:
  global_gate_order:
    - governance
    - runtime-efficiency
    - contracts
    - automation
    - security
  local_max_workers: 4
  python_unittest_method_shard_min_tests: 4
  ci_max_workers_env: ECOMMERCE_QUALIFICATION_MAX_WORKERS
  ci_max_workers_required: true
  global_parallelism: bounded
  component_parallelism: bounded
  stable_output_order: true

cache_modes:
  content-pass: deterministic PASS may be reused from the content-addressed qualification cache
  native-only: only tool-native caches may accelerate execution
  fresh: always execute
  forbidden: no cache of any kind may authorize skipping execution
  composed: aggregate gate whose child gates own cache decisions

gates:
  governance:
    scope: global
    parallel_safe: false
    cache_mode: composed
    dependencies: []
    command:
      action: governance
    ci_fanout: true
    owned_tests:
      - tests/test_architecture_authority.py
      - tests/test_qualification_cache.py
      - tests/test_qualification_execution_policy.py
      - tests/architecture_validator_test.rb
      - tests/observability_topology_test.rb
      - tests/ci_authority_test.rb
      - tests/ci_affected_test.rb
    tools: [python3, ruby, git]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
      - scripts/architecture_authority.py
      - scripts/validate-architecture.rb
      - scripts/validate-architecture-boundaries.rb
      - scripts/validate-service-policy-chain.rb
      - scripts/validate-service-mesh-policy.rb
      - scripts/validate-contract-consistency.rb
      - scripts/validate-observability.rb
    inputs:
      - architecture.lock.yaml
      - config/contracts/**/*
      - config/infrastructure/**/*
      - config/toolchain/**/*
      - contracts/**/*
      - docs/architecture/**/*
      - scripts/architecture_authority.py
      - scripts/validate-architecture.rb
      - scripts/validate-architecture-boundaries.rb
      - scripts/validate-service-policy-chain.rb
      - scripts/validate-service-mesh-policy.rb
      - scripts/validate-contract-consistency.rb
      - scripts/validate-observability.rb
      - tests/test_architecture_authority.py
      - tests/test_qualification_cache.py
      - tests/architecture_validator_test.rb
      - tests/observability_topology_test.rb
      - tests/ci_authority_test.rb
      - tests/ci_affected_test.rb
      - AGENTS.md
      - README.md
      - docs/api/README.md
      - docs/project/CODEX_HANDOFFS.md
  governance:authority:
    scope: internal
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    tools: [python3, git, ruby]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
      - scripts/architecture_authority.py
    inputs:
      - architecture.lock.yaml
      - config/contracts/**/*
      - config/infrastructure/**/*
      - scripts/architecture_authority.py
  "governance:validator:*":
    scope: internal
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    tools: [ruby]
    validators:
      - <target>
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - <target>
      - architecture.lock.yaml
      - config/contracts/**/*
      - config/infrastructure/**/*
      - contracts/**/*
  "governance:test:*":
    scope: internal
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    tools: [python3, ruby, git]
    validators:
      - <target>
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - <target>
      - architecture.lock.yaml
      - config/contracts/**/*
      - config/infrastructure/**/*
      - contracts/**/*
      - scripts/**/*.py
      - scripts/**/*.rb
  governance:documentation:
    scope: internal
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    tools: [python3]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - AGENTS.md
      - README.md
      - docs/api/README.md
      - docs/project/CODEX_HANDOFFS.md
      - scripts/repoctl.py
  runtime-efficiency:
    scope: global
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    command:
      action: runtime-efficiency
    ci_fanout: true
    owned_tests:
      - tests/runtime_efficiency_test.rb
      - tests/resource_sizing_test.rb
    tools: [python3, ruby]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
      - scripts/validate-runtime-efficiency.rb
      - scripts/resource-sizing.rb
    inputs:
      - architecture.lock.yaml
      - config/contracts/runtime-efficiency.yaml
      - frontend/go.mod
      - frontend/apps/storefront/main.go
      - frontend/apps/admin/main.go
      - frontend/internal/web/layout.templ
      - services/*/Containerfile
      - scripts/validate-runtime-efficiency.rb
      - scripts/resource-sizing.rb
      - tests/runtime_efficiency_test.rb
      - tests/resource_sizing_test.rb
  contracts:
    scope: global
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    command:
      action: contracts
      context_args: base-head
    ci_fanout: true
    owned_tests:
      - tests/openapi_validator_test.rb
      - tests/contract_consistency_test.rb
    tools: [python3, ruby, git, go, oasdiff, oapi-codegen]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
      - scripts/validate-openapi.rb
      - scripts/validate-contract-consistency.rb
      - scripts/validate-architecture.rb
    inputs:
      - architecture.lock.yaml
      - config/contracts/public-api-contracts.yaml
      - config/contracts/service-ownership.yaml
      - config/contracts/dependency-map.yaml
      - config/contracts/event-contracts.yaml
      - contracts/openapi/**/*
      - scripts/validate-openapi.rb
      - scripts/validate-contract-consistency.rb
      - scripts/validate-architecture.rb
      - tests/openapi_validator_test.rb
      - tests/contract_consistency_test.rb
  automation:
    scope: global
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    command:
      action: automation-policy
    ci_fanout: true
    tools: [python3, git]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - .gitignore
      - BUILD.bazel
      - "**/*.sh"
      - platform/tekton/**/*
      - scripts/repoctl.py
  security:
    scope: global
    parallel_safe: true
    cache_mode: fresh
    dependencies: []
    command:
      action: security
    ci_fanout: true
    tools: [gitleaks, git]
    validators:
      - scripts/repoctl.py
    inputs:
      - architecture.lock.yaml
      - config/contracts/security-scan-policy.yaml
    fresh_prechecks:
      - exact-git-history-and-worktree-scan
  system:
    scope: component
    parallel_safe: false
    cache_mode: composed
    dependencies: []
    command:
      action: system
    tools: [python3, ruby, git]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - tests/**/*
      - scripts/**/*
  "system:test:*":
    scope: internal
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    tools: [python3, ruby, git]
    validators:
      - <target>
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - <target>
      - architecture.lock.yaml
      - config/contracts/**/*
      - config/infrastructure/**/*
      - contracts/**/*
      - frontend/**/*
      - platform/**/*
      - scripts/**/*
      - services/**/*
      - Makefile
      - BUILD.bazel
      - go.work
  platform:ansible:
    scope: component
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    command:
      action: ansible
    tools: [ansible-lint, ansible-playbook, ansible-galaxy]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - architecture.lock.yaml
      - config/contracts/source-quality-policy.yaml
      - config/contracts/toolchain-lock.json
      - platform/ansible/**/*
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    fresh_prechecks:
      - project-owned-collection-version-reconciliation
  platform:terraform:
    scope: component
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    command:
      action: terraform
    tools: [tofu, terraform]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - architecture.lock.yaml
      - config/contracts/source-quality-policy.yaml
      - config/contracts/terraform-provider-lock.yaml
      - config/contracts/toolchain-lock.json
      - platform/terraform/**/*.tf
      - platform/terraform/**/*.tftpl
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    fresh_prechecks:
      - approved-terraform-executable-availability
      - canonical-provider-lock-contract
  "frontend:*":
    scope: component
    parallel_safe: true
    cache_mode: native-only
    dependencies: []
    command:
      action: frontend
      static_args: [check]
      suffix_arg: true
    tools: [go, gofmt, templ]
    validators:
      - scripts/repoctl.py
    inputs:
      - frontend/**/*
      - architecture.lock.yaml
      - config/contracts/toolchain-lock.json
  "service-static:*":
    scope: internal
    parallel_safe: true
    cache_mode: content-pass
    dependencies: []
    tools: [go, gofmt, sqlc]
    validators:
      - scripts/repoctl.py
      - scripts/qualification_cache.py
    inputs:
      - services/<target>/**/*
      - go.work
      - architecture.lock.yaml
      - config/contracts/toolchain-lock.json
      - config/contracts/source-quality-policy.yaml
  "service:*":
    scope: component
    parallel_safe: true
    cache_mode: native-only
    dependencies: []
    command:
      action: service
      suffix_arg: true
    requires_path: services/<target>/go.mod
    tools: [go, gofmt]
    validators:
      - scripts/repoctl.py
    inputs:
      - services/<service>/**/*
      - go.work
      - architecture.lock.yaml
      - config/contracts/toolchain-lock.json
    fresh_prechecks:
      - docker-runtime-when-testcontainers-are-used


workflows:
  qualification_proof:
    owner: quality-engineering
    purpose: merge-authoritative exact-SHA repository qualification
    entrypoint: scripts/repoctl.py qualification-proof
    exit_criteria:
      - verify-change-pass
      - exact-sha-evidence-valid
      - performance-audit-pass
    evidence:
      authoritative: .context/evidence/<sha>.json
      supplementary: .context/performance/<sha>.json
    verify_change_runs: 1
    performance_audit_runs: 1
    performance_audit_output: .context/performance/<sha>.json
    performance_campaign_required: false
    merge_authoritative: true
  rke2_local_virtualbox:
    owner: platform / M2.5 persistent MGMT bootstrap
    purpose: prove one disposable Rocky control plane can cold-install and start the pinned offline RKE2/Cilium stack under the canonical isolation boundary
    entrypoint: scripts/repoctl.py rke2-local-virtualbox-qualification --inputs .context/mgmt-vm-inputs.json
    exit_criteria:
      - fresh-rocky-own-kernel-systemd-selinux-enforcing
      - cold-offline-artifact-install-pass
      - rke2-node-ready-and-cilium-ready
      - nftables-output-and-forward-drop
      - public-egress-denied
      - tampered-artifact-rejected-before-install
      - symlink-safe-cleanup-pass
      - idempotent-server-replay-pass
      - make-ci-pass
      - exact-sha-code-review-pass
      - exact-sha-security-review-pass
    evidence:
      source: .context/mgmt-offline-vm/<name>/server-source.json
      runtime: .context/mgmt-offline-vm/<name>/rke2-result.json
      artifact: .context/mgmt-offline-vm/<name>/role-result.json
      tamper: .context/mgmt-offline-vm/<name>/tamper-result.json
    merge_authoritative: true
    completion:
      status: complete
      criteria_status: PASS
      proof_registration: existing-proof-no-rerun
      qualified_source_sha: 84cf01601aa336f0cdd2d1899d764437294fbfe6
      merged_by_pr: 128
      merge_commit_sha: 088b576dac43cb17e304967e3e58433499760fa9
      provenance:
        pull_request: https://github.com/dst-red-Wire/ecommerce-1/pull/128
        code_review: https://github.com/dst-red-Wire/ecommerce-1/pull/128#issuecomment-5754280746
        security_review: https://github.com/dst-red-Wire/ecommerce-1/pull/128#issuecomment-5754280831
        approved_manifest_sha256: 738a5cd2aa1be1eb93b08247193c1585574ad1668650993226eafe3f3cfa0bad
      invalidation_inputs:
        - config/artifacts/mgmt-rke2-offline-v1.37.0-rke2r1.lock.json
        - config/infrastructure/mgmt-bootstrap.yaml
        - config/infrastructure/network-plan.yaml
        - config/contracts/toolchain-lock.json
        - config/toolchain/versions.env
        - platform/ansible/requirements.yml
        - platform/ansible/roles/mgmt_offline_artifacts
        - platform/ansible/roles/mgmt_private_network
        - platform/ansible/roles/rke2_server
        - platform/ansible/tests/mgmt_offline_vm
        - scripts/build_mgmt_airgap_bundle.py
        - scripts/mgmt_airgap.py
        - tests/test_ansible_mgmt_private_network.py
        - tests/test_mgmt_airgap.py
        - tests/test_mgmt_airgap_bundle.py
        - tests/test_mgmt_offline_vm.py
  rke2_local_ha:
    owner: platform / M2.5 persistent MGMT bootstrap
    purpose: prove six simultaneous local Rocky nodes with three RKE2 control planes, three workers, HAProxy registration/API endpoint, embedded-etcd quorum, snapshot, one-control-plane loss/recovery, Cilium multinode, and simulated internal DNS/NTP without claiming production capacity
    entrypoint: scripts/repoctl.py rke2-local-ha-qualification
    exit_criteria:
      - six-rocky-vms-simultaneously-running
      - exact-pinned-rke2-offline-installation
      - three-control-planes-ready
      - third-control-plane-joined-through-haproxy
      - embedded-etcd-three-members
      - embedded-etcd-quorum-survives-one-control-plane-loss
      - stopped-control-plane-recovers
      - haproxy-fixed-registration-and-api-endpoint
      - on-demand-etcd-snapshot-created
      - cilium-ready-on-six-nodes
      - at-least-two-workers-joined-through-ha-endpoint
      - simulated-internal-dns-pass-on-all-nodes
      - simulated-internal-ntp-pass-on-all-nodes
      - public-egress-denied-on-all-nodes
      - exact-sha-source-evidence-pass
    evidence:
      authoritative: .context/mgmt-ha/<sha>/result.json
      source: .context/mgmt-ha/<sha>/source.sha256
      runtime_log: .context/mgmt-ha/<sha>/cluster.log
    merge_authoritative: true
    state_changing: true
    local_only: true
    capacity_production_claim: false
    real_provider_network_claim: false
    physical_failure_claim: false
  tekton_proof:
    owner: cloud-platform
    purpose: state-changing management-plane proof of exact Tekton execution, signed Harbor evidence round-trip, and direct-parent reuse
    entrypoint: scripts/repoctl.py tekton-proof --runtime-config <path> --base-sha <sha> --parent-sha <sha> --head-sha <sha>
    exit_criteria:
      - parent-pipelinerun-pass
      - child-pipelinerun-pass
      - signed-harbor-evidence-authenticated
      - exact-head-evidence-pass
      - direct-parent-product-reuse-proven
    evidence:
      runtime: .context/runtime/tekton-proof/<sha>.json
    merge_authoritative: false
    state_changing: true
    completion_requires_remote_readback: true
  performance_campaign:
    owner: quality-engineering
    purpose: non-merge-authoritative performance characterization
    entrypoint: scripts/repoctl.py perf-campaign
    exit_criteria:
      - configured-repetitions-complete
      - all-performance-budgets-pass
    evidence:
      authoritative: .context/performance/campaign-<sha>.json
    repetitions: 3
    merge_authoritative: false
    blocking_for_campaign_result: true

performance:
  baselines_seconds:
    system: 110.054
    governance: 86.060
    platform:ansible: 28.639
    service:product: 14.821
  campaign:
    cold_clears_qualification_content_cache_only: true
    preserve_dependency_and_native_tool_caches: true
    scenarios:
      - cold-verify-change
      - warm-verify-change
      - affected-product
      - affected-governance
  budgets_seconds:
    cold_verify_change_wall_max: 90
    warm_verify_change_wall_max: 30
    affected_product_wall_max: 30
    affected_governance_wall_max: 30
    service_product_warm_wall_max: 15
    system_warm_wall_max: 2
    governance_warm_wall_max: 2
    ansible_warm_wall_max: 5
  regression:
    compare_median: true
    evidence_required: true
    fail_on_budget_regression: true

dynamic_state:
  always_fresh:
    - git-status
    - current-head-sha
    - remote-ci-state
    - review-state
    - docker-runtime-state
    - kubernetes-runtime-state
    - network-state
    - secrets-and-authentication
    - provisioning-state
