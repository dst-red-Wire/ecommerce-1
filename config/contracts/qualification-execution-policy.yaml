performance:
  baselines_seconds:
    system: 110.054
    governance: 86.060
    platform:ansible: 28.639
    service:product: 14.821
  campaign:
    cold_clears_qualification_content_cache_only: true
    preserve_dependency_and_native_tool_caches: true
    scenarios:
      - cold-verify-change
      - warm-verify-change
      - affected-product
      - affected-governance
  budgets_seconds:
    cold_verify_change_wall_max: 90
    warm_verify_change_wall_max: 30
    affected_product_wall_max: 30
    affected_governance_wall_max: 30
    service_product_warm_wall_max: 15
    system_warm_wall_max: 2
    governance_warm_wall_max: 2
    ansible_warm_wall_max: 5
  regression:
    compare_median: true
    evidence_required: true
    fail_on_budget_regression: true

dynamic_state:
  always_fresh:
    - git-status
    - current-head-sha
    - remote-ci-state
    - review-state
    - docker-runtime-state
    - kubernetes-runtime-state
    - network-state
    - secrets-and-authentication
    - provisioning-state
