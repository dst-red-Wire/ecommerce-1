version: 1
kind: BuildReproducibilityPolicy
status: enforced
architecture_authority: architecture.lock.yaml
scope: entire-repository
authority_claims:
  - repository.build.reproducibility
architecture_refs:
  promotion: architecture.lock.yaml#developer_platform.promotion
  image_immutability: architecture.lock.yaml#supply_chain
principles:
  pinned_toolchain: required
  dependency_locks: required
  source_mutation_during_qualification: forbidden
inputs:
  toolchain: architecture.lock.yaml#machine_contracts.toolchain_lock
  dependencies: architecture.lock.yaml#machine_contracts.dependency_lock_policy
  source_quality: architecture.lock.yaml#machine_contracts.source_quality_policy
outputs:
  immutable_artifact_identity: required
  exact_source_sha: required
