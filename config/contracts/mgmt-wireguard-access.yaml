version: 1
status: exact
purpose: operator-access-to-permanent-mgmt

gateway:
  node: wg-01
  trust_zone: Z5
  lifecycle: persistent
  provider: hetzner-cloud
  kubernetes_member: false

network:
  source: config/infrastructure/network-plan.yaml#wireguard.mgmt
  public_endpoint_address: provider-runtime-output
  protocol: udp
  listen_port_source: config/infrastructure/network-plan.yaml#wireguard.mgmt.endpoint.listen_port

access:
  identity_realm: workforce
  customer_identity: forbidden
  privileged_authentication: hardware-backed-webauthn-passkeys
  default_forwarding: deny
  route_source: config/infrastructure/network-plan.yaml#wireguard.mgmt.allowed_routes
  break_glass: separately-controlled

secrets:
  git: forbidden
  gateway_private_key: runtime-only
  peer_key_material: runtime-only
  injection: approved-secret-channel

ownership:
  provider_vm_network_firewall: terraform
  rocky_wireguard_routing_firewall: ansible
  kubernetes: none

human_gates:
  provider_apply: required
  public_ingress_activation: required
  routing_change: required
  peer_or_key_change: required

threat_model:
  internet_scanning:
    boundary: Z0-to-Z5
    controls:
      - single-udp-wireguard-endpoint
      - default-deny-provider-firewall
      - no-public-management-services
  stolen_operator_key:
    boundary: operator-to-Z5
    controls:
      - per-operator-peer-identity
      - revocation-by-peer-removal
      - workforce-iam-authorized-issuance
  overbroad_routes:
    boundary: WireGuard-to-MGMT
    controls:
      - mgmt-only-allowed-routes
      - default-deny-forwarding
      - no-pod-service-route
  gateway_compromise:
    boundary: wg-01-to-Z5
    controls:
      - dedicated-non-kubernetes-gateway
      - least-privilege-host
      - audited-operator-actions
      - rebuild-not-clean
  break_glass_misuse:
    boundary: break-glass-to-Z5
    controls:
      - separate-address-pool
      - separate-control
      - audited-activation
      - human-authorization
