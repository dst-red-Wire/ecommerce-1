version: 2
status: exact
services:
  catalog:
    db: catalog-db
    owns: [category-tree, assortment, presentation-metadata]
    sync_dependencies: [product, pricing, inventory]
  product:
    db: product-db
    owns: [products, skus, attributes, base-product-facts]
    sync_dependencies: []
  inventory:
    db: inventory-db
    owns: [stock, reservations, adjustments]
    sync_dependencies: []
  cart:
    db: cart-db
    owns: [cart-state, cart-intent]
    sync_dependencies: [pricing, inventory, product]
  checkout:
    db: checkout-db
    owns: [checkout-session, checkout-validation-state, checkout-orchestration]
    sync_dependencies: [cart, pricing, tax, inventory, fraud-risk, shipping, order]
  pricing:
    db: pricing-db
    owns: [price-rules, promotion-rules, rule-versions]
    sync_dependencies: [product]
  tax:
    db: tax-db
    owns: [tax-rules, tax-rule-versions]
    sync_dependencies: []
  order:
    db: order-db
    owns: [orders, immutable-order-snapshot, order-lifecycle]
    sync_dependencies: []
  payment:
    db: payment-db
    owns: [psp-authorization, capture-state, refund-state]
    sync_dependencies: [stripe]
  fulfillment:
    db: fulfillment-db
    owns: [fulfillment-orders, allocation-state, pick-pack-state, fulfillment-lifecycle]
    sync_dependencies: [inventory, shipping]
  shipping:
    db: shipping-db
    owns: [shipment-creation, carrier-handoff]
    sync_dependencies: [carrier-adapters]
  tracking:
    db: tracking-db
    owns: [tracking-timeline]
    sync_dependencies: [shipping]
  returns:
    db: returns-db
    owns: [return-rma-lifecycle]
    sync_dependencies: [order, shipping]
  billing:
    db: billing-db
    owns: [invoices, credit-notes, e-invoicing-state]
    sync_dependencies: [order, payment, qonto-pa]
  fraud-risk:
    db: fraud-db
    owns: [risk-decisions, manual-review-queue]
    sync_dependencies: []
  search:
    db: null
    owns: [search-projection]
    authoritative: false
    sync_dependencies: []
  review:
    db: review-db
    owns: [reviews, moderation-state]
    sync_dependencies: [product, user-profile]
  user-profile:
    db: user-profile-db
    owns: [minimal-profile, preferences, privacy-workflow-metadata]
    sync_dependencies: [keycloak-reference]
  notification:
    db: notification-db
    owns: [notification-intent, delivery-attempts, delivery-status]
    sync_dependencies: []
forbidden:
  services: []
  cross_database_reads: true
  cross_service_foreign_keys: true
rules:
  search_authoritative: false
  redis_authoritative: false
  rabbitmq_authoritative_business_state: false
  keycloak_owns_authentication_identity: true
  checkout_owns_checkout_orchestration: true
  order_owns_durable_order_lifecycle: true
  fulfillment_owns_fulfillment_orchestration: true
