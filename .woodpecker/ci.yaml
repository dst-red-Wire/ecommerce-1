when:
  - event: [push, pull_request, manual]

steps:
  - name: governance
    image: ruby@sha256:c5a5064d190055633011c03aa800170cc36945ff3afb5f6c915329f92d6f1e00
    commands:
      - ./scripts/ci-governance.sh

  - name: shellcheck
    image: koalaman/shellcheck-alpine@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
    commands:
      - shellcheck scripts/*.sh

  - name: architecture-tests
    image: ruby@sha256:c5a5064d190055633011c03aa800170cc36945ff3afb5f6c915329f92d6f1e00
    commands:
      - ruby -Itest tests/architecture_validator_test.rb

  - name: secrets
    image: zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
    commands:
      - gitleaks git --config .gitleaks.toml --redact --no-banner .
