version: 5
status: locked-for-build
project: ecommerce

repository_governance:
  scope: entire-repository
  transverse_rule_contract:
    source_of_truth: architecture.lock.yaml
    rule_definition: central-contract-only
    enforcement: generic-validator
    per_file_rule_propagation: forbidden
    consumer_changes: only-if-required-to-consume-contract
  owner_authorization:
    syntax: "/owner-authorization approve scope=<scope> sha=<exact-head-sha>"
    decision_authority: repository-owner
    recording_agent: ChatGPT
    recording_requires_explicit_owner_instruction: true
    sha_binding: exact
    scope_binding: exact
    head_change: authorization-expired
    absence_or_mismatch: block

business:
  services:
    - catalog
    - product
    - inventory
    - cart
    - checkout
    - pricing
    - tax
    - order
    - payment
    - fulfillment
    - shipping
    - tracking
    - returns
    - billing
    - fraud-risk
    - search
    - review
    - user-profile
    - notification
  frontends:
    - storefront
    - admin
  frontend_runtime:
    language: go
    module: frontend
    module_file: frontend/go.mod
    rendering: templ
    interactions: htmx
    runtime_nodejs: false
    migration_source: nextjs-react-node
  forbidden_services: []

platform:
  kubernetes: rke2
  node_os: rocky-linux-10.2
  cni: cilium
  mesh: istio
  gitops: rancher-fleet
  ci: tekton
  progressive_delivery: argo-rollouts
  registry: harbor
  secrets: openbao
  external_secrets: eso
  workload_identity: spire
  iam: keycloak
  runtime_security: tetragon
  infrastructure_api: crossplane
  autoscaling:
    synchronous_pods: kubernetes-hpa
    event_driven_pods: keda
    certified_nodes: fixed
    preprod_perf_burst: gate-only

management_plane:
  provider: hetzner-cloud
  lifecycle: persistent
  private_block: 10.243.0.0/16
  kubernetes: rke2
  forge: gitea
  ci: tekton
  registry: harbor
  gitops: rancher-fleet
  developer_portal: backstage
  bootstrap:
    opentofu: true
    ansible: true
    requires_human_apply_gate: true

developer_platform:
  status: contract-locked-in-m1-implemented-from-m4
  scope: management-plane
  principles:
    portal: backstage
    catalog: backstage-software-catalog
    source_of_truth: git
    change_unit: pull-request
    forge: gitea
    ci: tekton
    registry: harbor
    gitops: rancher-fleet
    infrastructure_api: crossplane
    progressive_delivery: argo-rollouts
    foundation_iac: opentofu
  runtime_boundary:
    commerce_runtime_nodejs: forbidden
    backstage_management_plane_nodejs: allowed-required
    backstage_only_exception: true
  backstage_pr_contract:
    role: request-interface
    allowed_operations:
      - read-catalog
      - create-branch
      - create-commit
      - create-pull-request
      - read-pull-request
    forbidden_operations:
      - direct-main-write
      - force-push
      - approve-pull-request
      - merge-pull-request
      - tofu-apply
      - kubectl-apply
      - crossplane-apply
      - direct-workload-deploy
      - direct-environment-promotion
    gitea_pull_request_action: ecommerce:gitea:pull-request
  golden_paths:
    status: contract-locked-in-m1-implemented-from-m4
    implementation_milestone: M4-platform-baseline
    proof_milestone: M5-commerce-vertical-slice
    change_authority: git-pull-request
    properties:
      - safe-by-default
      - secure-by-default
      - observable-by-default
      - versioned
      - reproducible
      - policy-compliant
    request_kinds:
      - new-service
      - new-api
      - new-database
      - new-event-topic
      - new-secret
      - new-workload
      - new-environment
      - new-slo-dashboard
      - new-dependency
  developer_hub:
    implementation: backstage
    status: contracted
    implementation_milestone: M4-platform-baseline
    proof_milestone: M5-commerce-vertical-slice
    exposes:
      - catalog
      - ownership
      - templates
      - golden-paths
      - documentation
      - qce-status
      - slo-error-budget
      - ci-status
      - security-state
      - deployment-state
      - dependencies
      - platform-requests
      - promises
      - multi-cluster-environments
    mutation_authority: developer_platform.backstage_pr_contract
  platform_orchestrator:
    implementation: kratix-oss
    status: contracted
    implementation_milestone: M4-platform-baseline
    proof_milestone: M5-commerce-vertical-slice
    role: promise-and-platform-request-orchestration
    request_source: developer-hub
    machine_contract: architecture.lock.yaml#machine_contracts.kratix_platform
    state_store: gitea-gitstatestore
    deployment_authority: rancher-fleet
    manifest_composition: kustomize
    package_format: helm
    target_runtime: rke2
    destinations: [lab, preprod, prod]
    direct_cluster_apply: forbidden
    bundled_flux: forbidden
    bundled_object_store: forbidden
  git_contract:
    default_branch: main
    request_branch_pattern: platform/<request-kind>/<component>/<request-id>
    request_path_pattern: platform/requests/<request-id>.yaml
    force_push: forbidden
    direct_default_branch_write: forbidden
  pull_request_contract:
    required: true
    exact_head_sha_required: true
    human_review_required: true
    required_context:
      - request-id
      - component
      - request-kind
      - exact-head-sha
      - expected-infrastructure-impact
      - immutable-image-digest
      - preview-state
      - preview-url-when-ready
      - cleanup-policy
  platform_request_api:
    api_version: platform.ecommerce.io/v1alpha1
    kind: PlatformRequest
    authoritative_representation: git-file
    path_pattern: platform/requests/<request-id>.yaml
    required_fields:
      - metadata.name
      - spec.requester.entityRef
      - spec.component.entityRef
      - spec.request.kind
      - spec.request.operation
      - spec.lifecycle.owner
  preview_environment_api:
    api_version: platform.ecommerce.io/v1alpha1
    kind: PreviewEnvironment
    lifecycle_owner: pull-request
    create_on:
      - pull-request-opened
      - pull-request-updated
    delete_on:
      - pull-request-closed
      - pull-request-merged
    unique_url_required: true
  execution_contract:
    plan_before_apply: required
    mutating_platform_action_requires_git_change: true
    tekton_direct_workload_deploy: forbidden
    tekton_outputs:
      - qualification-evidence
      - immutable-oci-artifact
      - infrastructure-impact-plan
      - gitops-desired-state-change
    harbor_reference: immutable-digest
    gitops_desired_state_required: true
    fleet_reconciles_git: true
    crossplane_materializes_platform_api: true
  infrastructure_ownership:
    opentofu: foundation
    crossplane: self-service-platform-resources
  preview_lifecycle:
    creation: gitops-reconciliation
    cleanup: gitops-reconciliation
    cleanup_trigger:
      - pull-request-closed
      - pull-request-merged
    direct_runtime_delete: forbidden
  promotion:
    strategy: build-once-promote-many
    rebuild_between_preview_preprod_prod: forbidden
    same_digest_required: true
    environment_change: gitops-only
  quality_cloud_engineering:
    status: contract-locked-in-m1
    scope: platform-operating-model
    implementation_milestone: M4-platform-baseline
    proof_milestone: M5-commerce-vertical-slice
    sector_count: 9
    sectors:
      continuous_testing:
        owner: quality-engineering
        input: exact-head-sha-and-affected-set
        output: qualification-result
        evidence: exact-sha-qualification-evidence
      test_first:
        owner: quality-engineering
        input: behavioral-or-contract-change
        output: regression-test-contract
        evidence: failing-before-passing-after-or-equivalent-regression-proof
      test_strategy:
        owner: quality-engineering
        input: risk-and-affected-components
        output: selected-test-levels
        evidence: impact-to-test-routing-record
      automation:
        owner: cloud-platform
        input: approved-git-change
        output: reproducible-automated-execution
        evidence: tekton-run-and-gitops-state
      monitoring_observability:
        owner: cloud-platform
        input: running-workload-and-platform
        output: metrics-logs-traces-alerts
        evidence: queryable-telemetry-and-slo-signals
      release_governance_automation:
        owner: cloud-platform
        input: immutable-oci-digest-and-approved-git-state
        output: governed-environment-promotion
        evidence: digest-provenance-and-promotion-record
      golden_path:
        owner: developer-experience
        input: platform-capability-request
        output: standardized-pr-change
        evidence: generated-pr-conformance
      developer_hub:
        owner: developer-experience
        input: catalog-and-platform-capabilities
        output: backstage-self-service-interface
        evidence: catalog-template-and-action-conformance
      measuring_engineering:
        owner: developer-experience
        input: pr-ci-preview-release-events
        output: engineering-performance-metrics
        evidence: reproducible-metric-records
    cross_cutting:
      security:
        owner: security-engineering
        applies_to_all_sectors: true
        evidence_required: security-review-policy-and-runtime-controls
      culture:
        owner: platform-and-product-teams
        applies_to_all_sectors: true
        explicit_ownership_required: true
        documentation_as_code_required: true
      data_driven:
        owner: developer-experience
        applies_to_all_sectors: true
        decision_model:
          - observe
          - measure
          - detect
          - hypothesis
          - small-experiment
          - measure-outcome
          - keep-rollback-improve
          - standardise
        measurement_owner: measuring_engineering
        evidence_required: true
        continuous_improvement_required: true
        small_batch_delivery: advisory-data-driven
        universal_size_limit: forbidden
      ai_agent:
        owner: platform-engineering
        applies_to_all_sectors: true
        role: assistant
        authoritative_gate: false
        may_bypass_required_gates: false
        may_merge: false
        may_deploy_production_directly: false
        human_accountability: required
        user_centric_focus: required
        strong_version_control: required
        small_batch_delivery: required
        ai_stance: assist-with-human-verification
        internal_platform: quality-required
        data_ecosystem: healthy-required
        ai_accessible_internal_data: read-only-least-privilege-audited
  milestone_contract:
    M1-monorepo-bootstrap:
      outcome: stable-pr-driven-contract-locked
      implementation_required: false
      requires:
        - pr-governance
        - exact-sha-review-and-evidence
        - reproducible-bootstrap
        - affected-routing
        - application-qualification
        - frontend-go-templ-qualification
        - developer-platform-contract-locked
        - quality-cloud-engineering-contract-locked
      does_not_require:
        - backstage-deployed
        - crossplane-deployed
        - harbor-operational
        - fleet-previews-operational
        - argo-rollouts-operational
        - m4-tekton-runner-operational
    M4-platform-baseline:
      outcome: implement-pr-driven-platform-contract
      components:
        - backstage
        - tekton
        - harbor
        - rancher-fleet
        - cert-manager
        - kratix-oss
        - crossplane
        - argo-rollouts
    M5-commerce-vertical-slice:
      outcome: prove-first-pr-driven-preview-and-promotion

